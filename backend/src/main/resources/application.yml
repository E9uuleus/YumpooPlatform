spring:
  application:
    name: yumpoo-server
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    default-schema: yumpoo
    schemas:
      - yumpoo
    create-schemas: true
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  task:
    scheduling:
      thread-name-prefix: yumpoo-outbox-scheduler-
      pool:
        size: 1
  lifecycle:
    timeout-per-shutdown-phase: 45s

yumpoo:
  wecom:
    oauth:
      enabled: ${YUMPOO_WECOM_OAUTH_ENABLED:false}
      corp-id: ${YUMPOO_WECOM_OAUTH_CORP_ID:}
      agent-id: ${YUMPOO_WECOM_OAUTH_AGENT_ID:}
      app-secret: ${YUMPOO_WECOM_OAUTH_APP_SECRET:}
      callback-uri: ${YUMPOO_WECOM_OAUTH_CALLBACK_URI:}
      electron-callback-uri: ${YUMPOO_WECOM_ELECTRON_CALLBACK_URI:}
      connect-timeout: 5s
      read-timeout: 20s
      cleanup-delay: 1h
      purge-batch-size: 500
      purge-max-batches: 10
    directory:
      enabled: ${YUMPOO_WECOM_DIRECTORY_ENABLED:false}
      corp-id: ${YUMPOO_WECOM_CORP_ID:}
      directory-secret: ${YUMPOO_WECOM_DIRECTORY_SECRET:}
      profile-secret: ${YUMPOO_WECOM_PROFILE_SECRET:}
      page-size: 1000
      lease-duration: 5m
      connect-timeout: 5s
      read-timeout: 20s
  auth:
    local:
      enabled: ${YUMPOO_LOCAL_AUTH_ENABLED:false}
      member-id: ${YUMPOO_LOCAL_AUTH_MEMBER_ID:local-company-admin}
      display-name: ${YUMPOO_LOCAL_AUTH_DISPLAY_NAME:本地测试管理员}
      backup-member-id: ${YUMPOO_LOCAL_AUTH_BACKUP_MEMBER_ID:local-app-manager}
      backup-display-name: ${YUMPOO_LOCAL_AUTH_BACKUP_DISPLAY_NAME:本地测试应用管理员}
    controlled:
      enabled: ${YUMPOO_CONTROLLED_AUTH_ENABLED:false}
      corp-id: ${YUMPOO_CONTROLLED_AUTH_CORP_ID:}
      member-id: ${YUMPOO_CONTROLLED_AUTH_MEMBER_ID:}
  session:
    idle-timeout: ${YUMPOO_SESSION_IDLE_TIMEOUT:8h}
    absolute-timeout: ${YUMPOO_SESSION_ABSOLUTE_TIMEOUT:7d}
    revoked-retention: 24h
    cleanup-delay: 1h
    purge-batch-size: 500
    purge-max-batches: 10
    current-key-version: ${YUMPOO_SESSION_CURRENT_KEY_VERSION:local-v1}
    current-key: ${YUMPOO_SESSION_CURRENT_KEY:}
    previous-key-version: ${YUMPOO_SESSION_PREVIOUS_KEY_VERSION:}
    previous-key: ${YUMPOO_SESSION_PREVIOUS_KEY:}
    previous-accept-until: ${YUMPOO_SESSION_PREVIOUS_ACCEPT_UNTIL:}
  outbox:
    enabled: true
    poll-delay: 1s
    initial-delay: 1s
    batch-size: 50
    concurrency: 2
    lease-duration: 5m
  attachments:
    company-quota-bytes: ${YUMPOO_ATTACHMENT_COMPANY_QUOTA_BYTES:107374182400}
    project-quota-bytes: ${YUMPOO_ATTACHMENT_PROJECT_QUOTA_BYTES:10737418240}
    scan-concurrency: 2
    scan-lease: 5m
    upload-lease: 15m
    first-scan-retry: 5s
    second-scan-retry: 30s
    poll-delay: 500ms
    initial-delay: 1s
    attachment-root: ${YUMPOO_ATTACHMENT_ROOT:out/attachments}
    upload-temp-root: ${YUMPOO_UPLOAD_TEMP_ROOT:out/upload-temp}
    defender-executable: ${YUMPOO_DEFENDER_EXECUTABLE:}
    defender-timeout: 2m
  maintenance:
    app-manager:
      enabled: ${YUMPOO_APP_MANAGER_MAINTENANCE_ENABLED:false}
      mode: ${YUMPOO_APP_MANAGER_MAINTENANCE_MODE:}
      target-user-id: ${YUMPOO_APP_MANAGER_MAINTENANCE_TARGET_USER_ID:}
      reason-reference: ${YUMPOO_APP_MANAGER_MAINTENANCE_REASON_REFERENCE:}
  verification:
    m1-13:
      fixture-enabled: ${YUMPOO_M113_FIXTURE_ENABLED:false}
      backup-member-id: ${YUMPOO_M113_BACKUP_MEMBER_ID:}
  m012:
    evidence-hmac-key: ${YUMPOO_M012_EVIDENCE_HMAC_KEY:}
    wecom:
      enabled: ${YUMPOO_M012_WECOM_ENABLED:false}
      corp-id: ${YUMPOO_M012_WECOM_CORP_ID:}
      agent-id: ${YUMPOO_M012_WECOM_AGENT_ID:}
      app-secret: ${YUMPOO_M012_WECOM_APP_SECRET:}
      callback-uri: ${YUMPOO_M012_WECOM_CALLBACK_URI:}
      allowed-member-ids: ${YUMPOO_M012_WECOM_ALLOWED_MEMBER_IDS:}
  m015:
    evidence-hmac-key: ${YUMPOO_M015_EVIDENCE_HMAC_KEY:}
    wecom:
      enabled: ${YUMPOO_M015_WECOM_ENABLED:false}
      corp-id: ${YUMPOO_M015_WECOM_CORP_ID:}
      agent-id: ${YUMPOO_M015_WECOM_AGENT_ID:}
      app-secret: ${YUMPOO_M015_WECOM_APP_SECRET:}
      callback-uri: ${YUMPOO_M015_WECOM_CALLBACK_URI:}
      allowed-member-ids: ${YUMPOO_M015_WECOM_ALLOWED_MEMBER_IDS:}

logging:
  structured:
    format:
      console: logstash

server:
  address: 127.0.0.1
  port: ${YUMPOO_SERVER_PORT:8100}
  shutdown: graceful
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db
      show-details: never
      show-components: never
