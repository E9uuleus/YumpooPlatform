spring:
  application:
    name: yumpoo-server
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    default-schema: yumpoo
    schemas:
      - yumpoo
    create-schemas: true
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  task:
    scheduling:
      thread-name-prefix: yumpoo-outbox-scheduler-
      pool:
        size: 1

yumpoo:
  outbox:
    enabled: true
    poll-delay: 1s
    initial-delay: 1s
    batch-size: 50
    concurrency: 2
    lease-duration: 5m
  m012:
    evidence-hmac-key: ${YUMPOO_M012_EVIDENCE_HMAC_KEY:}
    wecom:
      enabled: ${YUMPOO_M012_WECOM_ENABLED:false}
      corp-id: ${YUMPOO_M012_WECOM_CORP_ID:}
      agent-id: ${YUMPOO_M012_WECOM_AGENT_ID:}
      app-secret: ${YUMPOO_M012_WECOM_APP_SECRET:}
      callback-uri: ${YUMPOO_M012_WECOM_CALLBACK_URI:}
      allowed-member-ids: ${YUMPOO_M012_WECOM_ALLOWED_MEMBER_IDS:}
  m015:
    evidence-hmac-key: ${YUMPOO_M015_EVIDENCE_HMAC_KEY:}
    wecom:
      enabled: ${YUMPOO_M015_WECOM_ENABLED:false}
      corp-id: ${YUMPOO_M015_WECOM_CORP_ID:}
      agent-id: ${YUMPOO_M015_WECOM_AGENT_ID:}
      app-secret: ${YUMPOO_M015_WECOM_APP_SECRET:}
      callback-uri: ${YUMPOO_M015_WECOM_CALLBACK_URI:}
      allowed-member-ids: ${YUMPOO_M015_WECOM_ALLOWED_MEMBER_IDS:}

logging:
  structured:
    format:
      console: logstash

server:
  address: 127.0.0.1
  port: ${YUMPOO_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db
      show-details: never
