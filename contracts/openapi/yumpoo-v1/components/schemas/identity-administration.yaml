components:
  schemas:
    Company:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - timezone
        - weekStartDay
        - defaultWorkdayMinutes
        - rowVersion
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          type: string
          minLength: 1
          example: Asia/Shanghai
        weekStartDay:
          type: string
          enum:
            - MONDAY
        defaultWorkdayMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 720
        rowVersion:
          type: integer
          format: int64
          minimum: 0
    CompanyUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
    WeComOAuthStatus:
      type: object
      additionalProperties: false
      required:
        - enabled
        - configured
        - corpIdMasked
        - agentIdConfigured
        - appSecretConfigured
        - callbackConfigured
      properties:
        enabled:
          type: boolean
        configured:
          type: boolean
        corpIdMasked:
          type: string
          nullable: true
        agentIdConfigured:
          type: boolean
        appSecretConfigured:
          type: boolean
        callbackConfigured:
          type: boolean
    WeComDirectoryStatus:
      type: object
      additionalProperties: false
      required:
        - enabled
        - configured
        - corpIdMasked
        - directorySecretConfigured
        - profileSecretConfigured
      properties:
        enabled:
          type: boolean
        configured:
          type: boolean
        corpIdMasked:
          type: string
          nullable: true
        directorySecretConfigured:
          type: boolean
        profileSecretConfigured:
          type: boolean
    WeComIntegrationStatus:
      type: object
      additionalProperties: false
      required:
        - oauth
        - directory
        - corpIdConsistent
        - activeRunId
        - lastSuccessfulRunAt
        - lastProblemAt
        - lastProblemCode
      properties:
        oauth:
          $ref: "#/components/schemas/WeComOAuthStatus"
        directory:
          $ref: "#/components/schemas/WeComDirectoryStatus"
        corpIdConsistent:
          type: boolean
        activeRunId:
          type: string
          format: uuid
          nullable: true
        lastSuccessfulRunAt:
          type: string
          format: date-time
          nullable: true
        lastProblemAt:
          type: string
          format: date-time
          nullable: true
        lastProblemCode:
          type: string
          nullable: true
    Member:
      type: object
      additionalProperties: false
      required:
        - userId
        - displayName
        - externalUserId
        - email
        - mobile
        - departmentSummary
        - employmentStatus
        - accountStatus
        - directorySyncedAt
        - leftAt
        - accountDisabledAt
        - accountDisabledByUserId
        - platformRoles
        - authorizationVersion
        - rowVersion
        - etag
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        externalUserId:
          type: string
          minLength: 1
          maxLength: 256
        email:
          type: string
          nullable: true
        mobile:
          type: string
          nullable: true
        departmentSummary:
          type: string
          nullable: true
        employmentStatus:
          $ref: "#/components/schemas/EmploymentStatus"
        accountStatus:
          $ref: "#/components/schemas/AccountStatus"
        directorySyncedAt:
          $ref: "#/components/schemas/Instant"
        leftAt:
          type: string
          format: date-time
          nullable: true
        accountDisabledAt:
          type: string
          format: date-time
          nullable: true
        accountDisabledByUserId:
          type: string
          format: uuid
          nullable: true
        platformRoles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ManagedPlatformRole"
        authorizationVersion:
          type: integer
          format: int64
          minimum: 0
        rowVersion:
          type: integer
          format: int64
          minimum: 0
        etag:
          type: string
          pattern: ^"[0-9]+"$
    MemberPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
    DirectorySyncRunStatus:
      type: string
      enum:
        - RUNNING
        - SUCCEEDED
        - PARTIALLY_SUCCEEDED
        - FAILED
    DirectorySyncTriggerType:
      type: string
      enum:
        - MANUAL
        - SCHEDULED
    DirectorySyncCounts:
      type: object
      additionalProperties: false
      required:
        - discovered
        - staged
        - created
        - updated
        - unchanged
        - left
        - returned
        - failed
        - notApplied
      properties:
        discovered:
          type: integer
          format: int32
          minimum: 0
        staged:
          type: integer
          format: int32
          minimum: 0
        created:
          type: integer
          format: int32
          minimum: 0
        updated:
          type: integer
          format: int32
          minimum: 0
        unchanged:
          type: integer
          format: int32
          minimum: 0
        left:
          type: integer
          format: int32
          minimum: 0
        returned:
          type: integer
          format: int32
          minimum: 0
        failed:
          type: integer
          format: int32
          minimum: 0
        notApplied:
          type: integer
          format: int32
          minimum: 0
    DirectorySyncRun:
      type: object
      additionalProperties: false
      required:
        - runId
        - triggerType
        - triggeredByUserId
        - triggeredByDisplayName
        - phase
        - status
        - cursorTerminationMode
        - pageCount
        - scanComplete
        - counts
        - errorCode
        - errorSummary
        - requestId
        - rowVersion
        - startedAt
        - finishedAt
      properties:
        runId:
          $ref: "#/components/schemas/Uuid"
        triggerType:
          $ref: "#/components/schemas/DirectorySyncTriggerType"
        triggeredByUserId:
          type: string
          format: uuid
          nullable: true
        triggeredByDisplayName:
          type: string
          nullable: true
        phase:
          type: string
          enum:
            - COLLECTING_IDS
            - COLLECTING_PROFILES
            - APPLYING
            - FINALIZING
            - COMPLETED
        status:
          $ref: "#/components/schemas/DirectorySyncRunStatus"
        cursorTerminationMode:
          type: string
          nullable: true
          enum:
            - EXPLICIT_EMPTY
            - OMITTED_CONFIRMED
        pageCount:
          type: integer
          format: int32
          minimum: 0
        scanComplete:
          type: boolean
        counts:
          $ref: "#/components/schemas/DirectorySyncCounts"
        errorCode:
          type: string
          nullable: true
        errorSummary:
          type: string
          nullable: true
        requestId:
          $ref: "#/components/schemas/RequestId"
        rowVersion:
          type: integer
          format: int64
          minimum: 0
        startedAt:
          $ref: "#/components/schemas/Instant"
        finishedAt:
          type: string
          format: date-time
          nullable: true
    DirectorySyncRunPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DirectorySyncRun"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
    DirectorySyncFailure:
      type: object
      additionalProperties: false
      required:
        - maskedMemberReference
        - action
        - result
        - errorCode
      properties:
        maskedMemberReference:
          type: string
          minLength: 1
        action:
          type: string
          enum:
            - PROVISION
        result:
          type: string
          enum:
            - FAILED
            - NOT_APPLIED
        errorCode:
          type: string
          minLength: 1
    DirectorySyncFailurePage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DirectorySyncFailure"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
