components:
  schemas:
    Content:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - code
        - name
        - colorToken
        - sortOrder
        - active
        - protectedContent
        - inUse
        - rowVersion
        - createdAt
        - createdByUserId
        - updatedAt
        - updatedByUserId
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        projectId:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,31}$
        name:
          type: string
          minLength: 1
          maxLength: 80
        colorToken:
          $ref: "#/components/schemas/WorkItemLabelColorToken"
        sortOrder:
          type: integer
          format: int32
          minimum: 1
        active:
          type: boolean
        protectedContent:
          type: boolean
          readOnly: true
        inUse:
          type: boolean
          readOnly: true
        rowVersion:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdByUserId:
          $ref: "#/components/schemas/Uuid"
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedByUserId:
          $ref: "#/components/schemas/Uuid"
    ProjectContentCatalog:
      type: object
      additionalProperties: false
      required:
        - items
        - rowVersion
        - etag
        - canManage
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Content"
        rowVersion:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        etag:
          type: string
          pattern: ^"[0-9]+"$
          readOnly: true
        canManage:
          type: boolean
          readOnly: true
    ContentCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - colorToken
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        colorToken:
          $ref: "#/components/schemas/WorkItemLabelColorToken"
    ContentUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - colorToken
        - active
        - sortOrder
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          nullable: true
        colorToken:
          type: string
          allOf:
            - $ref: "#/components/schemas/WorkItemLabelColorToken"
          nullable: true
        active:
          type: boolean
          nullable: true
        sortOrder:
          type: integer
          format: int32
          minimum: 1
          nullable: true
