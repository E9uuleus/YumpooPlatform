components:
  schemas:
    WorkItemUpdateStatus:
      type: string
      enum:
        - PUBLISHED
        - EDITED
        - DELETED
    WorkItemUpdate:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - contentId
        - workItemId
        - authorUserId
        - authorDisplayName
        - bodyHtml
        - bodyText
        - status
        - rowVersion
        - etag
        - createdAt
        - editedAt
        - editedByUserId
        - deletedAt
        - deletedByUserId
        - parentUpdateId
        - pinnedAt
        - pinnedByUserId
        - replyCount
        - replies
        - repliesNextCursor
        - capabilities
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        projectId:
          $ref: "#/components/schemas/Uuid"
        contentId:
          $ref: "#/components/schemas/Uuid"
        workItemId:
          $ref: "#/components/schemas/Uuid"
        authorUserId:
          $ref: "#/components/schemas/Uuid"
        authorDisplayName:
          type: string
          minLength: 1
          maxLength: 200
        bodyHtml:
          type: string
          minLength: 1
          maxLength: 65536
          nullable: true
        bodyText:
          type: string
          minLength: 1
          maxLength: 16384
          nullable: true
          description: 正文摘要；纯图片正文为 [图片]。
        status:
          $ref: "#/components/schemas/WorkItemUpdateStatus"
        rowVersion:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        etag:
          type: string
          pattern: ^"[0-9]+"$
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        editedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        editedByUserId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        deletedByUserId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        parentUpdateId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        pinnedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        pinnedByUserId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        replyCount:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        replies:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemUpdate"
        repliesNextCursor:
          type: string
          maxLength: 256
          nullable: true
        capabilities:
          $ref: "#/components/schemas/WorkItemUpdateCapabilities"
    WorkItemUpdateCapabilities:
      type: object
      additionalProperties: false
      required:
        - canEdit
        - canDelete
        - canReply
        - canPin
      properties:
        canEdit:
          type: boolean
          readOnly: true
        canDelete:
          type: boolean
          readOnly: true
        canReply:
          type: boolean
          readOnly: true
        canPin:
          type: boolean
          readOnly: true
    WorkItemUpdatePage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
        - pinnedItems
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemUpdate"
        nextCursor:
          type: string
          maxLength: 256
          nullable: true
        pinnedItems:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemUpdate"
    WorkItemUpdateCreateRequest:
      type: object
      additionalProperties: false
      required:
        - bodyHtml
      properties:
        parentUpdateId:
          type: string
          format: uuid
          nullable: true
          description: 省略时发布主评论；指定时仅允许回复同一工作项的未删除主评论。
        bodyHtml:
          type: string
          description: 未受信任的协作富文本；净化后 HTML 最多 65536 字符、纯文本最多 16384 字符，须有文字或合法图片；纯图片的 bodyText 为 [图片]。 允许 p/br/strong/em/u/s/h2/pre/hr/ul/ol/li/blockquote/code/a/span/table/thead/tbody/tr/th/td/img。 span 仅保留受限的 color/background-color（十六进制或 0–255 整数 rgb）和 font-size（16/18/24/32/36/48px）； p/h2 仅允许 text-align 为 left/center/right；p/h2/pre/blockquote/li 的 dir 仅允许 ltr/rtl。 表格单元格 rowspan/colspan 为 1–20，ol.start 为 1–10000。 清单使用 ul[data-type=taskList] 与直接子 li[data-type=taskItem][data-checked=true|false]，已发布正文只读。 Mention 使用 span[data-type=mention][data-mention-user-id=UUID]，由服务端校验 ACTIVE 项目成员并重写显示名。 图片仅允许 img[src,alt]，src 须精确匹配同源 /api/v1/attachments/{uuid}/content，alt 截断至 255 字符。 文件卡片使用 a[data-type=attachment][href][data-size]，href 须精确匹配同一附件内容路径，不加 target； data-size 仅保留 1–104857600 的整数。其余链接仅允许绝对 http/https/mailto。 移除任意 class、事件、未知样式及未允许标签。客户端仅展示净化响应。
    WorkItemUpdateEditRequest:
      type: object
      additionalProperties: false
      required:
        - bodyHtml
      properties:
        bodyHtml:
          type: string
          description: 未受信任的编辑正文；格式白名单与 WorkItemUpdateCreateRequest.bodyHtml 相同，服务端重新净化并从正文解析 Mention。
    WorkItemUpdateDeleteRequest:
      type: object
      additionalProperties: false
      properties: {}
    WorkItemUpdatePinRequest:
      type: object
      additionalProperties: false
      required:
        - pinned
      properties:
        pinned:
          type: boolean
