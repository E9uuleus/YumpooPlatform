components:
  schemas:
    MigratedTimeImportEntry:
      type: object
      additionalProperties: false
      required:
        - userId
        - workDate
        - minutes
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        workDate:
          type: string
          format: date
          description: 公司时区的自然日。
        minutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 1440
          description: 当天总分钟数；0 表示清除当天已有的迁入工时。
    MigratedTimeImportRequest:
      type: object
      additionalProperties: false
      required:
        - dryRun
        - entries
      properties:
        dryRun:
          type: boolean
        categoryProjectId:
          type: string
          format: uuid
          nullable: true
          description: 可选的关联项目，必须是本公司 ACTIVE 状态的项目。
        entries:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            $ref: "#/components/schemas/MigratedTimeImportEntry"
          description: (userId, workDate) 不得重复。
    MigratedTimeImportOutcome:
      type: string
      enum:
        - IMPORT
        - CLEAR
        - ERROR
    MigratedTimeImportIssue:
      type: object
      additionalProperties: false
      required:
        - code
        - detail
      properties:
        code:
          type: string
          minLength: 1
          description: 稳定问题代码，例如 USER_INVALID、NOT_ENOUGH_FREE_TIME、PAST_WORKDAY_END、FUTURE_DATE、REPLACES_PREVIOUS。
        detail:
          type: string
          nullable: true
    MigratedTimeImportDay:
      type: object
      additionalProperties: false
      required:
        - userId
        - workDate
        - minutes
        - outcome
        - segmentCount
        - issues
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        workDate:
          type: string
          format: date
        minutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 1440
        outcome:
          $ref: "#/components/schemas/MigratedTimeImportOutcome"
        startedAt:
          type: string
          format: date-time
          description: 排布后的首段起点；CLEAR 与 ERROR 时缺省。
        stoppedAt:
          type: string
          format: date-time
          description: 排布后的末段终点；CLEAR 与 ERROR 时缺省。
        segmentCount:
          type: integer
          format: int32
          minimum: 0
        issues:
          type: array
          items:
            $ref: "#/components/schemas/MigratedTimeImportIssue"
    MigratedTimeImportResult:
      type: object
      additionalProperties: false
      required:
        - dryRun
        - importedDayCount
        - clearedDayCount
        - failedDayCount
        - importedMinutes
        - replacedMinutes
        - days
      properties:
        dryRun:
          type: boolean
        importedDayCount:
          type: integer
          format: int32
          minimum: 0
        clearedDayCount:
          type: integer
          format: int32
          minimum: 0
        failedDayCount:
          type: integer
          format: int32
          minimum: 0
        importedMinutes:
          type: integer
          format: int64
          minimum: 0
        replacedMinutes:
          type: integer
          format: int64
          minimum: 0
          description: 被覆盖或清除的原有迁入工时分钟数。
        days:
          type: array
          items:
            $ref: "#/components/schemas/MigratedTimeImportDay"
