components:
  schemas:
    MigratedTimeImportRow:
      type: object
      additionalProperties: false
      required:
        - userId
        - workDate
        - projectName
        - workItemTitle
        - minutes
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        workDate:
          type: string
          format: date
          description: 公司时区的自然日。
        projectName:
          type: string
          maxLength: 200
          description: 原平台的所属项目；去掉两端空白后与本公司 ACTIVE 项目的名称完全相同才匹配。
        workItemTitle:
          type: string
          maxLength: 1000
          description: 原平台的工作项标题；去掉两端空白后与该项目内未删除的工作项（含已归档）的标题完全相同才匹配。
        minutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 1440
    MigratedTimeImportRequest:
      type: object
      additionalProperties: false
      required:
        - dryRun
        - rows
      properties:
        dryRun:
          type: boolean
        rows:
          type: array
          minItems: 1
          maxItems: 20000
          items:
            $ref: "#/components/schemas/MigratedTimeImportRow"
          description: 按文件顺序；同一成员同一天匹配到的行按此顺序依次排入空档。同一成员同一天的合计不得超过 1440 分钟。
    MigratedTimeImportOutcome:
      type: string
      enum:
        - IMPORT
        - ERROR
    MigratedTimeImportIssue:
      type: object
      additionalProperties: false
      required:
        - code
        - detail
      properties:
        code:
          type: string
          minLength: 1
          description: 稳定问题代码，例如 USER_INVALID、DAY_HAS_TIME、NOT_ENOUGH_FREE_TIME、PAST_WORKDAY_END、FUTURE_DATE、REPLACES_PREVIOUS。
        detail:
          type: string
          nullable: true
    MigratedTimeImportSkippedRow:
      type: object
      additionalProperties: false
      required:
        - index
        - code
      properties:
        index:
          type: integer
          format: int32
          minimum: 0
          description: 该行在请求 rows 中的位置，从 0 开始。
        code:
          type: string
          minLength: 1
          description: PROJECT_NOT_FOUND、PROJECT_AMBIGUOUS、WORK_ITEM_NOT_FOUND、WORK_ITEM_AMBIGUOUS 或 NOT_PROJECT_MEMBER。
    MigratedTimeImportDay:
      type: object
      additionalProperties: false
      required:
        - userId
        - workDate
        - minutes
        - outcome
        - segmentCount
        - issues
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        workDate:
          type: string
          format: date
        minutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 1440
        outcome:
          $ref: "#/components/schemas/MigratedTimeImportOutcome"
        startedAt:
          type: string
          format: date-time
          description: 排布后的首段起点；ERROR 时缺省。
        stoppedAt:
          type: string
          format: date-time
          description: 排布后的末段终点；ERROR 时缺省。
        segmentCount:
          type: integer
          format: int32
          minimum: 0
        issues:
          type: array
          items:
            $ref: "#/components/schemas/MigratedTimeImportIssue"
    MigratedTimeImportResult:
      type: object
      additionalProperties: false
      required:
        - dryRun
        - importedDayCount
        - failedDayCount
        - importedMinutes
        - replacedMinutes
        - skippedMinutes
        - days
        - skippedRows
      properties:
        dryRun:
          type: boolean
        importedDayCount:
          type: integer
          format: int32
          minimum: 0
        failedDayCount:
          type: integer
          format: int32
          minimum: 0
        importedMinutes:
          type: integer
          format: int64
          minimum: 0
        replacedMinutes:
          type: integer
          format: int64
          minimum: 0
          description: 被覆盖的原有迁入工时分钟数。
        skippedMinutes:
          type: integer
          format: int64
          minimum: 0
          description: skippedRows 的分钟合计，这些行不写入。
        days:
          type: array
          items:
            $ref: "#/components/schemas/MigratedTimeImportDay"
        skippedRows:
          type: array
          items:
            $ref: "#/components/schemas/MigratedTimeImportSkippedRow"
