components:
  schemas:
    ProjectLifecycleFilter:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
        - ALL
      default: ALL
    ProjectActorAccess:
      type: string
      enum:
        - OWNER
        - MEMBER
        - COMPANY_ADMIN
    ProjectCapabilities:
      type: object
      additionalProperties: false
      required:
        - canUpdateSettings
        - canManageMembers
        - canReassignOwner
        - canArchive
        - canRestore
        - canMoveWorkspace
        - canOverrideArchive
      properties:
        canUpdateSettings:
          type: boolean
          readOnly: true
        canManageMembers:
          type: boolean
          readOnly: true
        canReassignOwner:
          type: boolean
          readOnly: true
        canArchive:
          type: boolean
          readOnly: true
        canRestore:
          type: boolean
          readOnly: true
        canMoveWorkspace:
          type: boolean
          readOnly: true
          deprecated: true
          description: v1 兼容字段；MAIN 单例启用后永远为 false。
        canOverrideArchive:
          type: boolean
          readOnly: true
        canScheduleDeletion:
          type: boolean
          readOnly: true
        canCancelDeletion:
          type: boolean
          readOnly: true
    ProjectDeletion:
      type: object
      additionalProperties: false
      required:
        - requestedAt
        - requestedBy
        - purgeAfter
      properties:
        requestedAt:
          type: string
          format: date-time
          readOnly: true
        requestedBy:
          $ref: "#/components/schemas/Uuid"
        purgeAfter:
          type: string
          format: date-time
          readOnly: true
    ProjectDeletionRequest:
      type: object
      additionalProperties: false
      required:
        - confirmationCode
      properties:
        confirmationCode:
          type: string
          minLength: 2
          maxLength: 32
    ProjectDeletionMutation:
      type: object
      additionalProperties: false
      required:
        - id
        - lifecycle
        - rowVersion
        - etag
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        lifecycle:
          $ref: "#/components/schemas/ProjectLifecycle"
        rowVersion:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        etag:
          type: string
          pattern: ^"[0-9]+"$
          readOnly: true
        deletion:
          $ref: "#/components/schemas/ProjectDeletion"
    ProjectWorkspaceMoveRequest:
      type: object
      additionalProperties: false
      required:
        - targetWorkspaceId
        - reason
      properties:
        targetWorkspaceId:
          $ref: "#/components/schemas/Uuid"
        reason:
          type: string
          minLength: 10
          maxLength: 500
    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - code
        - name
        - description
        - lifecycle
        - ownerUserId
        - rowVersion
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        workspaceId:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
          minLength: 2
          maxLength: 32
          pattern: ^[A-Z][A-Z0-9_]{1,31}$
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
          nullable: true
        lifecycle:
          $ref: "#/components/schemas/ProjectLifecycle"
        ownerUserId:
          $ref: "#/components/schemas/Uuid"
        rowVersion:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
    ProjectCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
          nullable: true
    ProjectSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - workspaceCode
        - workspaceName
        - code
        - name
        - lifecycle
        - ownerUserId
        - ownerDisplayName
        - actorAccess
        - capabilities
        - rowVersion
        - etag
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        workspaceId:
          $ref: "#/components/schemas/Uuid"
        workspaceCode:
          type: string
          minLength: 2
          maxLength: 32
        workspaceName:
          type: string
          minLength: 1
          maxLength: 80
        code:
          type: string
          minLength: 2
          maxLength: 32
          pattern: ^[A-Z][A-Z0-9_]{1,31}$
        name:
          type: string
          minLength: 1
          maxLength: 80
        lifecycle:
          $ref: "#/components/schemas/ProjectLifecycle"
        ownerUserId:
          $ref: "#/components/schemas/Uuid"
        ownerDisplayName:
          type: string
          minLength: 1
          maxLength: 200
        actorAccess:
          $ref: "#/components/schemas/ProjectActorAccess"
        capabilities:
          $ref: "#/components/schemas/ProjectCapabilities"
        rowVersion:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        etag:
          type: string
          pattern: ^"[0-9]+"$
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        deletion:
          $ref: "#/components/schemas/ProjectDeletion"
        archivedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
    ProjectOwnerOption:
      type: object
      additionalProperties: false
      required:
        - userId
        - displayName
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        displayName:
          type: string
          minLength: 1
          maxLength: 200
    ProjectPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          additionalProperties: false
          required:
            - workspaceCode
            - workspaceName
            - ownerDisplayName
            - actorAccess
            - capabilities
            - etag
            - createdAt
            - updatedAt
            - archivedAt
          properties:
            workspaceCode:
              type: string
              minLength: 2
              maxLength: 32
            workspaceName:
              type: string
              minLength: 1
              maxLength: 80
            ownerDisplayName:
              type: string
              minLength: 1
              maxLength: 200
            actorAccess:
              $ref: "#/components/schemas/ProjectActorAccess"
            capabilities:
              $ref: "#/components/schemas/ProjectCapabilities"
            etag:
              type: string
              pattern: ^"[0-9]+"$
              readOnly: true
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true
            archivedAt:
              type: string
              format: date-time
              nullable: true
              readOnly: true
            deletion:
              $ref: "#/components/schemas/ProjectDeletion"
    ProjectUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
          nullable: true
    ProjectMembershipStatus:
      type: string
      enum:
        - ACTIVE
        - REMOVED
    ProjectMembershipStatusFilter:
      type: string
      enum:
        - ACTIVE
        - REMOVED
        - ALL
      default: ALL
    ProjectMember:
      type: object
      additionalProperties: false
      required:
        - membershipId
        - projectId
        - userId
        - displayName
        - employmentStatus
        - accountStatus
        - membershipStatus
        - owner
        - joinedAt
        - joinedByUserId
        - removedAt
        - removedByUserId
        - rowVersion
        - etag
      properties:
        membershipId:
          $ref: "#/components/schemas/Uuid"
        projectId:
          $ref: "#/components/schemas/Uuid"
        userId:
          $ref: "#/components/schemas/Uuid"
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        employmentStatus:
          type: string
          enum:
            - ACTIVE
            - LEFT
        accountStatus:
          type: string
          enum:
            - ENABLED
            - DISABLED
        membershipStatus:
          $ref: "#/components/schemas/ProjectMembershipStatus"
        owner:
          type: boolean
        joinedAt:
          type: string
          format: date-time
        joinedByUserId:
          $ref: "#/components/schemas/Uuid"
        removedAt:
          type: string
          format: date-time
          nullable: true
        removedByUserId:
          type: string
          format: uuid
          nullable: true
        rowVersion:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        etag:
          type: string
          pattern: ^"[0-9]+"$
          readOnly: true
    ProjectMemberPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ProjectMemberCandidate:
      type: object
      additionalProperties: false
      required:
        - userId
        - displayName
        - employmentStatus
        - accountStatus
        - membershipStatus
        - owner
        - membershipRowVersion
        - membershipEtag
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        employmentStatus:
          type: string
          enum:
            - ACTIVE
        accountStatus:
          type: string
          enum:
            - ENABLED
        membershipStatus:
          type: string
          enum:
            - ACTIVE
            - REMOVED
          nullable: true
        owner:
          type: boolean
        membershipRowVersion:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        membershipEtag:
          type: string
          pattern: ^"[0-9]+"$
          nullable: true
    ProjectMemberCandidatePage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMemberCandidate"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ProjectMemberAddRequest:
      type: object
      additionalProperties: false
      required:
        - userId
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        reason:
          type: string
          maxLength: 500
          nullable: true
    ProjectMemberRemoveRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
          nullable: true
    ProjectOwnerReassignmentRequest:
      type: object
      additionalProperties: false
      required:
        - newOwnerUserId
        - reason
      properties:
        newOwnerUserId:
          $ref: "#/components/schemas/Uuid"
        reason:
          type: string
          minLength: 10
          maxLength: 500
