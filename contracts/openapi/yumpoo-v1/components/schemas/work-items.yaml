components:
  schemas:
    ConnectColumnIncoming:
      type: object
      additionalProperties: false
      description: 以当前项目为目标的其他项目连接列，目标项目据此渲染双向连接的反向列。
      required:
        - columnId
        - columnName
        - projectId
        - projectCode
        - projectName
        - projectLifecycle
        - actorCanLinkExisting
      properties:
        columnId:
          $ref: "#/components/schemas/Uuid"
        columnName:
          type: string
          minLength: 1
          maxLength: 40
        projectId:
          $ref: "#/components/schemas/Uuid"
        projectCode:
          type: string
          minLength: 1
        projectName:
          type: string
          minLength: 1
        projectLifecycle:
          $ref: "#/components/schemas/ProjectLifecycle"
        actorCanLinkExisting:
          type: boolean
          description: 当前用户是两端项目 OWNER/MEMBER 且两端 ACTIVE，可从反向列关联、新建或搜索。
        available:
          type: boolean
          description: false 表示归档来源项目对当前用户不可见，项目名称、编码及列名返回不可访问占位值。
    ConnectColumnTarget:
      type: object
      additionalProperties: false
      required:
        - projectId
        - code
        - name
        - lifecycle
        - actorCanLinkExisting
      properties:
        projectId:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        lifecycle:
          $ref: "#/components/schemas/ProjectLifecycle"
        actorCanLinkExisting:
          type: boolean
          description: 当前用户是来源及目标项目 OWNER/MEMBER，且双方 ACTIVE。
        available:
          type: boolean
          description: false 表示归档目标项目对当前用户不可见，项目名称及编码返回不可访问占位值。
    ConnectColumn:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - name
        - targets
        - rowVersion
        - etag
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        projectId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
          maxLength: 40
        targets:
          type: array
          items:
            $ref: "#/components/schemas/ConnectColumnTarget"
          minItems: 0
          maxItems: 20
          description: 永久清除目标项目后，保留的连接列可以暂时没有目标；创建与更新仍要求1–20个目标。
        rowVersion:
          type: integer
          format: int64
          minimum: 0
        etag:
          type: string
          pattern: ^"[0-9]+"$
        createdAt:
          type: string
          format: date-time
    ConnectColumnCatalog:
      type: object
      additionalProperties: false
      required:
        - items
        - incomingAvailable
        - incomingColumns
        - canManage
        - canDelete
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConnectColumn"
          maxItems: 20
        incomingAvailable:
          type: boolean
        incomingColumns:
          type: array
          items:
            $ref: "#/components/schemas/ConnectColumnIncoming"
        canManage:
          type: boolean
        canDelete:
          type: boolean
      description: 来源项目可见；入站列只暴露项目与列的最小名称信息。
    ConnectColumnCreateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - targetProjectIds
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        targetProjectIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
          minItems: 1
          maxItems: 20
          uniqueItems: true
    ConnectColumnUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - targetProjectIds
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        targetProjectIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
          minItems: 1
          maxItems: 20
          uniqueItems: true
    ConnectColumnDeleteResult:
      type: object
      additionalProperties: false
      required:
        - columnId
        - removedConnectionCount
      properties:
        columnId:
          $ref: "#/components/schemas/Uuid"
        removedConnectionCount:
          type: integer
          format: int64
          minimum: 0
    ConnectTargetProject:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    ConnectTargetProjectPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConnectTargetProject"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 50
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ConnectionCardStatus:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - colorToken
        - category
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 80
        colorToken:
          $ref: "#/components/schemas/WorkItemLabelColorToken"
        category:
          $ref: "#/components/schemas/WorkItemStatusCategory"
    ConnectionCardCategory:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - colorToken
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
        colorToken:
          $ref: "#/components/schemas/WorkItemLabelColorToken"
    ConnectionCardAssignee:
      type: object
      additionalProperties: false
      required:
        - userId
        - displayName
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        displayName:
          type: string
          minLength: 1
    ConnectionCard:
      type: object
      additionalProperties: false
      required:
        - workItemId
        - itemNo
        - title
        - archived
        - projectId
        - projectCode
        - projectName
        - projectLifecycle
        - status
        - priority
        - category
        - assignee
        - canOpen
      properties:
        workItemId:
          $ref: "#/components/schemas/Uuid"
        itemNo:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
        archived:
          type: boolean
        projectId:
          $ref: "#/components/schemas/Uuid"
        projectCode:
          type: string
          minLength: 1
        projectName:
          type: string
          minLength: 1
        projectLifecycle:
          $ref: "#/components/schemas/ProjectLifecycle"
        status:
          $ref: "#/components/schemas/ConnectionCardStatus"
        priority:
          type: object
          additionalProperties: false
          required:
            - code
            - name
            - colorToken
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 32
            name:
              type: string
              minLength: 1
              maxLength: 80
            colorToken:
              $ref: "#/components/schemas/WorkItemLabelColorToken"
          nullable: true
        category:
          $ref: "#/components/schemas/ConnectionCardCategory"
        assignee:
          type: object
          additionalProperties: false
          required:
            - userId
            - displayName
          properties:
            userId:
              $ref: "#/components/schemas/Uuid"
            displayName:
              type: string
              minLength: 1
          nullable: true
        canOpen:
          type: boolean
          description: 当前用户能看见该卡片所在项目。
        available:
          type: boolean
          description: false 表示归档项目对当前用户不可见。除连接已持有的端点 ID 外，真实卡片内容返回不可访问占位值。
      description: 连接授权的只读卡片。ACTIVE 项目保持跨项目最小卡片授权；ARCHIVED 项目仅负责人或 CompanyAdmin 可读取真实卡片。省略 available 视为 true。
    WorkItemConnectionCapabilities:
      type: object
      additionalProperties: false
      required:
        - canUnlink
      properties:
        canUnlink:
          type: boolean
    WorkItemConnection:
      type: object
      additionalProperties: false
      required:
        - id
        - etag
        - rowVersion
        - columnId
        - columnName
        - origin
        - active
        - source
        - target
        - createdAt
        - createdBy
        - capabilities
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        etag:
          type: string
          pattern: ^"[0-9]+"$
        rowVersion:
          type: integer
          format: int64
          minimum: 0
        columnId:
          $ref: "#/components/schemas/Uuid"
        columnName:
          type: string
          minLength: 1
          maxLength: 40
        origin:
          type: string
          enum:
            - LINKED
            - CREATED
        active:
          type: boolean
        source:
          $ref: "#/components/schemas/ConnectionCard"
        target:
          $ref: "#/components/schemas/ConnectionCard"
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/ConnectionCardAssignee"
        capabilities:
          $ref: "#/components/schemas/WorkItemConnectionCapabilities"
    WorkItemConnectionOutgoing:
      type: object
      additionalProperties: false
      required:
        - columnId
        - connections
      properties:
        columnId:
          $ref: "#/components/schemas/Uuid"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemConnection"
          minItems: 1
          maxItems: 50
    WorkItemConnectionIncomingColumn:
      type: object
      additionalProperties: false
      required:
        - columnId
        - connections
        - total
      properties:
        columnId:
          $ref: "#/components/schemas/Uuid"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemConnection"
          minItems: 1
          maxItems: 50
        total:
          type: integer
          format: int64
          minimum: 1
    WorkItemConnectionCell:
      type: object
      additionalProperties: false
      required:
        - workItemId
        - outgoing
        - incoming
        - incomingTotal
        - incomingByColumn
      properties:
        workItemId:
          $ref: "#/components/schemas/Uuid"
        outgoing:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemConnectionOutgoing"
          maxItems: 20
        incoming:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemConnection"
          maxItems: 50
        incomingTotal:
          type: integer
          format: int64
          minimum: 0
        incomingByColumn:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemConnectionIncomingColumn"
    WorkItemConnectionCellList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemConnectionCell"
          maxItems: 100
    WorkItemConnectionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemConnection"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 50
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ConnectCreateOptions:
      type: object
      additionalProperties: false
      required:
        - targetProjectId
        - targetProjectName
        - categories
        - defaultContentId
      properties:
        targetProjectId:
          $ref: "#/components/schemas/Uuid"
        targetProjectName:
          type: string
          minLength: 1
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionCardCategory"
          minItems: 1
        defaultContentId:
          $ref: "#/components/schemas/Uuid"
    ConnectCandidate:
      type: object
      additionalProperties: false
      required:
        - card
        - parent
        - alreadyConnected
      properties:
        card:
          $ref: "#/components/schemas/ConnectionCard"
        parent:
          type: object
          additionalProperties: false
          required:
            - workItemId
            - title
          properties:
            workItemId:
              $ref: "#/components/schemas/Uuid"
            title:
              type: string
              minLength: 1
              maxLength: 300
          nullable: true
        alreadyConnected:
          type: boolean
    ConnectCandidatePage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConnectCandidate"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 20
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    WorkItemConnectionLinkRequest:
      type: object
      additionalProperties: false
      required:
        - columnId
        - targetWorkItemId
      properties:
        columnId:
          $ref: "#/components/schemas/Uuid"
        targetWorkItemId:
          $ref: "#/components/schemas/Uuid"
    ConnectedWorkItemCreateRequest:
      type: object
      additionalProperties: false
      required:
        - columnId
        - targetProjectId
        - title
      properties:
        columnId:
          $ref: "#/components/schemas/Uuid"
        targetProjectId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
          minLength: 1
          maxLength: 300
        contentId:
          type: string
          format: uuid
          nullable: true
    ReverseConnectedWorkItemCreateRequest:
      type: object
      additionalProperties: false
      required:
        - columnId
        - title
      properties:
        columnId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
          minLength: 1
          maxLength: 300
        contentId:
          type: string
          format: uuid
          nullable: true
    ConnectCandidateField:
      type: string
      enum:
        - NAME
        - ASSIGNEE
        - STATUS
        - PRIORITY
        - CONTENT
    ConnectCandidateSort:
      type: string
      enum:
        - RECENT
        - TITLE
    ConnectTargetInUseDetails:
      type: object
      additionalProperties: false
      required:
        - reason
        - targetProjectId
        - activeConnectionCount
      properties:
        reason:
          type: string
          enum:
            - CONNECT_TARGET_IN_USE
        targetProjectId:
          $ref: "#/components/schemas/Uuid"
        activeConnectionCount:
          type: integer
          format: int64
          minimum: 1
    ConnectTargetInUseError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
        - retryable
        - fieldErrors
        - details
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
          description: 面向当前用户的安全错误说明。
        requestId:
          $ref: "#/components/schemas/RequestId"
        retryable:
          type: boolean
          description: 当前请求是否可在不改变业务意图的前提下自动重试。
        fieldErrors:
          type: array
          description: 字段级错误；非字段校验错误固定为空数组。
          items:
            $ref: "#/components/schemas/FieldError"
        details:
          $ref: "#/components/schemas/ConnectTargetInUseDetails"
    WorkItemTableHeight:
      type: string
      enum:
        - SINGLE
        - DOUBLE
        - TRIPLE
      description: 表头或行的高度档位，SINGLE 为默认单行。
    WorkItemColoringTarget:
      type: string
      enum:
        - CELL
        - ROW
    WorkItemColoringColumn:
      type: string
      enum:
        - TITLE
        - ASSIGNEE
        - STATUS
        - PRIORITY
        - CONTENT
        - DUE_DATE
    WorkItemColoringOperator:
      type: string
      enum:
        - IS
        - IS_NOT
        - IS_EMPTY
        - IS_NOT_EMPTY
        - CONTAINS
        - NOT_CONTAINS
        - PAST
        - TODAY
        - BEFORE
        - AFTER
    WorkItemColoringRule:
      type: object
      additionalProperties: false
      required:
        - id
        - target
        - colorToken
        - column
        - operator
        - values
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        target:
          $ref: "#/components/schemas/WorkItemColoringTarget"
        colorToken:
          $ref: "#/components/schemas/WorkItemLabelColorToken"
        column:
          type: string
          allOf:
            - $ref: "#/components/schemas/WorkItemColoringColumn"
          nullable: true
          description: null 表示规则尚未填写完整，不生效。
        operator:
          type: string
          allOf:
            - $ref: "#/components/schemas/WorkItemColoringOperator"
          nullable: true
        values:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: IS/IS_NOT 为成员 ID、标签代码或类别 ID；CONTAINS/NOT_CONTAINS 为一段文本；BEFORE/AFTER 为一个 YYYY-MM-DD 日期；其余运算符为空数组。
    WorkItemCreateDefaultValues:
      type: object
      additionalProperties: false
      required:
        - assigneeUserIds
        - statusCode
        - priority
        - contentId
        - dueDateOffsetDays
      properties:
        assigneeUserIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        statusCode:
          type: string
          nullable: true
          pattern: ^[A-Z][A-Z0-9_]{1,31}$
          description: 创建后迁移到的状态代码。
        priority:
          type: string
          nullable: true
          pattern: ^[A-Z][A-Z0-9_]{1,31}$
        contentId:
          type: string
          format: uuid
          nullable: true
        dueDateOffsetDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 365
          nullable: true
          description: null 为不设置；0 为创建当天（企业时区）。
    WorkItemGroupingField:
      type: string
      enum:
        - ASSIGNEE
        - STATUS
        - PRIORITY
        - CONTENT
        - DUE_DATE
    WorkItemGroupingOrder:
      type: string
      enum:
        - DEFAULT
        - REVERSE_DEFAULT
        - NAME_ASC
        - NAME_DESC
        - DATE_ASC
        - DATE_DESC
    WorkItemTableGrouping:
      type: object
      additionalProperties: false
      required:
        - field
        - order
        - showEmpty
        - collapsed
        - colors
      properties:
        field:
          type: string
          allOf:
            - $ref: "#/components/schemas/WorkItemGroupingField"
          nullable: true
          description: null 表示不分组。
        order:
          $ref: "#/components/schemas/WorkItemGroupingOrder"
        showEmpty:
          type: boolean
        collapsed:
          type: array
          maxItems: 500
          items:
            type: string
            minLength: 1
            maxLength: 800
          description: 折叠的分组，格式为“字段:分组键”。
        colors:
          type: object
          maxProperties: 500
          additionalProperties:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{1,31}$
          description: 处理人分组键到颜色代码的映射，保持已分配颜色稳定。
    WorkItemTableSettingsUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - pinnedColumnCount
        - headerHeight
        - rowHeight
        - coloringRules
        - defaultValues
      properties:
        pinnedColumnCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 50
          description: 工作项名称列之后按当前可见列顺序冻结的列数。
        headerHeight:
          $ref: "#/components/schemas/WorkItemTableHeight"
        rowHeight:
          $ref: "#/components/schemas/WorkItemTableHeight"
        coloringRules:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/WorkItemColoringRule"
        defaultValues:
          $ref: "#/components/schemas/WorkItemCreateDefaultValues"
        grouping:
          type: object
          allOf:
            - $ref: "#/components/schemas/WorkItemTableGrouping"
          nullable: true
          description: 省略或 null 时保留原值。
        completedStatusCodes:
          type: array
          nullable: true
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{1,31}$
          description: 本人在该项目中视为已完成的状态代码；省略或 null 时保留原值。
    WorkItemTableSettings:
      type: object
      additionalProperties: false
      required:
        - projectId
        - pinnedColumnCount
        - headerHeight
        - rowHeight
        - coloringRules
        - defaultValues
        - grouping
        - completedStatusCodes
        - updatedAt
        - etag
      properties:
        projectId:
          $ref: "#/components/schemas/Uuid"
        pinnedColumnCount:
          type: integer
          format: int32
          minimum: 0
          maximum: 50
        headerHeight:
          $ref: "#/components/schemas/WorkItemTableHeight"
        rowHeight:
          $ref: "#/components/schemas/WorkItemTableHeight"
        coloringRules:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/WorkItemColoringRule"
        defaultValues:
          $ref: "#/components/schemas/WorkItemCreateDefaultValues"
        grouping:
          type: object
          allOf:
            - $ref: "#/components/schemas/WorkItemTableGrouping"
          nullable: true
          description: null 表示从未保存过分组。
        completedStatusCodes:
          type: array
          nullable: true
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{1,31}$
          description: null 表示按 DONE 与 CANCELED 两类状态判定已完成。
        updatedAt:
          type: string
          format: date-time
          nullable: true
        etag:
          type: string
          pattern: ^"[0-9]+"$
          readOnly: true
    TimeTrackingState:
      type: string
      enum:
        - RUNNING
        - STOPPED
        - EMPTY
    WorkItemViewType:
      type: string
      enum:
        - TABLE
        - KANBAN
    WorkItemPriority:
      type: string
      description: Project 级优先级标签代码；客户端须从标签目录获取并按不透明值回传。
    WorkItemStatusLabel:
      type: object
      additionalProperties: false
      required:
        - code
        - displayName
        - colorToken
        - statusCategory
        - sortOrder
        - active
        - protectedLabel
        - inUse
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,31}$
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        colorToken:
          $ref: "#/components/schemas/WorkItemLabelColorToken"
        statusCategory:
          $ref: "#/components/schemas/WorkItemStatusCategory"
        sortOrder:
          type: integer
          format: int32
          minimum: 0
        active:
          type: boolean
        protectedLabel:
          type: boolean
        inUse:
          type: boolean
    WorkItemPriorityLabel:
      type: object
      additionalProperties: false
      required:
        - code
        - displayName
        - colorToken
        - sortOrder
        - active
        - inUse
      properties:
        code:
          $ref: "#/components/schemas/WorkItemPriority"
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        colorToken:
          $ref: "#/components/schemas/WorkItemLabelColorToken"
        sortOrder:
          type: integer
          format: int32
          minimum: 0
        active:
          type: boolean
        inUse:
          type: boolean
    WorkItemLabelCatalog:
      type: object
      additionalProperties: false
      required:
        - statuses
        - priorities
        - rowVersion
