components:
  schemas:
    NotificationReason:
      type: string
      enum:
        - MENTION
        - REPLY
        - COMMENT
        - ASSIGNED
        - PROJECT_MEMBER_ADDED
        - PROJECT_MEMBER_REMOVED
        - PROJECT_OWNER_ASSIGNED
        - PROJECT_OWNER_TRANSFERRED
        - CONNECTION_CREATED
        - PROJECT_DELETION_SCHEDULED
        - PROJECT_DELETION_REMINDER
        - PROJECT_DELETION_CANCELLED
        - WORK_HOURS_ANOMALY
    NotificationState:
      type: string
      enum:
        - UNREAD
        - READ
        - ARCHIVED
    NotificationListState:
      type: string
      enum:
        - UNREAD
        - ALL
        - ARCHIVED
      default: ALL
    NotificationGroup:
      type: string
      enum:
        - MENTION
        - COMMENT
        - ASSIGNED
        - PROJECT
    NotificationTargetKind:
      type: string
      enum:
        - PROJECT
        - WORK_ITEM
        - WORK_ITEM_UPDATE
        - MEMBER_DAY
    NotificationPerson:
      type: object
      nullable: true
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    NotificationTarget:
      type: object
      required:
        - kind
        - accessible
      properties:
        kind:
          $ref: "#/components/schemas/NotificationTargetKind"
        accessible:
          type: boolean
        projectId:
          type: string
          format: uuid
          nullable: true
        projectName:
          type: string
          nullable: true
        workItemId:
          type: string
          format: uuid
          nullable: true
        itemNo:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        updateId:
          type: string
          format: uuid
          nullable: true
        excerpt:
          type: string
          nullable: true
        workDate:
          type: string
          format: date
          nullable: true
        durationMs:
          type: integer
          format: int64
          nullable: true
        thresholdMinutes:
          type: integer
          nullable: true
    NotificationItem:
      type: object
      required:
        - id
        - reason
        - state
        - createdAt
        - readAt
        - actor
        - subject
        - target
      properties:
        id:
          type: string
          format: uuid
        reason:
          $ref: "#/components/schemas/NotificationReason"
        state:
          $ref: "#/components/schemas/NotificationState"
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
        actor:
          $ref: "#/components/schemas/NotificationPerson"
        subject:
          $ref: "#/components/schemas/NotificationPerson"
        target:
          $ref: "#/components/schemas/NotificationTarget"
        deletionPurgeAfter:
          type: string
          format: date-time
          nullable: true
          description: 计划删除或到期提醒事件的永久删除日期快照；目标不可访问时为空，撤销不会改写已存在的快照。
    NotificationPage:
      type: object
      required:
        - items
        - nextCursor
        - serverNow
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationItem"
        nextCursor:
          type: string
          nullable: true
        serverNow:
          type: string
          format: date-time
    NotificationUnreadCounts:
      type: object
      required:
        - total
        - mention
        - comment
        - assigned
        - project
        - newestUnreadAt
        - serverNow
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
        mention:
          type: integer
          format: int64
          minimum: 0
        comment:
          type: integer
          format: int64
          minimum: 0
        assigned:
          type: integer
          format: int64
          minimum: 0
        project:
          type: integer
          format: int64
          minimum: 0
        newestUnreadAt:
          type: string
          format: date-time
          nullable: true
        serverNow:
          type: string
          format: date-time
    NotificationReadAllRequest:
      type: object
      additionalProperties: false
      required:
        - upTo
      properties:
        upTo:
          type: string
          format: date-time
        group:
          $ref: "#/components/schemas/NotificationGroup"
    ProjectNotificationMode:
      type: string
      enum:
        - ALL
        - MUTED
        - CUSTOM
    ProjectNotificationPreferenceUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - mode
        - mention
        - comment
        - assigned
        - connectionCreated
      properties:
        mode:
          $ref: "#/components/schemas/ProjectNotificationMode"
        mention:
          type: boolean
          description: CUSTOM 时是否接收 @提及。
        comment:
          type: boolean
          description: CUSTOM 时是否接收评论与回复。
        assigned:
          type: boolean
          description: CUSTOM 时是否接收指派。
        connectionCreated:
          type: boolean
          description: CUSTOM 时负责人是否接收关联新建工作项。
    ProjectNotificationPreference:
      type: object
      additionalProperties: false
      required:
        - projectId
        - mode
        - mention
        - comment
        - assigned
        - connectionCreated
        - updatedAt
      properties:
        projectId:
          $ref: "#/components/schemas/Uuid"
        mode:
          $ref: "#/components/schemas/ProjectNotificationMode"
        mention:
          type: boolean
        comment:
          type: boolean
        assigned:
          type: boolean
        connectionCreated:
          type: boolean
        updatedAt:
          type: string
          format: date-time
          nullable: true
