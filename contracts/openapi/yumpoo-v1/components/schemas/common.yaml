components:
  schemas:
    ConnectionCardLabel:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - colorToken
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 80
        colorToken:
          $ref: "#/components/schemas/WorkItemLabelColorToken"
    ConnectCandidateParent:
      type: object
      additionalProperties: false
      required:
        - workItemId
        - title
      properties:
        workItemId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
          minLength: 1
          maxLength: 300
    PlatformRoleTier:
      type: string
      enum:
        - COMPANY_MEMBER
        - COMPANY_ADMIN
        - APP_MANAGER
    DashboardChartMeasure:
      type: object
      required:
        - metric
        - calculation
      properties:
        metric:
          type: string
          enum:
            - TOTAL
            - IN_PROGRESS
            - DONE
            - COMPLETION_RATE
            - DURATION
        calculation:
          type: string
          enum:
            - SUM
            - AVG
            - MEDIAN
            - MIN
            - MAX
    DashboardChartLabel:
      type: object
      required:
        - key
        - name
        - color
        - order
      properties:
        key:
          type: string
          maxLength: 2000
        name:
          type: string
          maxLength: 80
        color:
          type: string
          pattern: ^$|^#[a-fA-F0-9]{6}$
        order:
          type: integer
          format: int64
          minimum: 0
          maximum: 5000
    DashboardChart:
      type: object
      required:
        - type
        - dimension
        - series
        - dateInterval
        - timezone
        - measure
        - stacked
        - showLegend
        - showValues
        - valueFormat
        - sort
        - limit
        - showEmpty
        - labels
        - detailColumns
      properties:
        type:
          type: string
          enum:
            - NUMBER
            - COLUMN
            - BAR
            - LINE
            - AREA
            - PIE
            - DONUT
            - BUBBLE
        dimension:
          type: string
          enum:
            - NONE
            - PROJECT
            - CONTENT
            - STATUS
            - CATEGORY
            - PRIORITY
            - ASSIGNEE
            - REPORTER
            - CREATED
            - UPDATED
            - COMPLETED
            - DUE
            - TIMELINE_START
            - TIMELINE_END
        series:
          type: string
          enum:
            - NONE
            - PROJECT
            - CONTENT
            - STATUS
            - CATEGORY
            - PRIORITY
            - ASSIGNEE
            - REPORTER
            - CREATED
            - UPDATED
            - COMPLETED
            - DUE
            - TIMELINE_START
            - TIMELINE_END
        dateInterval:
          type: string
          enum:
            - DAY
            - WEEK
            - MONTH
        timezone:
          type: string
        measure:
          $ref: "#/components/schemas/DashboardChartMeasure"
        xMeasure:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DashboardChartMeasure"
        sizeMeasure:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DashboardChartMeasure"
        stacked:
          type: boolean
        showLegend:
          type: boolean
        showValues:
          type: boolean
        valueFormat:
          type: string
          enum:
            - VALUE
            - PERCENT
        sort:
          type: string
          enum:
            - VALUE_ASC
            - VALUE_DESC
            - NAME_ASC
            - NAME_DESC
            - CUSTOM
        limit:
          type: integer
          format: int64
          minimum: 0
          maximum: 5000
        showEmpty:
          type: boolean
        projectIds:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          maxItems: 100
        filters:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DashboardFilters"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/DashboardChartLabel"
          maxItems: 500
        detailColumns:
          type: array
          items:
            type: string
            enum:
              - project
              - content
              - assignee
              - reporter
              - status
              - priority
              - duration
              - due
              - timeline
              - created
              - updated
              - completed
    DashboardChartSelection:
      type: object
      required: []
      properties:
        key:
          type: string
          nullable: true
          maxLength: 2000
        seriesKey:
          type: string
          nullable: true
          maxLength: 2000
    DashboardChartPoint:
      type: object
      required:
        - key
        - label
        - colorToken
        - seriesKey
        - seriesLabel
        - seriesColorToken
        - count
        - value
        - xValue
        - sizeValue
      properties:
        key:
          type: string
        label:
          type: string
        colorToken:
          type: string
        seriesKey:
          type: string
        seriesLabel:
          type: string
        seriesColorToken:
          type: string
        count:
          type: integer
          format: int64
          minimum: 0
        value:
          type: number
          format: double
        xValue:
          type: number
          format: double
        sizeValue:
          type: number
          format: double
        categoryValue:
          type: number
          format: double
          description: 按分类独立计算的数值，用于系列拆分时排序，不累加平均值、中位数或完成率。
    DashboardChartResult:
      type: object
      required:
        - id
        - points
      properties:
        id:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/DashboardChartPoint"
    DashboardPosition:
      type: object
      required:
        - x
        - y
        - w
        - h
      properties:
        x: &a1
          type: integer
          format: int64
          minimum: 0
        y: *a1
        w:
          type: integer
          format: int64
          minimum: 1
        h:
          type: integer
          format: int64
          minimum: 1
    DashboardWidget:
      type: object
      required:
        - id
        - kind
        - title
        - metric
        - grouping
        - sort
        - showLegend
        - showValues
        - wide
        - medium
      properties:
        id: &a3
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - METRIC
            - STATUS
            - PROJECT_WORKLOAD
            - MEMBER_WORKLOAD
            - PROJECT_TIME
            - CHART
        title:
          type: string
          minLength: 1
          maxLength: 80
        metric:
          type: string
          enum:
            - TOTAL
            - IN_PROGRESS
            - DONE
            - COMPLETION_RATE
            - DURATION
        grouping:
          type: string
          enum:
            - STATUS
            - CATEGORY
        sort:
          type: string
          enum:
            - ASC
            - DESC
        showLegend: &a2
          type: boolean
        showValues: *a2
        wide:
          $ref: "#/components/schemas/DashboardPosition"
        medium:
          $ref: "#/components/schemas/DashboardPosition"
        chart:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DashboardChart"
    DashboardFilters:
      type: object
      required:
        - projectIds
        - assignees
        - statuses
        - priorities
        - contentIds
        - categories
        - dueFrom
        - dueTo
        - includeArchived
        - query
        - hasTime
      properties:
        projectIds:
          type: array
          items: *a3
        assignees:
          type: array
          items: &a4
            type: string
        statuses:
          type: array
          items: *a4
        priorities:
          type: array
          items: *a4
        contentIds:
          type: array
          items: *a3
        categories:
          type: array
          items: *a4
        dueFrom:
          type: string
          format: date
          nullable: true
        dueTo:
          type: string
          format: date
          nullable: true
        includeArchived: *a2
        query:
          type: string
          maxLength: 200
        hasTime: *a2
    DashboardTableQuery:
      type: object
      required:
        - widget
        - projectId
        - table
      properties:
        filters:
          $ref: "#/components/schemas/DashboardFilters"
        widget:
          $ref: "#/components/schemas/DashboardWidget"
        selection:
          $ref: "#/components/schemas/DashboardChartSelection"
        projectId:
          type: string
          format: uuid
        table:
          $ref: "#/components/schemas/DashboardTableCriteria"
    DashboardTableCriteria:
      type: object
      description: 复用项目工作项查询语义；图表条件与表格条件取交集，field 查询分组选项，parentWorkItemId 查询匹配子项。主表保留命中子项的父项作为上下文。
      properties:
        q:
          type: string
          maxLength: 200
        status:
          type: array
          items:
            type: string
        priority:
          type: array
          items:
            type: string
        assigneeUserId:
          type: array
          items:
            type: string
            format: uuid
        assigneeSetUserId:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            type: string
            format: uuid
        contentId:
          type: array
          items:
            type: string
            format: uuid
        dueFrom:
          type: string
          format: date
        dueTo:
          type: string
          format: date
        updatedAfter:
          type: string
          format: date-time
        sort:
          type: array
          maxItems: 3
          items:
            type: string
        timeTrackingState:
          type: string
          enum:
            - RUNNING
            - STOPPED
            - EMPTY
        timeTrackingMinMs:
          type: integer
          format: int64
          minimum: 0
        timeTrackingMaxMs:
          type: integer
          format: int64
          minimum: 0
        emptyField:
          type: string
          enum:
            - ASSIGNEE
            - PRIORITY
            - DUE_DATE
        cursor:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        field:
          type: string
          enum:
            - TITLE
            - ASSIGNEE
            - ASSIGNEE_SET
            - STATUS
            - PRIORITY
            - CONTENT
            - DUE_DATE
            - UPDATED_AT
        parentWorkItemId:
          type: string
          format: uuid
    DashboardTablePage:
      type: object
      required:
        - items
        - options
        - nextCursor
        - contextIds
        - subitemCounts
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectWorkItemListItem"
        options:
          type: array
          items:
            $ref: "#/components/schemas/ProjectWorkItemFilterOption"
        nextCursor:
          type: string
          nullable: true
        contextIds:
          type: array
          description: 本身未命中图表条件、仅承载匹配子项的父项标识，不计入图表数量。
          items:
            type: string
            format: uuid
        subitemCounts:
          type: object
          description: 当前图表范围内的子项数量；缺失键为零。items 中的真实数量继续用于结构操作校验。
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
    DashboardItemsQuery:
      type: object
      required:
        - filters
        - offset
        - limit
      properties:
        filters:
          $ref: "#/components/schemas/DashboardFilters"
        offset:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000
        limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
        widget:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DashboardWidget"
        selection:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DashboardChartSelection"
    DashboardItem:
      type: object
      required:
        - id
        - projectId
        - itemNo
        - title
        - assigneeUserId
        - assigneeName
        - statusCode
        - statusName
        - statusCategory
        - colorToken
        - durationMs
        - updatedAt
      properties:
        assignees:
          type: array
          maxItems: 20
          readOnly: true
          description: 按指派顺序排列的平等处理人，第一位等于 assigneeUserId。
          items:
            $ref: "#/components/schemas/WorkItemAssignee"
        workItem:
          $ref: "#/components/schemas/ProjectWorkItemListItem"
        id: *a3
        projectId: *a3
        itemNo: *a4
        title: *a4
        assigneeUserId:
          description: 主处理人
          type: string
          format: uuid
          nullable: true
        assigneeName:
          description: 主处理人
          type: string
          nullable: true
        statusCode: *a4
        statusName: *a4
        statusCategory: *a4
        colorToken: *a4
        durationMs: *a1
        updatedAt: &a5
          type: string
          format: date-time
        contentId:
          type: string
          format: uuid
          nullable: true
        reporterUserId:
          type: string
          format: uuid
          nullable: true
        contentName:
          type: string
          nullable: true
        priority:
          type: string
          nullable: true
        priorityName:
          type: string
          nullable: true
        reporterName:
          type: string
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        timelineStartDate:
          type: string
          format: date
          nullable: true
        timelineEndDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    DashboardItemPage:
      type: object
      required:
        - items
        - totalElements
        - asOf
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DashboardItem"
        totalElements: *a1
        asOf: *a5
    TeamDashboardMember:
      type: object
      additionalProperties: false
      required:
        - userId
        - displayName
        - active
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          description: 已无资料的成员显示为“历史成员”。
        active:
          type: boolean
          description: 在职且账号启用。
    TeamTimesheetWorkItem:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - projectName
        - itemNo
        - title
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        itemNo:
          type: string
        title:
          type: string
    TeamTimesheetEntry:
      type: object
      additionalProperties: false
      required:
        - userId
        - workItemId
        - date
        - durationMs
      properties:
        userId:
          type: string
          format: uuid
        workItemId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        durationMs:
          type: integer
          format: int64
          minimum: 1
    TeamTimesheetCategoryEntry:
      type: object
      additionalProperties: false
      required:
        - userId
        - timeCategory
        - date
        - durationMs
      properties:
        userId:
          $ref: "#/components/schemas/Uuid"
        timeCategory:
          $ref: "#/components/schemas/TimeCategory"
        date:
          type: string
          format: date
        durationMs:
          type: integer
          format: int64
          minimum: 1
    TeamTimesheet:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - timezone
        - asOf
        - members
        - workItems
        - entries
        - days
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timezone:
          type: string
        asOf:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamDashboardMember"
        workItems:
          type: array
          items:
            $ref: "#/components/schemas/TeamTimesheetWorkItem"
        entries:
          type: array
          description: 每个成员、工作项、自然日一条，只包含大于 0 的耗时。
          items:
            $ref: "#/components/schemas/TeamTimesheetEntry"
        categoryEntries:
          type: array
          description: 非项目分类工时，每个成员、分类、自然日一条，只包含大于 0 的耗时；团队工时按项目筛选时为空。服务端总是返回。
          items:
            $ref: "#/components/schemas/TeamTimesheetCategoryEntry"
        days:
          type: array
          items:
            $ref: "#/components/schemas/TeamTimesheetDay"
    TeamTimesheetDay:
      type: object
      additionalProperties: false
      required:
        - date
        - dayType
        - note
        - standardMinutes
      properties:
        date:
          type: string
          format: date
        dayType:
          $ref: "#/components/schemas/CalendarDayType"
        note:
          type: string
          nullable: true
        standardMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 720
          description: 公司日历当天标准工时分钟数，非工作日为 0。
    TeamMemberTask:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - projectName
        - itemNo
        - title
        - statusName
        - statusCategory
        - statusColor
        - priorityName
        - priorityColor
        - dueDate
        - overdue
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        itemNo:
          type: string
        title:
          type: string
        statusName:
          type: string
        statusCategory:
          type: string
          enum:
            - TODO
            - IN_PROGRESS
        statusColor:
          type: string
          description: 项目状态标签色 token。
        priorityName:
          type: string
          nullable: true
        priorityColor:
          type: string
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        overdue:
          type: boolean
    TeamMemberTaskPage:
      type: object
      additionalProperties: false
      required:
        - items
        - totalElements
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamMemberTask"
        totalElements:
          type: integer
          format: int64
          minimum: 0
    TimeTrackingRunningSession:
      type: object
      additionalProperties: false
      required:
        - userId
        - startedAt
      properties:
        userId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
    TimeTrackingSummary:
      type: object
      additionalProperties: false
      required:
        - workItemId
        - completedDurationMs
        - totalDurationMs
        - ownDurationMs
        - sessionCount
        - runningSessions
        - allocatedDurationMs
        - rollupDurationMs
        - rollupRunningRate
      properties:
        workItemId:
          type: string
          format: uuid
        completedDurationMs:
          type: integer
          format: int64
          minimum: 0
        totalDurationMs:
          type: integer
          format: int64
          minimum: 0
        ownDurationMs:
          type: integer
          format: int64
          minimum: 0
        sessionCount:
          type: integer
          format: int64
          minimum: 0
        allocatedDurationMs:
          type: integer
          format: int64
          minimum: 0
        rollupDurationMs:
          type: integer
          format: int64
          minimum: 0
          description: 本项加直接子项的计入时长
        rollupRunningRate:
          type: number
          format: double
          minimum: 0
          description: 每经过 1 毫秒，rollupDurationMs 增加的毫秒数
        runningSessions:
          type: array
          items:
            $ref: "#/components/schemas/TimeTrackingRunningSession"
    CalendarDayType:
      type: string
      enum:
        - WORKDAY
        - NON_WORKDAY
        - HOLIDAY
      description: WORKDAY 工作日；NON_WORKDAY 休息日；HOLIDAY 法定节假日。
    Uuid:
      type: string
      format: uuid
      description: 不透明 UUID；客户端不得从值中推导业务语义。
    ManagedPlatformRole:
      type: string
      enum:
        - COMPANY_ADMIN
        - APP_MANAGER
    EmploymentStatus:
      type: string
      enum:
        - ACTIVE
        - LEFT
    AccountStatus:
      type: string
      enum:
        - ENABLED
        - DISABLED
    ProjectLifecycle:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
    NullableWorkItemPriority:
      type: string
      nullable: true
      description: 可空的 Project 级优先级标签代码；非空值须从标签目录获取并按不透明值回传。
    WorkItemStatusCategory:
      type: string
      enum:
        - TODO
        - IN_PROGRESS
        - DONE
        - CANCELED
    WorkItemLabelColorToken:
      type: string
      enum:
        - BRIGHT_GREEN
        - SALADISH
        - EGG_YOLK
        - DARK_ORANGE
        - PEACH
        - SUNSET
        - DARK_RED
        - SOFIA_PINK
        - LIPSTICK
        - BUBBLE
        - DARK_PURPLE
        - BERRY
        - DARK_INDIGO
        - INDIGO
        - NAVY
        - BRIGHT_BLUE
        - AQUAMARINE
        - CHILI_BLUE
        - RIVER
        - WINTER
        - AMERICAN_GRAY
        - BLACKISH
        - BROWN
        - ORCHID
        - TAN
        - SKY
        - COFFEE
        - ROYAL
        - TEAL
        - LAVENDER
        - STEEL
        - LILAC
        - PECAN
        - GREEN
        - BLUE
        - PURPLE
        - MAGENTA
        - RED
        - ORANGE
        - AMBER
        - LIME
        - CYAN
        - GRAY
    WorkItemSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - contentId
        - itemNo
        - contentName
        - contentColorToken
        - title
        - statusCode
        - statusCategory
        - priority
        - assigneeUserId
        - assigneeDisplayName
        - reporterUserId
        - reporterDisplayName
        - description
        - notes
        - timelineStartDate
        - timelineEndDate
        - dueDate
        - rowVersion
        - etag
        - capabilities
        - updatedAt
      properties:
        assignees:
          type: array
          maxItems: 20
          readOnly: true
          description: 按指派顺序排列的平等处理人，第一位等于 assigneeUserId。
          items:
            $ref: "#/components/schemas/WorkItemAssignee"
        id:
          $ref: "#/components/schemas/Uuid"
        projectId:
          $ref: "#/components/schemas/Uuid"
        contentId:
          $ref: "#/components/schemas/Uuid"
        contentName:
          type: string
          minLength: 1
          maxLength: 80
        contentColorToken:
          $ref: "#/components/schemas/WorkItemLabelColorToken"
        itemNo:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,31}-[1-9][0-9]*$
        title:
          type: string
          minLength: 1
          maxLength: 300
        statusCode:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,31}$
        statusCategory:
          $ref: "#/components/schemas/WorkItemStatusCategory"
        priority:
          $ref: "#/components/schemas/NullableWorkItemPriority"
        assigneeUserId:
          type: string
          format: uuid
          nullable: true
          description: 主处理人
        assigneeDisplayName:
          type: string
          minLength: 1
          nullable: true
          description: 主处理人
        reporterUserId:
          $ref: "#/components/schemas/Uuid"
        reporterDisplayName:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
          maxLength: 65536
          nullable: true
          description: 工作项描述，受限协作富文本 HTML（与讨论正文相同的格式白名单，允许 img[src,alt] 与受限附件文件卡片）。 img.src 必须精确匹配同源附件内容地址 /api/v1/attachments/{uuid}/content，否则移除； Mention 降级为纯文本。净化后 HTML 最多 65536 字符、纯文本最多 16384 字符；无文本且无图片时保存为 null。
        notes:
          type: string
          minLength: 1
          maxLength: 16384
          nullable: true
        timelineStartDate:
          type: string
          format: date
          nullable: true
        timelineEndDate:
          type: string
          format: date
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        dueTime:
          type: string
          nullable: true
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
          description: 企业时区的截止时分；更新时省略保留原值，null 移除时间。
        completedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: 当前 DONE 周期的实际完成时间；历史未记录时为空。
        rowVersion:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        etag:
          type: string
          pattern: ^"[0-9]+"$
          readOnly: true
        capabilities:
          $ref: "#/components/schemas/WorkItemCapabilities"
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    WorkItemCapabilities:
      type: object
      additionalProperties: false
      required:
        - canEditFields
        - canMoveInKanban
        - canMoveInProjectOrder
        - canDiscuss
        - canDelete
        - canRestore
        - availableTransitions
      properties:
        canEditFields:
          type: boolean
          readOnly: true
        canMoveInKanban:
          type: boolean
          readOnly: true
        canMoveInProjectOrder:
          type: boolean
          readOnly: true
        canDiscuss:
          type: boolean
          readOnly: true
        canDelete:
          type: boolean
          readOnly: true
        canRestore:
          type: boolean
          readOnly: true
        availableTransitions:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/WorkItemTransitionOption"
    WorkItemTransitionOption:
      type: object
      additionalProperties: false
      required:
        - toStatus
        - displayName
        - statusCategory
        - requiresResolution
      properties:
        toStatus:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,31}$
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        statusCategory:
          $ref: "#/components/schemas/WorkItemStatusCategory"
        requiresResolution:
          type: boolean
    WorkItemPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemSummary"
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
    ProjectWorkItemListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - contentId
        - contentName
        - contentColorToken
        - itemNo
        - title
        - statusCode
        - statusCategory
        - priority
        - assigneeUserId
        - assigneeDisplayName
        - dueDate
        - rowVersion
        - etag
        - capabilities
        - subitemCount
        - updatedAt
      properties:
        assignees:
          type: array
          maxItems: 20
          readOnly: true
          description: 按指派顺序排列的平等处理人，第一位等于 assigneeUserId。
          items:
            $ref: "#/components/schemas/WorkItemAssignee"
        timeTracking:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TimeTrackingSummary"
        id:
          $ref: "#/components/schemas/Uuid"
        projectId:
          $ref: "#/components/schemas/Uuid"
        contentId:
          $ref: "#/components/schemas/Uuid"
        contentName:
          type: string
          minLength: 1
          maxLength: 120
        contentColorToken:
          $ref: "#/components/schemas/WorkItemLabelColorToken"
        itemNo:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,31}-[1-9][0-9]*$
        title:
          type: string
          minLength: 1
          maxLength: 300
        statusCode:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,31}$
        statusCategory:
          $ref: "#/components/schemas/WorkItemStatusCategory"
        priority:
          $ref: "#/components/schemas/NullableWorkItemPriority"
        assigneeUserId:
          type: string
          format: uuid
          nullable: true
          description: 主处理人
        assigneeDisplayName:
          type: string
          minLength: 1
          nullable: true
          description: 主处理人
        dueDate:
          type: string
          format: date
          nullable: true
        dueTime:
          type: string
          nullable: true
          pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9]$
          description: 企业时区的截止时分；更新时省略保留原值，null 移除时间。
        completedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: 当前 DONE 周期的实际完成时间；历史未记录时为空。
        rowVersion:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        etag:
          type: string
          pattern: ^"[0-9]+"$
          readOnly: true
        capabilities:
          $ref: "#/components/schemas/WorkItemCapabilities"
        subitemCount:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        discussionCount:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: 未删除的顶层讨论串数量，不含回复；旧响应省略时按 0 展示。
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        updatedByUserId:
          type: string
          format: uuid
          readOnly: true
          example: 46000000-0000-4000-8000-000000000004
        updatedByDisplayName:
          type: string
          minLength: 1
          readOnly: true
          example: 林晓
    ProjectWorkItemFilterOption:
      type: object
      additionalProperties: false
      required:
        - value
        - label
        - count
      properties:
        value:
          type: string
        label:
          type: string
        count:
          type: integer
          format: int64
          minimum: 0
    WorkItemAssignee:
      type: object
      additionalProperties: false
      required:
        - userId
        - displayName
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
    WorkflowRequiredPermission:
      type: string
      enum:
        - MEMBER
    Instant:
      type: string
      format: date-time
      description: RFC 3339 UTC 时刻。
      example: 2026-08-09T09:30:00.123Z
    LocalDate:
      type: string
      format: date
      pattern: ^\d{4}-\d{2}-\d{2}$
      description: 不携带时区或零点时刻的自然日，格式为 YYYY-MM-DD。
      example: 2026-08-09
    RequestId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
      description: 服务端生成或从可信反向代理接收的不透明请求关联标识。
    ErrorCode:
      type: string
      description: |
        一期冻结的公共错误码。客户端只能使用 code 做程序判断，不能解析 message。
      enum:
        - MALFORMED_REQUEST
        - AUTHENTICATION_REQUIRED
        - ACCOUNT_DISABLED
        - ACCESS_DENIED
        - RESOURCE_NOT_FOUND
        - IDEMPOTENCY_KEY_REUSED
        - REQUEST_IN_PROGRESS
        - INVALID_STATE_TRANSITION
        - WORKLOG_LOCKED
        - VERSION_CONFLICT
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_ALLOWED
        - VALIDATION_FAILED
        - CLIENT_UPGRADE_REQUIRED
        - PRECONDITION_REQUIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          minLength: 1
          description: 出错字段的稳定请求字段名。
        code:
          type: string
          minLength: 1
          description: 字段级稳定错误码。
        message:
          type: string
          minLength: 1
          description: 面向当前用户且不包含内部实现信息的说明。
    ApiErrorBase:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
        - retryable
        - fieldErrors
        - details
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
          description: 面向当前用户的安全错误说明。
        requestId:
          $ref: "#/components/schemas/RequestId"
        retryable:
          type: boolean
          description: 当前请求是否可在不改变业务意图的前提下自动重试。
        fieldErrors:
          type: array
          description: 字段级错误；非字段校验错误固定为空数组。
          items:
            $ref: "#/components/schemas/FieldError"
        details:
          type: object
          description: 错误专用详情；具体响应 schema 必须进一步收窄。
    EmptyErrorDetails:
      type: object
      additionalProperties: false
      description: |
        通用错误详情默认为空；需要稳定机器可读原因的业务冲突可返回 reason。
      properties:
        reason:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,63}$
          description: M2-08 生命周期治理稳定原因；其他业务域可继续使用各自稳定原因。
          x-stable-values:
            - PROJECT_ARCHIVE_BLOCKED
            - WORKSPACE_ARCHIVE_BLOCKED
            - WORKSPACE_UNCHANGED
            - RECENT_AUTHENTICATION_REQUIRED
        blockers:
          type: array
          description: 仅包含稳定分类 code 与非负聚合 count，不含对象标识或业务正文。
          items:
            $ref: "#/components/schemas/SafeBlocker"
    SafeBlocker:
      type: object
      additionalProperties: false
      required:
        - code
        - count
      properties:
        code:
          type: string
          enum:
            - OPEN_WORK_ITEMS
            - PENDING_WORKLOG_APPROVALS
            - CURRENT_PROJECTS
        count:
          type: integer
          format: int64
          minimum: 0
    ErrorResponse:
      description: ApiErrorBase 的具体响应类型；details 默认为空，特定冲突可带稳定 reason。
      allOf:
        - $ref: "#/components/schemas/ApiErrorBase"
        - type: object
          required:
            - details
          properties:
            details:
              $ref: "#/components/schemas/EmptyErrorDetails"
    PageMetadata:
      type: object
      additionalProperties: false
      description: |
        普通分页的共享元数据约束。为兼容既定响应 JSON 形状，PageResponse 不增加
        metadata 包装层，而是在顶层平铺并重复声明这里的四个字段。
      required:
        - page
        - size
        - totalElements
        - totalPages
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
          description: 当前页号，从 0 开始。
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: 当前页容量；默认 20，硬上限 100。
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: 在权限过滤后可见的元素总数。
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: 在权限过滤后可见的总页数。
    CursorPageMetadata:
      type: object
      additionalProperties: false
      description: |
        cursor 分页的共享元数据约束。为兼容既定响应 JSON 形状，CursorPageResponse
        不增加 metadata 包装层，而是在顶层平铺并重复声明 nextCursor。
      required:
        - nextCursor
      properties:
        nextCursor:
          type: string
          minLength: 1
          nullable: true
          description: 不透明续读游标；没有下一批时为 null。
    PageResponse:
      type: object
      additionalProperties: false
      description: |
        固定扁平普通分页响应；page、size、totalElements、totalPages 与 PageMetadata
        保持同一约束，不引入 metadata 包装对象。
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          description: 当前页资源 DTO；具体 operation 必须收窄 item schema。
          items:
            type: object
            additionalProperties: true
        page:
          type: integer
          format: int32
          minimum: 0
          description: 当前页号，从 0 开始。
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: 当前页容量；默认 20，硬上限 100。
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: 在权限过滤后可见的元素总数。
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: 在权限过滤后可见的总页数。
    CursorPageResponse:
      type: object
      additionalProperties: false
      description: |
        固定扁平 cursor 分页响应；nextCursor 与 CursorPageMetadata 保持同一约束，
        不引入 metadata 包装对象。
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          description: 当前批次资源 DTO；具体 operation 必须收窄 item schema。
          items:
            type: object
            additionalProperties: true
        nextCursor:
          type: string
          minLength: 1
          nullable: true
          description: 不透明续读游标；没有下一批时为 null。
