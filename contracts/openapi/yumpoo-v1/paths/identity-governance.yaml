paths:
  /admin/members/{userId}/platform-role:
    put:
      tags:
        - IdentityGovernance
      operationId: changeMemberPlatformRole
      summary: 原子变更成员全局角色层级
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformRoleChangeRequest"
      responses:
        "200":
          description: 查询或更新成功。
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformRoleChangeResult"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/members/{userId}/governance-state:
    get:
      tags:
        - IdentityGovernance
      operationId: getMemberGovernanceState
      summary: 查询成员最小治理快照
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: 成员治理快照。
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceState"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
  /admin/role-assignments:
    get:
      tags:
        - IdentityGovernance
      operationId: listRoleAssignments
      summary: 分页查询平台角色分配
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ManagedPlatformRole"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RoleAssignmentStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: 角色分配分页。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleAssignmentPage"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/company-admin-assignments:
    post:
      tags:
        - IdentityGovernance
      operationId: grantCompanyAdmin
      summary: 授予 COMPANY_ADMIN
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleGrantRequest"
      responses:
        "201":
          $ref: "#/components/responses/RoleGranted"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/company-admin-assignments/{assignmentId}:
    delete:
      tags:
        - IdentityGovernance
      operationId: revokeCompanyAdmin
      summary: 撤销 COMPANY_ADMIN
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        $ref: "#/components/requestBodies/GovernanceReason"
      responses:
        "200":
          $ref: "#/components/responses/RoleChanged"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/app-manager-assignments:
    post:
      tags:
        - IdentityGovernance
      operationId: grantAppManager
      summary: 授予 APP_MANAGER
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleGrantRequest"
      responses:
        "201":
          $ref: "#/components/responses/RoleGranted"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/app-manager-assignments/{assignmentId}:
    delete:
      tags:
        - IdentityGovernance
      operationId: revokeAppManager
      summary: 撤销 APP_MANAGER
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        $ref: "#/components/requestBodies/GovernanceReason"
      responses:
        "200":
          $ref: "#/components/responses/RoleChanged"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/members/{userId}/account-disable:
    post:
      tags:
        - IdentityGovernance
      operationId: disableMemberAccount
      summary: 禁用成员账号
      description: 要求 15 分钟内的认证；过期返回 403 ACCESS_DENIED，details.reason 为 RECENT_AUTHENTICATION_REQUIRED，客户端应引导重新认证并复核后提交。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        $ref: "#/components/requestBodies/GovernanceReason"
      responses:
        "200":
          $ref: "#/components/responses/AccountChanged"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/members/{userId}/account-enable:
    post:
      tags:
        - IdentityGovernance
      operationId: enableMemberAccount
      summary: 启用成员账号
      description: 要求 15 分钟内的认证；过期返回 403 ACCESS_DENIED，details.reason 为 RECENT_AUTHENTICATION_REQUIRED，客户端应引导重新认证并复核后提交。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        $ref: "#/components/requestBodies/GovernanceReason"
      responses:
        "200":
          $ref: "#/components/responses/AccountChanged"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
