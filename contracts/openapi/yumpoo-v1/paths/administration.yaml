paths:
  /admin/scheduled-jobs:
    get:
      tags:
        - Administration
      operationId: listScheduledJobs
      summary: 查询定时任务配置与最近一次执行
      description: 仅 COMPANY_ADMIN（含 APP_MANAGER）可读；未保存的任务返回 enabled=false、默认 cron、etag 为 "0"。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 已注册定时任务。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledJobList"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/scheduled-jobs/{jobCode}:
    put:
      tags:
        - Administration
      operationId: updateScheduledJob
      summary: 启用、停用或修改定时任务计划
      description: 要求会话、XSRF 和最近读取的 If-Match；cron 为 Spring 6 段表达式，按保存时的企业时区解释；停机后最多补跑一次。
      security:
        - sessionCookie: []
      parameters:
        - name: jobCode
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Z][A-Z0-9_]{0,63}$
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledJobUpdateRequest"
      responses:
        "200":
          description: 保存后的定时任务。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledJob"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /admin/work-calendar/{year}:
    get:
      tags:
        - Administration
      operationId: getWorkCalendarYear
      summary: 查询公司年度工作日历
      description: 仅 COMPANY_ADMIN（含 APP_MANAGER）；返回全年逐日解析结果；未显式设置的日期按周一至周五工作、周末休息；从未保存过的年份 etag 为 "0"。
      security:
        - sessionCookie: []
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 2000
            maximum: 2100
      responses:
        "200":
          description: 全年工作日历与年度版本。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCalendarYear"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    put:
      tags:
        - Administration
      operationId: updateWorkCalendarYear
      summary: 整体替换公司年度工作日历
      description: 仅 COMPANY_ADMIN（含 APP_MANAGER）；请求中的 days 即该年全部显式设置，未列出的日期恢复默认规则；要求会话、XSRF 和最近读取的 If-Match；写入安全审计。
      security:
        - sessionCookie: []
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 2000
            maximum: 2100
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkCalendarUpdateRequest"
      responses:
        "200":
          description: 保存后的全年工作日历。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkCalendarYear"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /admin/work-hours-alert:
    get:
      tags:
        - Administration
      operationId: getWorkHoursAlert
      summary: 查询公司工时异常提醒阈值
      description: 仅 COMPANY_ADMIN（含 APP_MANAGER）；尚未保存时每日阈值为 720 分钟，etag 为 "0"。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 当前阈值与版本。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkHoursAlertSetting"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags:
        - Administration
      operationId: updateWorkHoursAlert
      summary: 修改公司工时异常提醒阈值
      description: 仅 COMPANY_ADMIN（含 APP_MANAGER）；要求会话、XSRF 和最近读取的 If-Match；阈值为每天每位成员的全部计时工时，检查前一自然日，任务默认停用。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkHoursAlertUpdateRequest"
      responses:
        "200":
          description: 保存后的阈值与版本。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkHoursAlertSetting"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /admin/governance-overrides:
    post:
      tags:
        - Administration
      operationId: createGovernanceOverride
      summary: CompanyAdmin 执行显式生命周期治理覆盖
      description: 稳定 4xx 失败与同一幂等结果一并固化；503/500 不固化并允许原键重试。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceOverrideRequest"
      responses:
        "200":
          description: 覆盖成功后的目标安全快照。
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
    get:
      tags:
        - Administration
      operationId: listGovernanceOverrides
      summary: CompanyAdmin 分页查询本企业治理覆盖历史
      security:
        - sessionCookie: []
      parameters:
        - name: action
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GovernanceOverrideAction"
        - name: targetType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GovernanceTargetType"
        - name: targetId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: result
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GovernanceOverrideResult"
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Company 隔离的稳定倒序分页。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceOverridePage"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
