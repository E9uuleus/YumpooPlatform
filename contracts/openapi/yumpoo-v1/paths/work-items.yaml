          description: 所选每个本项目有效连接列均没有可读连接；不存在或其他项目的列不匹配。 参与计数与游标，不提供连接排序或分组。
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            maxItems: 20
            items:
              $ref: "#/components/schemas/Uuid"
        - name: incomingProjectIds
          in: query
          description: 至少有一条来自所选任一项目的有效入站连接。 参与计数与游标，不提供连接排序或分组。
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            maxItems: 20
            items:
              $ref: "#/components/schemas/Uuid"
        - name: timeTrackingState
          in: query
          schema:
            $ref: "#/components/schemas/TimeTrackingState"
        - name: timeTrackingMinMs
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: timeTrackingMaxMs
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: "#/components/parameters/ProjectId"
        - name: field
          in: query
          required: true
          schema:
            type: string
            enum:
              - TITLE
              - ASSIGNEE
              - ASSIGNEE_SET
              - STATUS
              - PRIORITY
              - CONTENT
              - DUE_DATE
              - UPDATED_AT
              - INCOMING_PROJECT
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
        - name: priority
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/WorkItemPriority"
        - name: assigneeUserId
          description: 任一所选成员是处理人即匹配。
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/Uuid"
        - name: contentId
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/Uuid"
        - name: dueFrom
          in: query
          schema:
            type: string
            format: date
        - name: dueTo
          in: query
          schema:
            type: string
            format: date
        - name: updatedAfter
          in: query
