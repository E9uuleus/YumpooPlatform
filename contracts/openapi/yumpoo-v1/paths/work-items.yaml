paths:
  /projects/{projectId}/connect-columns:
    get:
      tags:
        - WorkItems
      operationId: listConnectColumns
      summary: 读取连接列目录与入站列概览
      security:
        - sessionCookie: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: 操作成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectColumnCatalog"
              examples:
                example:
                  $ref: "#/components/examples/ConnectColumnCatalog"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags:
        - WorkItems
      operationId: createConnectColumn
      summary: 创建项目连接列
      security:
        - sessionCookie: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectColumnCreateRequest"
      responses:
        "201":
          description: 操作成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectColumn"
              examples:
                example:
                  $ref: "#/components/examples/ConnectColumn"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /projects/{projectId}/connect-columns/{columnId}:
    patch:
      tags:
        - WorkItems
      operationId: updateConnectColumn
      summary: 按完整快照修改连接列
      security:
        - sessionCookie: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: columnId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectColumnUpdateRequest"
      responses:
        "200":
          description: 操作成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectColumn"
              examples:
                example:
                  $ref: "#/components/examples/ConnectColumn"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          description: 项目归档或待移除目标仍有有效连接。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ConnectTargetInUseError"
              examples:
                targetInUse:
                  $ref: "#/components/examples/ConnectTargetInUseError"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
      description: 无变化时不升版本、不发事件；移除仍有有效连接的目标返回 CONNECT_TARGET_IN_USE 及目标 ID、有效连接数。
    delete:
      tags:
        - WorkItems
      operationId: deleteConnectColumn
      summary: 负责人删除连接列并解除列内连接
      security:
        - sessionCookie: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: columnId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: 操作成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectColumnDeleteResult"
              examples:
                example:
                  $ref: "#/components/examples/ConnectColumnDeleteResult"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/connect-targets:
    get:
      tags:
        - WorkItems
      operationId: searchConnectTargetProjects
      summary: 搜索本公司启用项目的最小信息
      security:
        - sessionCookie: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            minLength: 0
            maxLength: 80
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 操作成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectTargetProjectPage"
              examples:
                example:
                  $ref: "#/components/examples/ConnectTargetProjectPage"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /projects/{projectId}/work-item-connections:
    get:
      tags:
        - WorkItems
      operationId: listWorkItemConnectionCells
      summary: 批量读取工作项出站与入站连接
      security:
        - sessionCookie: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: workItemIds
          in: query
          required: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Uuid"
            minItems: 1
            maxItems: 100
          style: form
          explode: true
      responses:
        "200":
          description: 操作成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemConnectionCellList"
              examples:
                example:
                  $ref: "#/components/examples/WorkItemConnectionCellList"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
      description: 只返回本项目未删除工作项，外项目 ID 静默忽略；incomingByColumn 按来源连接列分组，每列最多 50 条并给出该列完整计数，供目标项目渲染双向连接的反向列。incoming 与 incomingTotal 是跨列汇总的兼容视图（最多 50 条与完整计数）。请求 1–100 行采用固定次数批量 SQL。
  /work-items/{workItemId}/incoming-connections:
    get:
      tags:
        - WorkItems
      operationId: listIncomingWorkItemConnections
      summary: 分页读取可见的入站连接
      security:
        - sessionCookie: []
      parameters:
        - name: workItemId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: columnId
          in: query
          required: false
          description: 只返回该来源连接列的入站连接，用于反向列展开分页。
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: 操作成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemConnectionPage"
              examples:
                example:
                  $ref: "#/components/examples/WorkItemConnectionPage"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
      description: 每条连接须有任一端项目可见；在 SQL 中裁剪可见连接后计数与分页。
  /work-item-connections/{connectionId}:
    get:
      tags:
        - WorkItems
      operationId: getWorkItemConnection
      summary: 读取连接与两端最小卡片
      security:
        - sessionCookie: []
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: 操作成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemConnection"
              examples:
                example:
                  $ref: "#/components/examples/WorkItemConnection"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
      description: 能看见任一端项目即可读取两端 ConnectionCard；任一工作项已删除时省略该连接。
    delete:
      tags:
        - WorkItems
      operationId: unlinkWorkItemConnection
      summary: 任一端项目成员解除连接
      security:
        - sessionCookie: []
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: 操作成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemConnection"
              examples:
                example:
                  $ref: "#/components/examples/WorkItemConnection"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{projectId}/connect-columns/{columnId}/create-options:
    get:
      tags:
        - WorkItems
      operationId: getConnectCreateOptions
      summary: 读取新建并关联的目标类别选项
      security:
        - sessionCookie: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: columnId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: targetProjectId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: 操作成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectCreateOptions"
              examples:
                example:
                  $ref: "#/components/examples/ConnectCreateOptions"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /projects/{projectId}/connect-columns/{columnId}/candidates:
    get:
      tags:
        - WorkItems
      operationId: searchConnectCandidates
      summary: 双侧成员搜索可关联的目标工作项
      security:
        - sessionCookie: []
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: columnId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: targetProjectId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: sourceWorkItemId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: q
          in: query
          required: false
          description: 为空时按排序浏览全部工作项。
          schema:
            type: string
            minLength: 0
            maxLength: 80
        - name: fields
          in: query
          required: false
          description: 搜索词匹配的字段，默认只匹配名称（标题与编号前缀）；处理人按姓名匹配最多 100 位有效成员。
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ConnectCandidateField"
            minItems: 1
            maxItems: 5
          style: form
          explode: true
        - name: sort
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ConnectCandidateSort"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
      responses:
        "200":
          description: 操作成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectCandidatePage"
              examples:
                example:
                  $ref: "#/components/examples/ConnectCandidatePage"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
      description: 根项与子项均可返回，排除已删除；搜索词按所选字段匹配，任一字段命中即返回。完全编号匹配优先，其次按 sort（RECENT 为 updated_at DESC，TITLE 为标题升序）与 id 排序。
  /work-items/{workItemId}/connections:
    post:
      tags:
        - WorkItems
      operationId: linkWorkItemConnection
      summary: 双侧项目成员关联已有工作项
      security:
        - sessionCookie: []
      parameters:
        - name: workItemId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemConnectionLinkRequest"
      responses:
        "200":
          description: 同列同端点已有有效连接，返回同一连接 ID。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemConnection"
              examples:
                example:
                  $ref: "#/components/examples/WorkItemConnection"
        "201":
          description: 操作成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemConnection"
              examples:
                example:
                  $ref: "#/components/examples/WorkItemConnection"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /work-items/{workItemId}/connected-work-items:
    post:
      tags:
        - WorkItems
      operationId: createConnectedWorkItem
      summary: 在目标项目新建根工作项并关联
      security:
        - sessionCookie: []
      parameters:
        - name: workItemId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectedWorkItemCreateRequest"
      responses:
        "201":
          description: 操作成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemConnection"
              examples:
                example:
                  $ref: "#/components/examples/WorkItemConnection"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
      description: 仅要求来源项目 OWNER/MEMBER，两端项目 ACTIVE。目标根项与连接在同一事务创建，默认状态 NOT_STARTED，其余可选字段为空。
  /work-items/{workItemId}/reverse-connect-candidates:
    get:
      tags:
        - WorkItems
      operationId: searchReverseConnectCandidates
      summary: 从反向列搜索连接列所在项目的工作项
      security:
        - sessionCookie: []
      parameters:
        - name: workItemId
          in: path
          required: true
          description: 目标项目中打开反向列的工作项。
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: columnId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: q
          in: query
          required: false
          description: 为空时按排序浏览全部工作项。
          schema:
            type: string
            minLength: 0
            maxLength: 80
        - name: fields
          in: query
          required: false
          description: 搜索词匹配的字段，默认只匹配名称（标题与编号前缀）；处理人按姓名匹配最多 100 位有效成员。
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ConnectCandidateField"
            minItems: 1
            maxItems: 5
          style: form
          explode: true
        - name: sort
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ConnectCandidateSort"
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
      responses:
        "200":
          description: 操作成功。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectCandidatePage"
              examples:
                example:
                  $ref: "#/components/examples/ConnectCandidatePage"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
