  /me/time-tracker/preferences:
    put:
      tags:
        - TimeTracking
      operationId: updateTimeTrackingPreferences
      summary: 保存本人计时器开关与上班时间
      description: 要求会话、XSRF 与 /me/time-tracker 最近读取的 If-Match，并推进计时状态版本。关闭计时器时在同一事务内停止本人全部运行计时，已计时长保留；关闭后开始或切换计时返回 409（TIMER_DISABLED）。上班时间按公司时区的当天分钟数表示，只用于本人填报提示与按时长排入的起点。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
