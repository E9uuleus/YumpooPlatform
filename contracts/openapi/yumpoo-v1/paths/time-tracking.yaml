paths:
  /me/time-sessions:
    get:
      tags:
        - TimeTracking
      operationId: listMyTimeSessions
      summary: 查询本人时间段内的计时记录
      description: 返回与 [from, to) 相交的本人未删除记录，按开始时间排序。to 必须晚于 from，且区间不超过 7 天，否则返回 INVALID_RANGE。不可见项目的标题、编号、名称和颜色不披露。
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 本人计时记录与服务端当前时间。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyTimeSessionPage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /me/time-sessions/fill:
    post:
      tags:
        - TimeTracking
      operationId: fillMyTimeSessions
      summary: 按并行、替换或空白模式补录本人工时
      description: 条目区间必须已结束，同一工作项的条目先求并集。PARALLEL 只补本项空白；REPLACE 裁剪本人可编辑的其他工作项记录后补本项空白；GAPS 只补本人没有任何记录的时段。补录不推进计时器状态版本。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeSessionFillCommand"
      responses:
        "200":
          description: 补录创建、修改、删除条数与跳过时长。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSessionFillResult"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /me/time-sessions/{sessionId}/reassign:
    post:
      tags:
        - TimeTracking
      operationId: reassignMyTimeSession
      summary: 把本人一条已结束的计时记录整体改归属到其他工作项
      description: 要求该记录最近读取的 If-Match。同一事务内软删除原记录，并按 PARALLEL 方式在目标工作项补同一时段（只跳过目标项自身已有的部分），沿用 deleted 与 added 事件。运行中、已删除、所属工作项或项目已归档的记录返回 409 SESSION_NOT_EDITABLE；目标与原工作项相同返回 422 UNCHANGED。
      security:
        - sessionCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeSessionReassignCommand"
      responses:
        "200":
          description: 改归属的创建、删除条数与跳过时长。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSessionFillResult"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /me/time-tracker/candidates:
    get:
      tags:
        - TimeTracking
      operationId: listTimerCandidates
      summary: 跨项目查找本人可计时的工作项
      description: 在当前公司有效成员且未归档的项目中查询。PERSONAL 包含分配给本人和本人最近计时或手动补录过的工作项；ALL 包含全部可计时工作项。按最近计时、本人分配、更新时间排序，每项只出现一次，查询名称、编号或项目名。启动时仍重新验证写权限。projectId、assignedToMe、excludeCompleted 在服务端分页之前生效；首段响应附带不受 projectId 限制的项目计数。
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - PERSONAL
              - ALL
            default: PERSONAL
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - name: projectId
          in: query
          style: form
          explode: true
          description: 只返回这些项目中的候选；不在本人可计时项目内的 ID 会被忽略。
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              format: uuid
        - name: assignedToMe
          in: query
          schema:
            type: boolean
            default: false
        - name: excludeCompleted
          in: query
          description: 按本人对各项目的完成定义排除已完成的工作项。
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 可计时候选项，服务端按权限筛选后分页。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimerCandidatePage"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
