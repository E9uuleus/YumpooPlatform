paths:
  /me/onboarding:
    get:
      tags:
        - Onboarding
      operationId: getMyOnboarding
      summary: 查询本人已处理的新手引导
      description: 返回当前账号已完成或跳过的引导及其版本；从未处理过任何引导时 tours 为空数组。上线前已存在的账号由迁移预置为全部已处理。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 本人新手引导记录。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /me/onboarding/tours/{tourId}:
    put:
      tags:
        - Onboarding
      operationId: completeMyOnboardingTour
      summary: 记录本人已处理某个新手引导
      description: 完成与跳过都调用本接口。版本只升不降，天然幂等，仅要求会话与 XSRF；服务端不校验 tourId 是否为前端已定义的引导。
      security:
        - sessionCookie: []
      parameters:
        - name: tourId
          in: path
          required: true
          description: 前端定义的引导标识。
          schema:
            $ref: "#/components/schemas/OnboardingTourId"
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingTourCompleteRequest"
      responses:
        "200":
          description: 写入后的本人新手引导记录。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
