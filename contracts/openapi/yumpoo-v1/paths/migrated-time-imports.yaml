paths:
  /company/migrated-time-imports:
    post:
      tags:
        - TeamDashboard
      operationId: importMigratedTime
      summary: 按成员、日期与工作项批量迁入或预览历史工时
      description: 仅公司管理员可用。每行是一名成员一天在一个工作项上的分钟数，按项目名称与工作项标题匹配本公司 ACTIVE 项目中未删除、未归档的工作项，成员须是该项目的有效成员；匹配不到的行列入 skippedRows，不写入。匹配到的行按成员与日期汇总，服务端从该成员的上班时间起把当天时长依次排进空闲时段，再按请求顺序切给各行，写成带 migrated 标记的只读工作项计时记录；同一成员同一天再次迁入覆盖上次的迁入结果。排布按公司时区计算，当天排不下的天不写入任何记录。dryRun 为 true 时只返回结果、不写入；为 false 时在单事务内提交。不发领域事件，整次只写一条安全审计。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigratedTimeImportRequest"
      responses:
        "200":
          description: 逐日排布结果；dryRun 为 false 时同时表示已提交，幂等重放返回同一结果。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigratedTimeImportResult"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
