paths:
  /projects:
    get:
      tags:
        - Projects
      operationId: listProjects
      summary: 查询调用人可见的 Project
      description: lifecycle 省略时返回全部可见项目（ALL）；分页和总数使用相同权限及筛选谓词。
      security:
        - sessionCookie: []
      parameters:
        - name: query
          in: query
          schema:
            type: string
            maxLength: 80
        - name: ownerUserIds
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Uuid"
        - name: actorAccesses
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ProjectActorAccess"
        - name: updatedSince
          in: query
          schema:
            type: string
            format: date-time
        - name: lifecycle
          in: query
          schema:
            $ref: "#/components/schemas/ProjectLifecycleFilter"
        - name: ended
          in: query
          description: 省略时不按结束状态筛选；true 只返回已结束，false 只返回未结束。
          schema:
            type: boolean
        - name: ids
          in: query
          description: 只返回这些 ID 中调用人可见且符合其他筛选的项目；排序、分页与总数规则不变。
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              $ref: "#/components/schemas/Uuid"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 按 name、code、id 稳定排序的权限过滤分页。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags:
        - Projects
      operationId: createProject
      summary: 原子创建 ACTIVE Project
      description: 任意 ACTIVE + ENABLED 成员创建项目并成为负责人。同一事务生成编码、创建项目与成员关系，初始化内置默认类别和标签。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: Project 已原子创建，或返回同一幂等命令的既有成功结果。
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /projects/owner-options:
    get:
      tags:
        - Projects
      operationId: listProjectOwnerOptions
      summary: 查询调用人可见项目涉及的负责人选项
      description: 只返回可见项目当前负责人最小信息，包含仍挂在项目上的离职或停用用户。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 按显示名和用户 ID 稳定排序的负责人选项。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectOwnerOption"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /projects/{projectId}:
    get:
      tags:
        - Projects
      operationId: getProject
      summary: 查询可见 Project 完整详情
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project 详情、调用人访问模式与能力摘要。
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    patch:
      tags:
        - Projects
      operationId: updateProject
      summary: Owner 替换 Project 可变配置完整快照
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: 更新后的完整详情；无变化时 ETag 保持不变。
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{projectId}/archive:
    post:
      tags:
        - Projects
      operationId: archiveProject
      summary: 负责人或 CompanyAdmin 归档 ACTIVE Project
      description: 锁定 Project 并验证版本和权限；未关闭工作项不阻止归档。归档后普通成员不可访问，负责人和 CompanyAdmin 保留只读访问与恢复权限。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/ProjectChanged"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /projects/{projectId}/restore:
    post:
      tags:
        - Projects
      operationId: restoreProject
      summary: 负责人或 CompanyAdmin 恢复 ARCHIVED Project
      description: 锁内重验 Owner、ACTIVE membership、用户状态和 ACTIVE Workspace。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/ProjectChanged"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{projectId}/end:
    post:
      tags:
        - Projects
      operationId: endProject
      summary: 负责人或 CompanyAdmin 结束进行中的 Project
      description: 结束后内容只读，成员仍可见并计入统计；停止项目内运行中的计时。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/ProjectChanged"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{projectId}/resume:
    post:
      tags:
        - Projects
      operationId: resumeProject
      summary: 负责人或 CompanyAdmin 重新打开已结束的 Project
      description: 重新打开后项目内容恢复可写。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/ProjectChanged"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{projectId}/deletion:
    post:
      tags:
        - Projects
      operationId: scheduleProjectDeletion
      summary: 计划永久删除已归档项目
      description: 仅负责人或公司管理员可用；确认编号必须精确匹配项目编号。默认30天缓冲期内可撤销，清除开始后项目不可见。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDeletionRequest"
      responses:
        "200":
          description: 已计划删除的项目状态。
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDeletionMutation"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
    delete:
      tags:
        - Projects
      operationId: cancelProjectDeletion
      summary: 撤销尚未开始清除的项目删除计划
      description: 仅负责人或公司管理员可用；撤销后仍保持归档，可再恢复项目。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 删除计划已撤销。
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDeletionMutation"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{projectId}/workspace-moves:
    post:
      tags:
        - Projects
      operationId: moveProjectWorkspace
      summary: 已弃用的跨 Workspace 迁移兼容入口
      description: 所有 Project 已归属 MAIN；通过身份、资源与前置条件校验后固定返回 409 INVALID_STATE_TRANSITION。
      deprecated: true
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWorkspaceMoveRequest"
      responses:
        "200":
          $ref: "#/components/responses/ProjectChanged"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{projectId}/members:
    get:
      tags:
        - Projects
      operationId: listProjectMembers
      summary: 查询 Project 成员
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ProjectMembershipStatusFilter"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Owner 优先、ACTIVE 按加入时间、REMOVED 按移除时间稳定排序的分页。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberPage"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    post:
      tags:
        - Projects
      operationId: addProjectMember
      summary: 加入或重激活 Project 成员
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
            pattern: ^"[0-9]+"$
          description: 仅重激活 REMOVED membership 时必填该 membership 的强 ETag。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberAddRequest"
      responses:
        "200":
          $ref: "#/components/responses/ProjectMemberChanged"
        "201":
          $ref: "#/components/responses/ProjectMemberCreated"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{projectId}/members/{userId}:
    delete:
      tags:
        - Projects
      operationId: removeProjectMember
      summary: 移除 Project 成员
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: userId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberRemoveRequest"
      responses:
        "200":
          $ref: "#/components/responses/ProjectMemberChanged"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{projectId}/leave:
    post:
      tags:
        - Projects
      operationId: leaveProject
      summary: 项目成员退出进行中的 Project
      description: 只有非负责人的成员可以退出；服务端使用调用者当前的成员版本，不需要 If-Match。退出后停止调用者在该项目中运行中的计时，已有工时、讨论与处理人记录保留。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/ProjectMemberChanged"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
  /projects/{projectId}/member-candidates:
    get:
      tags:
        - Projects
      operationId: listProjectMemberCandidates
      summary: 搜索同企业有效 Project 成员候选人
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 候选人及其当前 membership 状态；不含邮箱、手机号等目录资料。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberCandidatePage"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /projects/{projectId}/owner-reassignments:
    post:
      tags:
        - Projects
      operationId: reassignProjectOwner
      summary: 负责人或 CompanyAdmin 原子重指派 Project 唯一负责人
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectOwnerReassignmentRequest"
      responses:
        "200":
          $ref: "#/components/responses/ProjectChanged"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
