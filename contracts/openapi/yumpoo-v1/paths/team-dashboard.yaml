paths:
  /company/team-dashboard/options:
    get:
      tags:
        - TeamDashboard
      operationId: getTeamDashboardOptions
      summary: 查询团队视图的项目、成员与公司时区
      description: 仅公司管理员（含平台管理员）可用。返回本公司全部项目（含已归档）与在职启用成员。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 团队视图筛选选项。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDashboardOptions"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
  /company/team-dashboard/timesheet/query:
    post:
      tags:
        - TeamDashboard
      operationId: queryTeamTimesheet
      summary: 按成员、自然日与工作项统计计入时长
      description: 仅公司管理员可用。按公司时区切分自然日，跨日记录按重叠时长拆分；运行中计时统计到 asOf，时长为按并行均摊后的计入时长。projectIds 为空表示全公司项目（含已归档），userIds 为空表示在职成员及区间内有计时的成员。区间最多 93 天，排除已删除工作项。categoryEntries 返回分类工时；有项目筛选时只含关联到这些项目的分类工时。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamTimesheetQuery"
      responses:
        "200":
          description: 成员工时统计。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamTimesheet"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /company/team-dashboard/workload/query:
    post:
      tags:
        - TeamDashboard
      operationId: queryTeamWorkload
      summary: 按处理人统计当前待开始与进行中的工作项
      description: 仅公司管理员可用。只统计未删除、未归档且状态分类为 TODO 或 IN_PROGRESS 的工作项，多处理人分别计入；projectIds 为空表示全公司未归档项目。逾期为截止日期早于公司时区今天。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamWorkloadQuery"
      responses:
        "200":
          description: 成员当前任务统计。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWorkload"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /company/team-dashboard/workload/tasks/query:
    post:
      tags:
        - TeamDashboard
      operationId: queryTeamMemberTasks
      summary: 分页查询某成员（或未分配）的当前任务
      description: 仅公司管理员可用，范围与成员当前任务统计一致。按截止日期升序（无截止日期在后）、进行中优先、更新时间倒序排列。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberTasksQuery"
      responses:
        "200":
          description: 成员当前任务分页。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberTaskPage"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
