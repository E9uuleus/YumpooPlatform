        - sessionCookie: []
      parameters:
        - name: from
          in: query
          required: true
          schema: *a1
        - name: to
          in: query
          required: true
          schema: *a1
        - *a2
        - *a3
        - *a4
        - *a5
        - *a6
        - *a7
        - name: failed
          in: query
          description: 只返回失败的 HTTP 请求（访问日志 status ≥ 400），覆盖 INFO 的 4xx、WARN 的 403 与 5xx；与其他条件取交集。
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 查询或更新成功。
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: 禁止缓存。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsLogHistogram"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          description: 另一项文件扫描正在进行，请稍后重试。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /admin/operations/alerts/summary:
    get:
      tags:
