paths:
  /admin/operations/overview:
    get:
      tags:
        - Operations
      operationId: getOperationsOverview
      summary: 获取运维概览
      description: "仅当前有效 APP_MANAGER 可访问；响应（含错误）使用 Cache-Control: no-store。"
      security:
        - sessionCookie: []
      parameters: []
      responses:
        "200":
          description: 查询或更新成功。
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: 禁止缓存。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsOverview"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /admin/operations/host:
    get:
      tags:
        - Operations
      operationId: getOperationsHost
      summary: 获取主机与运行时信息
      description: "仅当前有效 APP_MANAGER 可访问；响应（含错误）使用 Cache-Control: no-store。"
      security:
        - sessionCookie: []
      parameters: []
      responses:
        "200":
          description: 查询或更新成功。
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: 禁止缓存。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsHost"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /admin/operations/metrics:
    get:
      tags:
        - Operations
      operationId: getOperationsMetrics
      summary: 获取指标时序
      description: "仅当前有效 APP_MANAGER 可访问；响应（含错误）使用 Cache-Control: no-store。"
      security:
        - sessionCookie: []
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum:
              - 1h
              - 6h
              - 24h
              - 7d
              - 14d
            default: 1h
        - name: keys
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: 查询或更新成功。
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: 禁止缓存。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsMetricSeries"
              examples:
                sample:
                  $ref: "#/components/examples/OperationsMetricsWithGap"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /admin/operations/sessions/summary:
    get:
      tags:
        - Operations
      operationId: getOperationsSessionSummary
      summary: 获取有效会话统计
      description: "仅当前有效 APP_MANAGER 可访问；响应（含错误）使用 Cache-Control: no-store。"
      security:
        - sessionCookie: []
      parameters: []
      responses:
        "200":
          description: 查询或更新成功。
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: 禁止缓存。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsSessionSummary"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /admin/operations/sessions:
    get:
      tags:
        - Operations
      operationId: listOperationsSessions
      summary: 按成员查询有效会话
      description: "仅当前有效 APP_MANAGER 可访问；响应（含错误）使用 Cache-Control: no-store。"
      security:
        - sessionCookie: []
      parameters:
        - name: presence
          in: query
          required: false
          schema:
            type: string
            enum:
              - ONLINE
              - IDLE
              - AWAY
        - name: clientType
          in: query
          required: false
          schema:
            type: string
            enum:
              - WEB
              - ELECTRON
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - &a8
          name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
        - &a9
          name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: 查询或更新成功。
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: 禁止缓存。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsSessionPage"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /admin/operations/logs:
    get:
      tags:
        - Operations
      operationId: queryOperationsLogs
      summary: 查询运行日志
      description: "仅当前有效 APP_MANAGER 可访问；响应（含错误）使用 Cache-Control: no-store。"
      security:
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          required: false
          schema: &a1
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema: *a1
        - &a2
          name: levels
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - &a3
          name: modules
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - &a4
          name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - &a5
          name: requestId
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - &a6
          name: event
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - &a7
          name: userId
          in: query
          required: false
          schema:
            type: string
            maxLength: 36
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: failed
          in: query
          description: 只返回失败的 HTTP 请求（访问日志 status ≥ 400），覆盖 INFO 的 4xx、WARN 的 403 与 5xx；与其他条件取交集。
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 查询或更新成功。
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: 禁止缓存。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsLogPage"
              examples:
                sample:
                  $ref: "#/components/examples/OperationsPartialLogPage"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          description: 另一项文件扫描正在进行，请稍后重试。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /admin/operations/logs/tail:
    get:
      tags:
        - Operations
      operationId: tailOperationsLogs
      summary: 增量跟随运行日志
      description: "仅当前有效 APP_MANAGER 可访问；响应（含错误）使用 Cache-Control: no-store。"
      security:
        - sessionCookie: []
      parameters:
        - name: bootId
          in: query
          required: false
          schema: &a11
            type: string
        - name: afterSeq
          in: query
          required: false
          schema:
            type: string
            pattern: ^[0-9]+$
        - *a2
        - *a3
        - *a4
        - *a5
        - *a6
        - *a7
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: failed
          in: query
          description: 只返回失败的 HTTP 请求（访问日志 status ≥ 400），覆盖 INFO 的 4xx、WARN 的 403 与 5xx；与其他条件取交集。
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: 查询或更新成功。
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: 禁止缓存。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsLogTail"
              examples:
                sample:
                  $ref: "#/components/examples/OperationsLogTailSample"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /admin/operations/logs/histogram:
    get:
