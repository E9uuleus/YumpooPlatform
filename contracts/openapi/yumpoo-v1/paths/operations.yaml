      tags:
        - Operations
      operationId: acknowledgeOperationsAlert
      summary: 确认活跃告警
      description: "仅当前有效 APP_MANAGER 可访问；响应（含错误）使用 Cache-Control: no-store。"
      security:
        - sessionCookie: []
      parameters:
        - name: alertId
          in: path
          required: true
