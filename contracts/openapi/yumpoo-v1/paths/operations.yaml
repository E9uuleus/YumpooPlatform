      tags:
        - Operations
      operationId: updateOperationsAlertRule
      summary: 更新告警规则
      description: "仅当前有效 APP_MANAGER 可访问；响应（含错误）使用 Cache-Control: no-store。"
      security:
        - sessionCookie: []
      parameters:
        - name: code
          in: path
          required: true
          schema: *a11
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: 查询或更新成功。
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                  - no-store
              description: 禁止缓存。
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsRule"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
