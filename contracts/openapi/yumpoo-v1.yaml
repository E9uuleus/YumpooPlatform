        displayName: { type: string, minLength: 1, maxLength: 80 }
        colorToken: { $ref: '#/components/schemas/WorkItemLabelColorToken' }
        sortOrder: { type: integer, format: int32, minimum: 0 }
        active: { type: boolean }

    ProjectContentCatalog:
      type: object
      additionalProperties: false
      required: [items, blueprintOptions, workflowStatusOptions, priorityOptions, canCreate,
        canManageLabels]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Content' } }
        blueprintOptions: { type: array, items: { $ref: '#/components/schemas/ContentBlueprintOption' } }
        workflowStatusOptions: { type: array, items: { $ref: '#/components/schemas/ContentWorkflowStatusOption' } }
        priorityOptions: { type: array, items: { $ref: '#/components/schemas/ContentPriorityOption' } }
        canCreate: { type: boolean }
        canManageLabels: { type: boolean }

    ContentCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name, description, blueprintCode]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 500, nullable: true }
        blueprintCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }

    ContentUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, description, defaultViewType, viewConfig]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 500, nullable: true }
        defaultViewType: { $ref: '#/components/schemas/ContentViewType' }
        viewConfig: { $ref: '#/components/schemas/ContentViewConfig' }

    ProjectTemplateVersionStatus:
      type: string
      enum: [DRAFT, PUBLISHED, RETIRED]

    WorkItemType:
      type: string
      enum: [REQUIREMENT, TASK, DEFECT]

    ProjectTemplateViewType:
      type: string
      enum: [TABLE]

    WorkflowStatusCategory:
      type: string
      enum: [TODO, IN_PROGRESS, DONE, CANCELED]

    WorkflowRequiredPermission:
      type: string
      enum: [MEMBER]

    ProjectTemplateContentBlueprint:
      type: object
      additionalProperties: false
      required: [contentCode, displayName, workItemType, defaultViewType, sortOrder]
      properties:
        contentCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        workItemType: { $ref: '#/components/schemas/WorkItemType' }
        defaultViewType: { $ref: '#/components/schemas/ProjectTemplateViewType' }
        sortOrder: { type: integer, format: int32, minimum: 1 }

    WorkflowStatusDefinition:
      type: object
      additionalProperties: false
      required: [statusCode, displayName, statusCategory, sortOrder, initial, terminal]
      properties:
        statusCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        statusCategory: { $ref: '#/components/schemas/WorkflowStatusCategory' }
        sortOrder: { type: integer, format: int32, minimum: 1 }
        initial: { type: boolean }
        terminal: { type: boolean }

    WorkflowTransitionDefinition:
      type: object
      additionalProperties: false
      required: [fromStatus, toStatus, requiredPermission, requiresResolution]
      properties:
        fromStatus: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        toStatus: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        requiredPermission: { $ref: '#/components/schemas/WorkflowRequiredPermission' }
        requiresResolution: { type: boolean }

    ProjectTemplateVersion:
      type: object
      additionalProperties: false
      required:
        - templateVersionId
        - templateKey
        - version
        - versionCode
        - projectType
        - displayName
        - lifecycleStatus
        - rowVersion
        - publishedAt
        - retiredAt
        - contentBlueprints
        - statuses
        - transitions
      properties:
        templateVersionId: { $ref: '#/components/schemas/Uuid' }
        templateKey: { $ref: '#/components/schemas/ProjectTemplateKey' }
        version: { type: integer, format: int32, minimum: 1 }
        versionCode: { type: string, pattern: '^[A-Z][A-Z0-9_]*_V[1-9][0-9]*$' }
        projectType: { $ref: '#/components/schemas/ProjectType' }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        lifecycleStatus: { $ref: '#/components/schemas/ProjectTemplateVersionStatus' }
        rowVersion: { type: integer, format: int64, minimum: 0, readOnly: true }
        publishedAt: { type: string, format: date-time, nullable: true, readOnly: true }
        retiredAt: { type: string, format: date-time, nullable: true, readOnly: true }
        contentBlueprints:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/ProjectTemplateContentBlueprint' }
        statuses:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WorkflowStatusDefinition' }
        transitions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WorkflowTransitionDefinition' }

    ProjectTemplateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectTemplateVersion' }

    Company:
      type: object
      additionalProperties: false
      required: [id, displayName, timezone, weekStartDay, defaultWorkdayMinutes, rowVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        timezone: { type: string, minLength: 1, example: Asia/Shanghai }
        weekStartDay: { type: string, enum: [MONDAY] }
        defaultWorkdayMinutes: { type: integer, format: int32, minimum: 1, maximum: 720 }
        rowVersion: { type: integer, format: int64, minimum: 0 }

    WeComOAuthStatus:
      type: object
      additionalProperties: false
      required: [enabled, configured, corpIdMasked, agentIdConfigured, appSecretConfigured, callbackConfigured]
      properties:
        enabled: { type: boolean }
        configured: { type: boolean }
        corpIdMasked: { type: string, nullable: true }
        agentIdConfigured: { type: boolean }
        appSecretConfigured: { type: boolean }
        callbackConfigured: { type: boolean }

    WeComDirectoryStatus:
      type: object
      additionalProperties: false
      required: [enabled, configured, corpIdMasked, directorySecretConfigured, profileSecretConfigured]
      properties:
        enabled: { type: boolean }
        configured: { type: boolean }
        corpIdMasked: { type: string, nullable: true }
        directorySecretConfigured: { type: boolean }
        profileSecretConfigured: { type: boolean }

    WeComIntegrationStatus:
      type: object
      additionalProperties: false
      required: [oauth, directory, corpIdConsistent, activeRunId, lastSuccessfulRunAt, lastProblemAt, lastProblemCode]
      properties:
        oauth: { $ref: '#/components/schemas/WeComOAuthStatus' }
        directory: { $ref: '#/components/schemas/WeComDirectoryStatus' }
        corpIdConsistent: { type: boolean }
        activeRunId: { type: string, format: uuid, nullable: true }
        lastSuccessfulRunAt: { type: string, format: date-time, nullable: true }
        lastProblemAt: { type: string, format: date-time, nullable: true }
        lastProblemCode: { type: string, nullable: true }

    Member:
      type: object
      additionalProperties: false
      required: [userId, displayName, externalUserId, email, mobile, departmentSummary, employmentStatus, accountStatus, directorySyncedAt, leftAt, accountDisabledAt, accountDisabledByUserId, platformRoles, authorizationVersion, rowVersion, etag]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        externalUserId: { type: string, minLength: 1, maxLength: 256 }
        email: { type: string, nullable: true }
        mobile: { type: string, nullable: true }
        departmentSummary: { type: string, nullable: true }
        employmentStatus: { $ref: '#/components/schemas/EmploymentStatus' }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        directorySyncedAt: { $ref: '#/components/schemas/Instant' }
        leftAt: { type: string, format: date-time, nullable: true }
        accountDisabledAt: { type: string, format: date-time, nullable: true }
        accountDisabledByUserId: { type: string, format: uuid, nullable: true }
        platformRoles:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ManagedPlatformRole' }
        authorizationVersion: { type: integer, format: int64, minimum: 0 }
        rowVersion: { type: integer, format: int64, minimum: 0 }
        etag: { type: string, pattern: '^"[0-9]+"$' }

    MemberPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Member' } }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    DirectorySyncRunStatus:
      type: string
      enum: [RUNNING, SUCCEEDED, PARTIALLY_SUCCEEDED, FAILED]

    DirectorySyncTriggerType:
      type: string
      enum: [MANUAL, SCHEDULED]

    DirectorySyncCounts:
      type: object
      additionalProperties: false
      required: [discovered, staged, created, updated, unchanged, left, returned, failed, notApplied]
      properties:
        discovered: { type: integer, format: int32, minimum: 0 }
        staged: { type: integer, format: int32, minimum: 0 }
        created: { type: integer, format: int32, minimum: 0 }
        updated: { type: integer, format: int32, minimum: 0 }
        unchanged: { type: integer, format: int32, minimum: 0 }
        left: { type: integer, format: int32, minimum: 0 }
        returned: { type: integer, format: int32, minimum: 0 }
        failed: { type: integer, format: int32, minimum: 0 }
        notApplied: { type: integer, format: int32, minimum: 0 }

    DirectorySyncRun:
      type: object
      additionalProperties: false
      required: [runId, triggerType, triggeredByUserId, triggeredByDisplayName, phase, status, cursorTerminationMode, pageCount, scanComplete, counts, errorCode, errorSummary, requestId, rowVersion, startedAt, finishedAt]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        triggerType: { $ref: '#/components/schemas/DirectorySyncTriggerType' }
        triggeredByUserId: { type: string, format: uuid, nullable: true }
        triggeredByDisplayName: { type: string, nullable: true }
        phase: { type: string, enum: [COLLECTING_IDS, COLLECTING_PROFILES, APPLYING, FINALIZING, COMPLETED] }
        status: { $ref: '#/components/schemas/DirectorySyncRunStatus' }
        cursorTerminationMode: { type: string, nullable: true, enum: [EXPLICIT_EMPTY, OMITTED_CONFIRMED] }
        pageCount: { type: integer, format: int32, minimum: 0 }
        scanComplete: { type: boolean }
        counts: { $ref: '#/components/schemas/DirectorySyncCounts' }
        errorCode: { type: string, nullable: true }
        errorSummary: { type: string, nullable: true }
        requestId: { $ref: '#/components/schemas/RequestId' }
        rowVersion: { type: integer, format: int64, minimum: 0 }
        startedAt: { $ref: '#/components/schemas/Instant' }
        finishedAt: { type: string, format: date-time, nullable: true }

    DirectorySyncRunPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DirectorySyncRun' } }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    DirectorySyncFailure:
      type: object
      additionalProperties: false
      required: [maskedMemberReference, action, result, errorCode]
      properties:
        maskedMemberReference: { type: string, minLength: 1 }
        action: { type: string, enum: [PROVISION] }
        result: { type: string, enum: [FAILED, NOT_APPLIED] }
        errorCode: { type: string, minLength: 1 }

    DirectorySyncFailurePage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DirectorySyncFailure' } }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    GovernanceReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 160

    RoleGrantRequest:
      type: object
      additionalProperties: false
      required: [userId, reason]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        reason:
          type: string
          minLength: 1
          maxLength: 160

    GovernanceState:
      type: object
      additionalProperties: false
      required: [userId, displayName, employmentStatus, accountStatus, platformRoles, authorizationVersion, rowVersion]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string, minLength: 1 }
        employmentStatus: { $ref: '#/components/schemas/EmploymentStatus' }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        platformRoles:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ManagedPlatformRole' }
        authorizationVersion: { type: integer, format: int64, minimum: 0 }
        rowVersion: { type: integer, format: int64, minimum: 0 }

    RoleAssignment:
      type: object
      additionalProperties: false
      required: [assignmentId, userId, role, scopeType, scopeId, status, grantedAt, revokedAt, rowVersion, etag]
      properties:
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        role: { $ref: '#/components/schemas/ManagedPlatformRole' }
        scopeType: { type: string, enum: [COMPANY, PLATFORM] }
        scopeId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/RoleAssignmentStatus' }
        grantedAt: { $ref: '#/components/schemas/Instant' }
        revokedAt:
          type: string
          format: date-time
          nullable: true
        rowVersion: { type: integer, format: int64, minimum: 0 }
        etag: { type: string, pattern: '^"[0-9]+"$' }

    RoleAssignmentPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RoleAssignment' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    RoleMutationResult:
      type: object
      additionalProperties: false
      required: [assignmentId, companyId, userId, role, status, assignmentRowVersion, userRowVersion, authorizationVersion, changedAt]
      properties:
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        companyId: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        role: { $ref: '#/components/schemas/ManagedPlatformRole' }
        status: { $ref: '#/components/schemas/RoleAssignmentStatus' }
        assignmentRowVersion: { type: integer, format: int64, minimum: 0 }
        userRowVersion: { type: integer, format: int64, minimum: 0 }
        authorizationVersion: { type: integer, format: int64, minimum: 0 }
        changedAt: { $ref: '#/components/schemas/Instant' }

    AccountStatusChangeResult:
      type: object
      additionalProperties: false
      required: [userId, employmentStatus, accountStatus, authorizationVersion, rowVersion]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        employmentStatus: { $ref: '#/components/schemas/EmploymentStatus' }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        authorizationVersion: { type: integer, format: int64, minimum: 0 }
        rowVersion: { type: integer, format: int64, minimum: 0 }

    Instant:
      type: string
      format: date-time
      description: RFC 3339 UTC 时刻。
      example: '2026-08-09T09:30:00.123Z'

    LocalDate:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: 不携带时区或零点时刻的自然日，格式为 YYYY-MM-DD。
      example: '2026-08-09'

    AuthenticationRole:
      type: string
      enum:
        - COMPANY_MEMBER
        - COMPANY_ADMIN
        - APP_MANAGER

    AuthenticationClientType:
      type: string
      enum:
        - WEB
        - ELECTRON

    OpaqueDesktopToken:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'

    ElectronAuthAttemptRequest:
      type: object
      additionalProperties: false
      required: [state, codeChallenge, codeChallengeMethod]
      properties:
        state: { $ref: '#/components/schemas/OpaqueDesktopToken' }
        codeChallenge:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        codeChallengeMethod:
          type: string
          enum: [S256]

    ElectronAuthAttemptResponse:
      type: object
      additionalProperties: false
      required: [authorizationUrl, expiresAt]
      properties:
        authorizationUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    ElectronAuthExchangeRequest:
      type: object
      additionalProperties: false
      required: [state, handoffCode, codeVerifier]
      properties:
        state: { $ref: '#/components/schemas/OpaqueDesktopToken' }
        handoffCode: { $ref: '#/components/schemas/OpaqueDesktopToken' }
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]{43,128}$'

    ElectronAuthExchangeResponse:
      type: object
      additionalProperties: false
      required: [sessionCredential, csrfCredential, absoluteExpiresAt]
      properties:
        sessionCredential: { type: string, minLength: 43, maxLength: 256, writeOnly: true }
        csrfCredential: { type: string, minLength: 43, maxLength: 256, writeOnly: true }
        absoluteExpiresAt: { type: string, format: date-time }

    ClientCompatibility:
      type: string
      enum:
        - SUPPORTED
        - DEPRECATED
        - BLOCKED

    CurrentAuthenticationUser:
      type: object
      additionalProperties: false
      required: [id, displayName, workspaceSlug]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
          minLength: 1
        workspaceSlug:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9]([a-z0-9._@-]{0,62}[a-z0-9])?$'
          description: 当前用户不可变的工作台 URL 片段；不承担身份授权语义。

    CurrentAuthenticationCompany:
      type: object
      additionalProperties: false
      required: [id, displayName, timezone, weekStartDay]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
          minLength: 1
        timezone:
          type: string
          minLength: 1
          description: IANA 时区标识。
          example: Asia/Shanghai
        weekStartDay:
          type: string
          enum: [MONDAY]

    CurrentAuthenticationClient:
      type: object
      additionalProperties: false
      required: [type, compatibility]
      properties:
        type:
          $ref: '#/components/schemas/AuthenticationClientType'
        compatibility:
          $ref: '#/components/schemas/ClientCompatibility'

    CurrentAuthentication:
      type: object
      additionalProperties: false
      required: [user, company, roles, client]
      properties:
        user:
          $ref: '#/components/schemas/CurrentAuthenticationUser'
        company:
          $ref: '#/components/schemas/CurrentAuthenticationCompany'
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthenticationRole'
        client:
          $ref: '#/components/schemas/CurrentAuthenticationClient'

    RequestId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
      description: 服务端生成或从可信反向代理接收的不透明请求关联标识。

    ErrorCode:
      type: string
      description: |
        一期冻结的公共错误码。客户端只能使用 code 做程序判断，不能解析 message。
      enum:
        - MALFORMED_REQUEST
        - AUTHENTICATION_REQUIRED
        - ACCOUNT_DISABLED
        - ACCESS_DENIED
        - RESOURCE_NOT_FOUND
        - IDEMPOTENCY_KEY_REUSED
        - REQUEST_IN_PROGRESS
        - INVALID_STATE_TRANSITION
        - WORKLOG_LOCKED
        - VERSION_CONFLICT
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_ALLOWED
        - VALIDATION_FAILED
        - CLIENT_UPGRADE_REQUIRED
        - PRECONDITION_REQUIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE

    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          minLength: 1
          description: 出错字段的稳定请求字段名。
        code:
          type: string
          minLength: 1
          description: 字段级稳定错误码。
        message:
          type: string
          minLength: 1
          description: 面向当前用户且不包含内部实现信息的说明。

    ApiErrorBase:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
        - retryable
        - fieldErrors
        - details
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          description: 面向当前用户的安全错误说明。
        requestId:
          $ref: '#/components/schemas/RequestId'
        retryable:
          type: boolean
          description: 当前请求是否可在不改变业务意图的前提下自动重试。
        fieldErrors:
          type: array
          description: 字段级错误；非字段校验错误固定为空数组。
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          type: object
          description: 错误专用详情；具体响应 schema 必须进一步收窄。

    EmptyErrorDetails:
      type: object
      additionalProperties: false
      description: |
        通用错误详情默认为空；需要稳定机器可读原因的业务冲突可返回 reason。
      properties:
        reason:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
          description: M2-08 生命周期治理稳定原因；其他业务域可继续使用各自稳定原因。
          x-stable-values:
            - PROJECT_ARCHIVE_BLOCKED
            - WORKSPACE_ARCHIVE_BLOCKED
            - WORKSPACE_UNCHANGED
        blockers:
          type: array
          description: 仅包含稳定分类 code 与非负聚合 count，不含对象标识或业务正文。
          items: { $ref: '#/components/schemas/SafeBlocker' }

    SafeBlocker:
      type: object
      additionalProperties: false
      required: [code, count]
      properties:
        code:
          type: string
          enum: [OPEN_WORK_ITEMS, PENDING_WORKLOG_APPROVALS, OPEN_PRODUCT_FEEDBACK, CURRENT_PROJECTS]
        count: { type: integer, format: int64, minimum: 0 }

    ErrorResponse:
      description: ApiErrorBase 的具体响应类型；details 默认为空，特定冲突可带稳定 reason。
      allOf:
        - $ref: '#/components/schemas/ApiErrorBase'
        - type: object
          required:
            - details
          properties:
            details:
              $ref: '#/components/schemas/EmptyErrorDetails'

    PageMetadata:
      type: object
      additionalProperties: false
      description: |
        普通分页的共享元数据约束。为兼容既定响应 JSON 形状，PageResponse 不增加
        metadata 包装层，而是在顶层平铺并重复声明这里的四个字段。
      required:
        - page
        - size
        - totalElements
        - totalPages
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
          description: 当前页号，从 0 开始。
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: 当前页容量；默认 20，硬上限 100。
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: 在权限过滤后可见的元素总数。
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: 在权限过滤后可见的总页数。

    CursorPageMetadata:
      type: object
      additionalProperties: false
      description: |
        cursor 分页的共享元数据约束。为兼容既定响应 JSON 形状，CursorPageResponse
        不增加 metadata 包装层，而是在顶层平铺并重复声明 nextCursor。
      required:
        - nextCursor
      properties:
        nextCursor:
          type: string
          minLength: 1
          nullable: true
          description: 不透明续读游标；没有下一批时为 null。

    PageResponse:
      type: object
      additionalProperties: false
      description: |
        固定扁平普通分页响应；page、size、totalElements、totalPages 与 PageMetadata
        保持同一约束，不引入 metadata 包装对象。
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          description: 当前页资源 DTO；具体 operation 必须收窄 item schema。
          items:
            type: object
            additionalProperties: true
        page:
          type: integer
          format: int32
          minimum: 0
          description: 当前页号，从 0 开始。
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: 当前页容量；默认 20，硬上限 100。
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: 在权限过滤后可见的元素总数。
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: 在权限过滤后可见的总页数。

    CursorPageResponse:
      type: object
      additionalProperties: false
      description: |
        固定扁平 cursor 分页响应；nextCursor 与 CursorPageMetadata 保持同一约束，
        不引入 metadata 包装对象。
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          description: 当前批次资源 DTO；具体 operation 必须收窄 item schema。
          items:
            type: object
            additionalProperties: true
        nextCursor:
          type: string
          minLength: 1
          nullable: true
          description: 不透明续读游标；没有下一批时为 null。

    AttachmentOwnerType:
      type: string
      enum: [WORK_ITEM, WORK_ITEM_UPDATE, PRODUCT_FEEDBACK, FEEDBACK_UPDATE]

    AttachmentStatus:
      type: string
      enum: [UPLOADING, AVAILABLE, REJECTED, DELETED]

    AttachmentRejectedCode:
      type: string
      nullable: true
      enum: [FILE_TOO_LARGE, FILE_TYPE_NOT_ALLOWED, MALWARE_DETECTED, SCAN_UNAVAILABLE, UPLOAD_INCOMPLETE, INTEGRITY_CHECK_FAILED, PARENT_NOT_WRITABLE, QUOTA_EXCEEDED]

    AttachmentCapabilities:
      type: object
      additionalProperties: false
      required: [canUploadContent, canDownloadContent, canDelete]
      properties:
        canUploadContent: { type: boolean }
        canDownloadContent: { type: boolean }
        canDelete: { type: boolean }

    AttachmentMetadata:
      type: object
      additionalProperties: false
      required: [id, companyId, projectId, ownerType, ownerId, originalFileName, declaredMime, status, uploadedByUserId, createdAt, expiresAt, rowVersion, etag, capabilities]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        companyId: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        ownerType: { $ref: '#/components/schemas/AttachmentOwnerType' }
        ownerId: { $ref: '#/components/schemas/Uuid' }
        originalFileName: { type: string, minLength: 1, maxLength: 255 }
        declaredMime: { type: string, minLength: 1, maxLength: 160 }
        detectedMime: { type: string, minLength: 1, maxLength: 160, nullable: true }
        sizeBytes: { type: integer, format: int64, minimum: 1, maximum: 104857600, nullable: true }
        status: { $ref: '#/components/schemas/AttachmentStatus' }
        rejectedCode: { $ref: '#/components/schemas/AttachmentRejectedCode' }
        uploadedByUserId: { $ref: '#/components/schemas/Uuid' }
        createdAt: { type: string, format: date-time }
        availableAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time }
        rowVersion: { type: integer, format: int64, minimum: 0 }
        etag: { type: string, pattern: '^"[0-9]+"$' }
        capabilities: { $ref: '#/components/schemas/AttachmentCapabilities' }

    AttachmentIntentCreateRequest:
      type: object
      additionalProperties: false
      required: [ownerType, ownerId, originalFileName, declaredMime]
      properties:
        ownerType: { $ref: '#/components/schemas/AttachmentOwnerType' }
        ownerId: { $ref: '#/components/schemas/Uuid' }
        originalFileName: { type: string, minLength: 1, maxLength: 255 }
        declaredMime: { type: string, minLength: 1, maxLength: 160 }
        sizeBytes: { type: integer, format: int64, minimum: 0, maximum: 104857600, nullable: true }

    AttachmentIntentResult:
      type: object
      additionalProperties: false
      required: [uploadUrl, expiresAt, maxBytes, metadata]
      properties:
        uploadUrl: { type: string, pattern: '^/api/v1/attachments/[0-9a-f-]{36}/content$' }
        expiresAt: { type: string, format: date-time }
        maxBytes: { type: integer, format: int64, enum: [104857600] }
        metadata: { $ref: '#/components/schemas/AttachmentMetadata' }

    AttachmentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AttachmentMetadata' }
        nextCursor: { type: string, minLength: 1, nullable: true }

    AttachmentRescanRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    AttachmentDeleteRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    AttachmentDeleteResult:
      type: object
      additionalProperties: false
      required: [attachmentId, status, deletedByUserId, deletedAt, deleteReason, previousRowVersion, rowVersion, etag]
      properties:
        attachmentId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [DELETED] }
        deletedByUserId: { $ref: '#/components/schemas/Uuid' }
        deletedAt: { type: string, format: date-time }
        deleteReason: { type: string, minLength: 1, maxLength: 500 }
        previousRowVersion: { type: integer, format: int64, minimum: 0 }
        rowVersion: { type: integer, format: int64, minimum: 1 }
        etag: { type: string, pattern: '^"[0-9]+"$' }

    AttachmentRescanResult:
      type: object
      additionalProperties: false
      required: [attachmentId, status, generation, rowVersion, etag]
      properties:
        attachmentId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/AttachmentStatus' }
        generation: { type: integer, format: int32, minimum: 1 }
        rowVersion: { type: integer, format: int64, minimum: 0 }
        etag: { type: string, pattern: '^"[0-9]+"$' }

  requestBodies:
    GovernanceReason:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GovernanceReasonRequest' }

  parameters:
    ActivityCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 2048 }
    ActivitySize:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    ActivityEventType:
      name: eventType
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items: { type: string, minLength: 3, maxLength: 128 }
    ActivityEntityType:
      name: entityType
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items: { type: string, minLength: 2, maxLength: 32 }
    ActivityOccurredFrom:
      name: occurredFrom
      in: query
      required: false
      schema: { type: string, format: date-time }
    ActivityOccurredTo:
      name: occurredTo
      in: query
      required: false
      schema: { type: string, format: date-time }

    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    WorkItemUpdateId:
      name: updateId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    AttachmentCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1 }

    AttachmentPageSize:
      name: size
      in: query
      required: false
      schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    TemplateKey:
      name: templateKey
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProjectTemplateKey' }

    TemplateVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1

    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    ProductId:
      name: productId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    WorkItemLabelCode:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }

    RunId:
      name: runId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: 与当前 Session 绑定并由非 HttpOnly Cookie 回传的 CSRF 凭据。
      schema:
        type: string
        minLength: 1

    Page:
      name: page
      in: query
      required: false
      description: 页号，从 0 开始。
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      required: false
      description: 页容量，默认 20，最大 100。
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

    Cursor:
      name: cursor
      in: query
      required: false
      description: 追加流使用的不透明续读游标，不得按 offset 解释。
      schema:
        type: string
        minLength: 1

    FromDate:
      name: from
      in: query
      required: true
      description: 统计范围起始自然日，首尾包含。
      schema:
        $ref: '#/components/schemas/LocalDate'

    ToDate:
      name: to
      in: query
      required: true
      description: 统计范围结束自然日，首尾包含且范围最多 366 天。
      schema:
        $ref: '#/components/schemas/LocalDate'

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        单个强 ETag，格式为双引号包围的十进制 rowVersion。弱验证器、`*` 和多个
        ETag 均不属于一期契约。
      schema:
        type: string
        pattern: '^"[0-9]+"$'
      example: '"5"'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端为单一业务意图生成并在重试时复用的 UUID。
      schema:
        type: string
        format: uuid
        maxLength: 64

    ElectronClientType:
      name: X-Client-Type
      in: header
      required: true
      description: Electron 请求固定为 ELECTRON；该头不是认证凭据。
      schema:
        type: string
        enum:
          - ELECTRON

    ElectronClientVersion:
      name: X-Client-Version
      in: header
      required: true
      description: Electron 应用版本；该头不是认证凭据。
      schema:
        type: string
        minLength: 1
        maxLength: 64

    ElectronProtocolVersion:
      name: X-Client-Protocol-Version
      in: header
      required: true
      description: Electron 与服务端约定的协议版本；该头不是认证凭据。
      schema:
        type: string
        enum: ['1']

  headers:
    Location:
      description: 跳转目标 URI。
      schema:
        type: string
        format: uri-reference

    SetCookie:
      description: 一个或多个安全 Cookie；客户端必须按 HTTP 多值头语义处理。
      schema:
        type: string

    XRequestId:
      description: 请求关联标识；错误响应中必须与 body.requestId 完全一致。
      schema:
        $ref: '#/components/schemas/RequestId'

    ETag:
      description: 当前资源 rowVersion 对应的单个强 ETag。
      schema:
        type: string
        pattern: '^"[0-9]+"$'
      example: '"5"'

    RetryAfter:
      description: 允许再次尝试前应等待的秒数。
      schema:
        type: integer
        format: int32
        minimum: 1

  examples:
    MalformedRequest:
      summary: JSON、类型、参数或 If-Match 格式无法解析
      externalValue: ../examples/errors/400-malformed-request.json

    AuthenticationRequired:
      summary: 会话缺失、未知、过期、主动退出或登录回调统一失败
      externalValue: ../examples/errors/401-authentication-required.json

    AccountDisabled:
      summary: 可识别会话因离职或账号禁用被撤销
      externalValue: ../examples/errors/403-account-disabled.json

    AccessDenied:
      summary: 有效主体可见资源但没有动作权限
      externalValue: ../examples/errors/403-access-denied.json

    ResourceNotFound:
      summary: 资源不存在或存在性对当前主体不可见
      externalValue: ../examples/errors/404-resource-not-found.json

    IdempotencyKeyReused:
      summary: 相同幂等键被用于不同请求内容
      externalValue: ../examples/errors/409-idempotency-key-reused.json

    RequestInProgress:
      summary: 相同幂等请求仍在处理中
      externalValue: ../examples/errors/409-request-in-progress.json

    InvalidStateTransition:
      summary: 当前业务状态不允许目标命令
      externalValue: ../examples/errors/409-invalid-state-transition.json

    WorklogLocked:
      summary: 已提交或批准工时不能普通修改
      externalValue: ../examples/errors/409-worklog-locked.json

    VersionConflict:
      summary: If-Match 与当前可见资源版本不一致
      externalValue: ../examples/errors/412-version-conflict.json

    FileTooLarge:
      summary: 上传内容超过冻结的服务端字节上限
      externalValue: ../examples/errors/413-file-too-large.json

    FileTypeNotAllowed:
      summary: 文件名、声明类型或服务端识别类型不在允许策略内
      externalValue: ../examples/errors/415-file-type-not-allowed.json

    ValidationFailed:
      summary: 请求格式正确但字段或业务规则不满足
      externalValue: ../examples/errors/422-validation-failed.json

    ClientUpgradeRequired:
      summary: Electron 低于最低支持版本
      externalValue: ../examples/errors/426-client-upgrade-required.json

    PreconditionRequired:
      summary: 条件写入缺少 If-Match
      externalValue: ../examples/errors/428-precondition-required.json

    DependencyUnavailable:
      summary: 外部依赖暂时不可用，可在稍后重试
      externalValue: ../examples/errors/503-dependency-unavailable.json

    InternalError:
      summary: 高风险操作因审计不可写而失败关闭
      externalValue: ../examples/errors/500-internal-error.json

    EmptyPage:
      summary: 空的普通分页响应
      externalValue: ../examples/pagination/empty-page.json

    EmptyCursorPage:
      summary: 没有后续游标的空追加流响应
      externalValue: ../examples/pagination/empty-cursor-page.json

  responses:
    ProjectChanged:
      description: Project 已更新，或返回同一幂等命令的既有成功结果。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Project' }

    ProjectMemberChanged:
      description: Project membership 已更新，或返回同一幂等命令的既有成功结果。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProjectMember' }

    ProjectMemberCreated:
      description: Project membership 已创建。
      headers:
        Location: { $ref: '#/components/headers/Location' }
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProjectMember' }

    ProductChanged:
      description: Product 已更新，或返回同一幂等命令的既有成功结果。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Product' }

    WorkspaceChanged:
      description: Workspace 已更新，或返回同一幂等命令的既有成功结果。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Workspace' }

    ProjectTemplateChanged:
      description: 模板版本状态已改变，或返回同一幂等命令的既有成功结果。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProjectTemplateVersion' }

    RoleGranted:
      description: 角色授予成功。
      headers:
        Location: { $ref: '#/components/headers/Location' }
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RoleMutationResult' }

    RoleChanged:
      description: 角色撤销成功。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RoleMutationResult' }

    AccountChanged:
      description: 账号状态变更成功。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AccountStatusChangeResult' }

    InternalError:
      description: 系统错误或高风险操作因 Security Audit 不可写而失败关闭。
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            internalError: { $ref: '#/components/examples/InternalError' }

    MalformedRequest:
      description: 请求 JSON、类型、参数格式或条件头无法解析。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            malformedRequest:
              $ref: '#/components/examples/MalformedRequest'

    AuthenticationRequired:
      description: 未建立有效 CurrentActor。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            authenticationRequired:
              $ref: '#/components/examples/AuthenticationRequired'

    Forbidden:
      description: 可识别账号已禁用，或有效主体缺少可见资源上的动作权限。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            accountDisabled:
              $ref: '#/components/examples/AccountDisabled'
            accessDenied:
              $ref: '#/components/examples/AccessDenied'

    ResourceNotFound:
      description: 资源不存在，或资源存在性对当前主体不可见。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            resourceNotFound:
              $ref: '#/components/examples/ResourceNotFound'

    Conflict:
      description: 幂等、处理中、状态迁移或工时锁定冲突。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            idempotencyKeyReused:
              $ref: '#/components/examples/IdempotencyKeyReused'
            requestInProgress:
              $ref: '#/components/examples/RequestInProgress'
            invalidStateTransition:
              $ref: '#/components/examples/InvalidStateTransition'
            worklogLocked:
              $ref: '#/components/examples/WorklogLocked'

    VersionConflict:
      description: If-Match 与当前可见资源版本不一致。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            versionConflict:
              $ref: '#/components/examples/VersionConflict'

    FileTooLarge:
      description: 上传内容超过服务端允许的最大字节数。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            fileTooLarge:
              $ref: '#/components/examples/FileTooLarge'

    FileTypeNotAllowed:
      description: 文件扩展名、声明 MIME 或服务端内容识别结果不符合允许策略。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            fileTypeNotAllowed:
              $ref: '#/components/examples/FileTypeNotAllowed'

    ValidationFailed:
      description: 请求格式正确，但字段、必填项或业务规则不满足。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationFailed:
              $ref: '#/components/examples/ValidationFailed'

    ClientUpgradeRequired:
      description: Electron 客户端低于最低支持版本。
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            clientUpgradeRequired:
              $ref: '#/components/examples/ClientUpgradeRequired'

