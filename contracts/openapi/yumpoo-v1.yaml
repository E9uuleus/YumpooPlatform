            - PENDING_WORKLOG_APPROVALS
            - CURRENT_PROJECTS
        count:
          type: integer
          format: int64
          minimum: 0
    ErrorResponse:
      description: ApiErrorBase 的具体响应类型；details 默认为空，特定冲突可带稳定 reason。
      allOf:
        - $ref: "#/components/schemas/ApiErrorBase"
        - type: object
          required:
            - details
          properties:
            details:
              $ref: "#/components/schemas/EmptyErrorDetails"
    PageMetadata:
      type: object
      additionalProperties: false
      description: |
        普通分页的共享元数据约束。为兼容既定响应 JSON 形状，PageResponse 不增加
        metadata 包装层，而是在顶层平铺并重复声明这里的四个字段。
      required:
        - page
        - size
        - totalElements
        - totalPages
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
          description: 当前页号，从 0 开始。
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: 当前页容量；默认 20，硬上限 100。
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: 在权限过滤后可见的元素总数。
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: 在权限过滤后可见的总页数。
