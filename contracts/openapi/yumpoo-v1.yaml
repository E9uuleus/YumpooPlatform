  /projects/{projectId}/work-items:
    get:
      tags: [WorkItems]
      operationId: listProjectWorkItems
      summary: 分页查询 Project 下全部 Content 的真实 Work Item
      description: >-
        聚合 Project 内全部 Content 的非删除 Work Item。TABLE 复用白名单筛选与排序；
        KANBAN 必须指定单一 status，固定按更新时间倒序，不提供跨 Content rank。
      security: [{ sessionCookie: [] }]
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 25 }
        - name: view
          in: query
          description: TABLE 使用白名单排序；KANBAN 要求单一 status 且固定按 updatedAt 倒序。
          schema: { $ref: '#/components/schemas/ContentViewType' }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        - name: q
          in: query
          schema: { type: string }
        - name: priority
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items: { $ref: '#/components/schemas/WorkItemPriority' }
        - name: assigneeUserId
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items: { $ref: '#/components/schemas/Uuid' }
        - name: contentId
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items: { $ref: '#/components/schemas/Uuid' }
        - name: dueFrom
          in: query
          schema: { type: string, format: date }
        - name: dueTo
          in: query
          schema: { type: string, format: date }
        - name: updatedAfter
          in: query
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 3
            items:
              type: string
              pattern: '^(ITEM_NO|TITLE|STATUS|PRIORITY|ASSIGNEE|REPORTER|TIMELINE_START_DATE|TIMELINE_END_DATE|DUE_DATE|UPDATED_AT),(ASC|DESC)$'
      responses:
        '200':
          description: 已先按 Project 可见性与筛选条件裁剪，再稳定分页。
          headers: { Cache-Control: { schema: { type: string }, description: 固定为 no-store。 } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ProjectWorkItemCursorPage' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

