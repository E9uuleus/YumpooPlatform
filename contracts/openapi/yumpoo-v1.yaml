        - BUBBLE
        - DARK_PURPLE
        - BERRY
        - DARK_INDIGO
        - INDIGO
        - NAVY
        - BRIGHT_BLUE
        - AQUAMARINE
        - CHILI_BLUE
        - RIVER
        - WINTER
        - AMERICAN_GRAY
        - BLACKISH
        - BROWN
        - ORCHID
        - TAN
        - SKY
        - COFFEE
        - ROYAL
        - TEAL
        - LAVENDER
        - STEEL
        - LILAC
        - PECAN
        - GREEN
        - BLUE
        - PURPLE
        - MAGENTA
        - RED
        - ORANGE
        - AMBER
        - LIME
        - CYAN
        - GRAY
    WorkItemSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - contentId
        - itemNo
