      summary: 查询 Work Item 的直接子项
      description: 仅返回未删除的直接子项；未指定 sort 时按项目共享手工顺序返回。
      security:
        - sessionCookie: []
      parameters:
        - name: timeTrackingState
          in: query
          schema:
            $ref: "#/components/schemas/TimeTrackingState"
        - name: timeTrackingMinMs
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: timeTrackingMaxMs
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: parentWorkItemId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: sort
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 3
            items:
              type: string
              pattern: ^(TIME_TRACKING|CONTENT|ITEM_NO|TITLE|STATUS|PRIORITY|ASSIGNEE|REPORTER|TIMELINE_START_DATE|TIMELINE_END_DATE|DUE_DATE|UPDATED_AT),(ASC|DESC)$
      responses:
        "200":
          description: 当前调用人可见的直接子项。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemSubitemList"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
