      requestBody: { $ref: '#/components/requestBodies/GovernanceReason' }
      responses:
        '200': { $ref: '#/components/responses/ProjectTemplateChanged' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/project-templates/{templateKey}/versions/{version}/retire:
    post:
      tags: [ProjectTemplateAdministration]
      operationId: retireProjectTemplateVersion
      summary: 停用 PUBLISHED 模板版本
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TemplateKey'
        - $ref: '#/components/parameters/TemplateVersion'
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/GovernanceReason' }
      responses:
        '200': { $ref: '#/components/responses/ProjectTemplateChanged' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /attachments:
    post:
      tags: [Attachments]
      operationId: createAttachmentIntent
      summary: 创建附件上传意图
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentIntentCreateRequest' }
      responses:
        '201':
          description: 已创建上传意图。
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentIntentResult' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /attachments/{attachmentId}:
    get:
      tags: [Attachments]
      operationId: getAttachment
      summary: 查询附件实时元数据
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: 当前父对象权限下可见的附件元数据。
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentMetadata' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
    delete:
      tags: [Attachments]
      operationId: deleteAttachment
      summary: 逻辑删除一个可用附件
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentDeleteRequest' }
      responses:
        '200':
          description: 附件墓碑；同一幂等键可重放相同响应。
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentDeleteResult' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /attachments/{attachmentId}/content:
    get:
      tags: [Attachments]
      operationId: downloadAttachmentContent
      summary: 校验并流式下载一个可用附件
      description: 不支持 Range，也不返回永久 URL、存储路径或内容摘要响应头。
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: 64 KiB 有界缓冲的同源附件流。
          headers:
            Content-Disposition: { schema: { type: string } }
            Content-Length: { schema: { type: integer, format: int64, minimum: 1 } }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
            Cache-Control: { schema: { type: string, enum: ['private, no-store'] } }
            Content-Security-Policy: { schema: { type: string, enum: [sandbox] } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
    put:
      tags: [Attachments]
      operationId: uploadAttachmentContent
      summary: 流式写入一个附件内容
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '202':
          description: 内容已封存并排入安全扫描。
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentMetadata' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /work-items/{workItemId}/attachments:
    get:
      tags: [Attachments]
      operationId: listWorkItemAttachments
      summary: 分页查询 Work Item 附件
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/WorkItemId'
        - $ref: '#/components/parameters/AttachmentCursor'
        - $ref: '#/components/parameters/AttachmentPageSize'
      responses:
        '200':
          description: 附件页。
          content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentPage' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

  /work-item-updates/{updateId}/attachments:
    get:
      tags: [Attachments]
      operationId: listWorkItemUpdateAttachments
      summary: 分页查询已发布 Update 附件
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/WorkItemUpdateId'
        - $ref: '#/components/parameters/AttachmentCursor'
        - $ref: '#/components/parameters/AttachmentPageSize'
      responses:
        '200':
          description: 附件页。
          content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentPage' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

  /admin/attachments/{attachmentId}/rescan:
    post:
      tags: [Attachments]
      operationId: rescanAttachment
      summary: APP_MANAGER 受控重扫仍保留封存内容的附件
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentRescanRequest' }
      responses:
        '202':
          description: 已重新预约配额并排入完整扫描。
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AttachmentRescanResult' } } }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /projects/{projectId}/activity:
    get:
      tags: [Activity]
      operationId: listProjectActivity
      summary: 查询项目动态
      description: 仅返回 V44 切点后的白名单事实；每次请求按当前 Project 可见性重新鉴权。
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - $ref: '#/components/parameters/ActivityCursor'
        - $ref: '#/components/parameters/ActivitySize'
        - $ref: '#/components/parameters/ActivityEventType'
        - $ref: '#/components/parameters/ActivityEntityType'
        - $ref: '#/components/parameters/ActivityOccurredFrom'
        - $ref: '#/components/parameters/ActivityOccurredTo'
      responses:
        '200':
          description: 按 occurredAt、id 倒序的项目动态。
          headers: { Cache-Control: { schema: { type: string }, description: 固定为 no-store。 } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ActivityPage' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /work-items/{workItemId}/activity:
    get:
      tags: [Activity]
      operationId: listWorkItemActivity
      summary: 查询事项动态
      description: 软删除事项仍可在当前 Project 可见时读取历史；游标不可跨事项或筛选复用。
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: workItemId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - $ref: '#/components/parameters/ActivityCursor'
        - $ref: '#/components/parameters/ActivitySize'
        - $ref: '#/components/parameters/ActivityEventType'
        - $ref: '#/components/parameters/ActivityEntityType'
        - $ref: '#/components/parameters/ActivityOccurredFrom'
        - $ref: '#/components/parameters/ActivityOccurredTo'
      responses:
        '200':
          description: 按 occurredAt、id 倒序的事项动态。
          headers: { Cache-Control: { schema: { type: string }, description: 固定为 no-store。 } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ActivityPage' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /work-items/{workItemId}/cell-activity:
    get:
      tags: [Activity]
      operationId: listWorkItemCellActivity
      summary: 查询工作项单元格动态
      description: 仅返回专用投影切点后的字段白名单动态；游标绑定事项、全部筛选和首次请求时间锚点。
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: workItemId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - $ref: '#/components/parameters/ActivityCursor'
        - $ref: '#/components/parameters/ActivitySize'
        - name: timeRange
          in: query
          required: false
          schema: { $ref: '#/components/schemas/WorkItemCellActivityTimeRange' }
        - name: actorUserId
          in: query
          required: false
          style: form
          explode: true
          schema: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
        - name: column
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items: { $ref: '#/components/schemas/WorkItemCellActivityColumn' }
      responses:
        '200':
          description: 按 occurredAt、id 倒序的工作项单元格动态及完整投影统计。
          headers: { Cache-Control: { schema: { type: string }, description: 固定为 no-store。 } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemCellActivityPage' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-yumpoo-session
      description: 服务端签发的 HttpOnly、Secure、SameSite=Lax Web Session Cookie。

  schemas:
    ActivityAudienceType:
      type: string
      enum: [PROJECT, PRODUCT, FEEDBACK]

    ActivityActor:
      type: object
      additionalProperties: false
      required: [type, userId, displayName]
      properties:
        type: { type: string, enum: [USER, SYSTEM, ADMIN_OVERRIDE] }
        userId: { type: string, format: uuid, nullable: true }
        displayName: { type: string, minLength: 1, maxLength: 200 }

    ActivityItem:
      type: object
      additionalProperties: false
      required: [id, audienceType, sourceEventType, entityType, entityId, entityRef,
        relatedWorkItemIds, actor, occurredAt, templateCode, summary, safeParameters, requestId]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        audienceType: { $ref: '#/components/schemas/ActivityAudienceType' }
        sourceEventType: { type: string, minLength: 3, maxLength: 128 }
        entityType: { type: string, minLength: 2, maxLength: 32 }
        entityId: { $ref: '#/components/schemas/Uuid' }
        entityRef: { type: string, minLength: 1, maxLength: 320, nullable: true }
        relatedWorkItemIds:
          type: array
          maxItems: 2
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
        actor: { $ref: '#/components/schemas/ActivityActor' }
        occurredAt: { type: string, format: date-time }
        templateCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,95}$' }
        summary: { type: string, minLength: 1, maxLength: 500 }
        safeParameters:
          type: object
          additionalProperties: true
          description: 仅包含契约白名单内的安全展示参数。
        requestId: { type: string, minLength: 1, maxLength: 64 }

    ActivityPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, historyStartedAt]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ActivityItem' } }
        nextCursor: { type: string, minLength: 1, maxLength: 2048, nullable: true }
        historyStartedAt:
          type: string
          format: date-time
          description: Activity V1 投影开始接收事件的明确切点，更早历史未回填。

    WorkItemCellActivityColumn:
      type: string
      enum: [WORK_ITEM_NAME, ASSIGNEE, STATUS, PRIORITY, DUE_DATE, CONTENT]

    WorkItemCellActivityChangeType:
      type: string
      enum: [CREATED, ADDED, REMOVED, CHANGED]

    WorkItemCellActivityValueType:
      type: string
      enum: [TEXT, MEMBER, LABEL, DATE]

    WorkItemCellActivityTimeRange:
      type: string
      enum: [TODAY, YESTERDAY, THIS_WEEK, THIS_MONTH, THIS_YEAR]

    WorkItemCellActivityValue:
      type: object
      additionalProperties: false
      required: [type, referenceId, displayName, colorToken]
      properties:
        type: { $ref: '#/components/schemas/WorkItemCellActivityValueType' }
        referenceId: { type: string, nullable: true }
        displayName: { type: string, minLength: 1, maxLength: 300 }
        colorToken: { type: string, nullable: true }

    WorkItemCellActivityEntry:
      type: object
      additionalProperties: false
      required: [id, eventType, actor, occurredAt, column, changeType, beforeValue,
        afterValue, contentId, contentDisplayName]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        eventType: { type: string, minLength: 3, maxLength: 128 }
        actor: { $ref: '#/components/schemas/ActivityActor' }
        occurredAt: { type: string, format: date-time }
        column: { $ref: '#/components/schemas/WorkItemCellActivityColumn' }
        changeType: { $ref: '#/components/schemas/WorkItemCellActivityChangeType' }
        beforeValue:
          type: object
          allOf: [{ $ref: '#/components/schemas/WorkItemCellActivityValue' }]
          nullable: true
        afterValue:
          type: object
          allOf: [{ $ref: '#/components/schemas/WorkItemCellActivityValue' }]
          nullable: true
        contentId: { $ref: '#/components/schemas/Uuid' }
        contentDisplayName: { type: string, minLength: 1, maxLength: 80 }

    WorkItemCellActivityTimeRangeFacet:
      type: object
      additionalProperties: false
      required: [value, count, selected]
      properties:
        value: { $ref: '#/components/schemas/WorkItemCellActivityTimeRange' }
        count: { type: integer, format: int64, minimum: 0 }
        selected: { type: boolean }

    WorkItemCellActivityActorFacet:
      type: object
      additionalProperties: false
      required: [userId, displayName, count, selected]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        count: { type: integer, format: int64, minimum: 0 }
        selected: { type: boolean }

    WorkItemCellActivityColumnFacet:
      type: object
      additionalProperties: false
      required: [value, count, selected]
      properties:
        value: { $ref: '#/components/schemas/WorkItemCellActivityColumn' }
        count: { type: integer, format: int64, minimum: 0 }
        selected: { type: boolean }

    WorkItemCellActivityFacets:
      type: object
      additionalProperties: false
      required: [timeRanges, actors, columns]
      properties:
        timeRanges: { type: array, items: { $ref: '#/components/schemas/WorkItemCellActivityTimeRangeFacet' } }
        actors: { type: array, items: { $ref: '#/components/schemas/WorkItemCellActivityActorFacet' } }
        columns: { type: array, items: { $ref: '#/components/schemas/WorkItemCellActivityColumnFacet' } }

    WorkItemCellActivityPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, historyStartedAt, facets]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkItemCellActivityEntry' } }
        nextCursor: { type: string, minLength: 1, maxLength: 2048, nullable: true }
        historyStartedAt:
          type: string
          format: date-time
          description: 单元格动态专用投影开始接收事件的明确切点，更早历史未回填。
        facets: { $ref: '#/components/schemas/WorkItemCellActivityFacets' }

    Uuid:
      type: string
      format: uuid
      description: 不透明 UUID；客户端不得从值中推导业务语义。

    ManagedPlatformRole:
      type: string
      enum: [COMPANY_ADMIN, APP_MANAGER]

    RoleAssignmentStatus:
      type: string
      enum: [ACTIVE, REVOKED]

    EmploymentStatus:
      type: string
      enum: [ACTIVE, LEFT]

    AccountStatus:
      type: string
      enum: [ENABLED, DISABLED]

    WorkspaceStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]

    WorkspaceStatusFilter:
      type: string
      enum: [ACTIVE, ARCHIVED, ALL]

    Workspace:
      type: object
      additionalProperties: false
      required: [id, code, name, description, sortOrder, status, visibleProjectCount, rowVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 500, nullable: true }
        sortOrder: { type: integer, format: int32, minimum: 0 }
        status: { $ref: '#/components/schemas/WorkspaceStatus' }
        visibleProjectCount:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: 调用人可见的 DRAFT 与 ACTIVE Project 数量；管理员统计全公司，普通用户统计 ACTIVE membership。
        rowVersion: { type: integer, format: int64, minimum: 0, readOnly: true }

    WorkspaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Workspace' }

    WorkspaceCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name, sortOrder]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 500, nullable: true }
        sortOrder: { type: integer, format: int32, minimum: 0 }

    WorkspaceUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 500, nullable: true }
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          deprecated: true
          description: v1 兼容字段；MAIN 的 sortOrder 永远保持 0。

    ProductStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]

    ProductStatusFilter:
      type: string
      enum: [ACTIVE, ARCHIVED, ALL]

    Product:
      type: object
      additionalProperties: false
      required: [id, code, name, description, status, ownerUserId, rowVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500, nullable: true }
        status: { $ref: '#/components/schemas/ProductStatus' }
        ownerUserId: { $ref: '#/components/schemas/Uuid' }
        ownerDisplayName: { type: string, readOnly: true }
        rowVersion: { type: integer, format: int64, minimum: 0, readOnly: true }
        etag: { type: string, readOnly: true, pattern: '^"[0-9]+"$' }
        capabilities: { $ref: '#/components/schemas/ProductCapabilities' }

    ProductCapabilities:
      type: object
      additionalProperties: false
      required: [canUpdate, canArchive, canRestore, canOverrideArchive, canReassignOwner]
      properties:
        canUpdate: { type: boolean, readOnly: true }
        canArchive: { type: boolean, readOnly: true }
        canRestore: { type: boolean, readOnly: true }
        canOverrideArchive: { type: boolean, readOnly: true }
        canReassignOwner: { type: boolean, readOnly: true }

    ProductPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
