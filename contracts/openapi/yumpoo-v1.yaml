      summary: 按当前项目查询上下文分页取得筛选选项及动态计数
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: field
          in: query
          required: true
          schema: { type: string, enum: [TITLE, ASSIGNEE, STATUS, PRIORITY, CONTENT, DUE_DATE, UPDATED_AT] }
        - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 2048 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: q, in: query, schema: { type: string } }
        - name: status
          in: query
          style: form
          explode: true
          schema: { type: array, uniqueItems: true, items: { type: string } }
        - name: priority
          in: query
          style: form
          explode: true
          schema: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/WorkItemPriority' } }
        - name: assigneeUserId
          in: query
          style: form
          explode: true
          schema: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
        - name: contentId
          in: query
          style: form
          explode: true
          schema: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
        - { name: dueFrom, in: query, schema: { type: string, format: date } }
        - { name: dueTo, in: query, schema: { type: string, format: date } }
        - { name: updatedAfter, in: query, schema: { type: string, format: date-time } }
