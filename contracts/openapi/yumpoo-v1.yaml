        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /contents/{contentId}/work-items:
    get:
      tags: [WorkItems]
      operationId: listContentWorkItems
      summary: 分页查询 Content 的真实 Work Item
      description: >-
        所有条件显式传递；未传筛选和排序时保持事项序号倒序。status、priority、
        assigneeUserId 与 sort 可重复，sort 按出现顺序组成最多三层排序；Kanban
        按共享状态分组分别加载，并与其余筛选条件取交集。
      security: [{ sessionCookie: [] }]
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: page
          in: query
          schema: { type: integer, format: int32, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }
        - name: view
          in: query
          description: TABLE 保持白名单排序；KANBAN 要求单一 status 且固定按持久化 rank 排序。
          schema: { $ref: '#/components/schemas/ContentViewType' }
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        - name: q
          in: query
          schema: { type: string }
        - name: priority
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items: { $ref: '#/components/schemas/WorkItemPriority' }
        - name: assigneeUserId
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items: { $ref: '#/components/schemas/Uuid' }
        - name: dueFrom
          in: query
          schema: { type: string, format: date }
        - name: dueTo
          in: query
          schema: { type: string, format: date }
        - name: updatedAfter
          in: query
          schema: { type: string, format: date-time }
        - name: sort
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 3
            items:
              type: string
              pattern: '^(ITEM_NO|TITLE|STATUS|PRIORITY|ASSIGNEE|REPORTER|TIMELINE_START_DATE|TIMELINE_END_DATE|DUE_DATE|UPDATED_AT),(ASC|DESC)$'
      responses:
        '200':
          description: 已先按权限与筛选条件裁剪，再按白名单字段和 id 稳定分页。
          headers: { Cache-Control: { schema: { type: string }, description: 固定为 no-store。 } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemPage' } } }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [WorkItems]
      operationId: createWorkItem
      summary: 在 ACTIVE Content 中创建 Work Item
      description: Project、Content、type、报告人和模板初始状态均由服务端派生；处理人必须是 ACTIVE Project 成员。
      security: [{ sessionCookie: [] }]
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemCreateRequest' } } }
      responses:
        '201':
          description: Work Item 已创建或幂等重放。
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkItemDetail' } } }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

