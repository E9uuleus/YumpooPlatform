  /auth/wecom/authorize:
    get:
      tags:
        - Authentication
      operationId: authorizeWeComLogin
      summary: 发起企微 Web 登录
      description: 创建一次性 OAuth state/nonce，并跳转到当前启用的身份提供者。
      security: []
      parameters:
        - name: remember
          in: query
          required: false
          description: 「7 天内免登录」。缺省按 true；false 时会话闲置 8 小时失效，Session/CSRF Cookie 不带 Max-Age。
          schema:
            type: boolean
            default: true
      responses:
        "302":
          description: 跳转到身份提供者，并设置 HttpOnly nonce 与免登录选择 Cookie。
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /auth/wecom/callback:
    get:
      tags:
        - Authentication
      operationId: completeWeComLogin
      summary: 完成企微 Web 登录
      description: |
        原子消费 OAuth attempt，解析已同步的企微身份并按发起时的免登录选择签发 Web Session。
        成功固定跳转到 `/`；无论成功失败均清除 nonce 与免登录选择 Cookie。
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: state
          in: query
          required: false
          schema:
            type: string
            minLength: 43
            maxLength: 43
            pattern: ^[A-Za-z0-9_-]{43}$
      responses:
        "302":
          description: 登录成功，签发 Session/CSRF Cookie 并固定跳转到 `/`。
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /electron/auth/attempts:
    post:
      tags:
        - Authentication
      operationId: createElectronAuthAttempt
      summary: 创建 Electron 系统浏览器登录请求
      description: 绑定 Electron state、PKCE S256 challenge 与客户端版本并返回企微官方扫码地址。
