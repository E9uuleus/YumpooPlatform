      properties:
        field:
          type: string
          minLength: 1
          description: 出错字段的稳定请求字段名。
        code:
          type: string
          minLength: 1
          description: 字段级稳定错误码。
        message:
          type: string
          minLength: 1
          description: 面向当前用户且不包含内部实现信息的说明。
    ApiErrorBase:
      type: object
      additionalProperties: false
      required:
