        reason:
          type: string
          minLength: 1
          maxLength: 160

    GovernanceState:
      type: object
      additionalProperties: false
      required: [userId, displayName, employmentStatus, accountStatus, platformRoles, authorizationVersion, rowVersion]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string, minLength: 1 }
        employmentStatus: { $ref: '#/components/schemas/EmploymentStatus' }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        platformRoles:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ManagedPlatformRole' }
        authorizationVersion: { type: integer, format: int64, minimum: 0 }
        rowVersion: { type: integer, format: int64, minimum: 0 }

    RoleAssignment:
      type: object
      additionalProperties: false
      required: [assignmentId, userId, role, scopeType, scopeId, status, grantedAt, revokedAt, rowVersion, etag]
      properties:
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        role: { $ref: '#/components/schemas/ManagedPlatformRole' }
        scopeType: { type: string, enum: [COMPANY, PLATFORM] }
        scopeId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/RoleAssignmentStatus' }
        grantedAt: { $ref: '#/components/schemas/Instant' }
        revokedAt:
          type: string
          format: date-time
          nullable: true
        rowVersion: { type: integer, format: int64, minimum: 0 }
        etag: { type: string, pattern: '^"[0-9]+"$' }

    RoleAssignmentPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RoleAssignment' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    RoleMutationResult:
      type: object
      additionalProperties: false
      required: [assignmentId, companyId, userId, role, status, assignmentRowVersion, userRowVersion, authorizationVersion, changedAt]
      properties:
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        companyId: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        role: { $ref: '#/components/schemas/ManagedPlatformRole' }
        status: { $ref: '#/components/schemas/RoleAssignmentStatus' }
        assignmentRowVersion: { type: integer, format: int64, minimum: 0 }
        userRowVersion: { type: integer, format: int64, minimum: 0 }
        authorizationVersion: { type: integer, format: int64, minimum: 0 }
        changedAt: { $ref: '#/components/schemas/Instant' }

    AccountStatusChangeResult:
      type: object
      additionalProperties: false
      required: [userId, employmentStatus, accountStatus, authorizationVersion, rowVersion]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        employmentStatus: { $ref: '#/components/schemas/EmploymentStatus' }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        authorizationVersion: { type: integer, format: int64, minimum: 0 }
        rowVersion: { type: integer, format: int64, minimum: 0 }

    Instant:
      type: string
      format: date-time
      description: RFC 3339 UTC 时刻。
      example: '2026-08-09T09:30:00.123Z'

    LocalDate:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: 不携带时区或零点时刻的自然日，格式为 YYYY-MM-DD。
      example: '2026-08-09'

    AuthenticationRole:
      type: string
      enum:
        - COMPANY_MEMBER
        - COMPANY_ADMIN
        - APP_MANAGER

    AuthenticationClientType:
      type: string
      enum:
        - WEB
        - ELECTRON

    OpaqueDesktopToken:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'

    ElectronAuthAttemptRequest:
      type: object
      additionalProperties: false
      required: [state, codeChallenge, codeChallengeMethod]
      properties:
        state: { $ref: '#/components/schemas/OpaqueDesktopToken' }
        codeChallenge:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        codeChallengeMethod:
          type: string
          enum: [S256]

    ElectronAuthAttemptResponse:
      type: object
      additionalProperties: false
      required: [authorizationUrl, expiresAt]
      properties:
        authorizationUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    ElectronAuthExchangeRequest:
      type: object
      additionalProperties: false
      required: [state, handoffCode, codeVerifier]
      properties:
        state: { $ref: '#/components/schemas/OpaqueDesktopToken' }
        handoffCode: { $ref: '#/components/schemas/OpaqueDesktopToken' }
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]{43,128}$'

    ElectronAuthExchangeResponse:
      type: object
      additionalProperties: false
      required: [sessionCredential, csrfCredential, absoluteExpiresAt]
      properties:
        sessionCredential: { type: string, minLength: 43, maxLength: 256, writeOnly: true }
        csrfCredential: { type: string, minLength: 43, maxLength: 256, writeOnly: true }
        absoluteExpiresAt: { type: string, format: date-time }

    ClientCompatibility:
      type: string
      enum:
        - SUPPORTED
        - DEPRECATED
        - BLOCKED

    CurrentAuthenticationUser:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
          minLength: 1

    CurrentAuthenticationCompany:
      type: object
      additionalProperties: false
      required: [id, displayName, timezone, weekStartDay]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
          minLength: 1
        timezone:
          type: string
          minLength: 1
          description: IANA 时区标识。
          example: Asia/Shanghai
        weekStartDay:
          type: string
          enum: [MONDAY]

    CurrentAuthenticationClient:
      type: object
      additionalProperties: false
      required: [type, compatibility]
      properties:
        type:
          $ref: '#/components/schemas/AuthenticationClientType'
        compatibility:
          $ref: '#/components/schemas/ClientCompatibility'

    CurrentAuthentication:
      type: object
      additionalProperties: false
      required: [user, company, roles, client]
      properties:
        user:
          $ref: '#/components/schemas/CurrentAuthenticationUser'
        company:
          $ref: '#/components/schemas/CurrentAuthenticationCompany'
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthenticationRole'
        client:
          $ref: '#/components/schemas/CurrentAuthenticationClient'

    RequestId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
      description: 服务端生成或从可信反向代理接收的不透明请求关联标识。

    ErrorCode:
      type: string
      description: |
        一期冻结的公共错误码。客户端只能使用 code 做程序判断，不能解析 message。
      enum:
        - MALFORMED_REQUEST
        - AUTHENTICATION_REQUIRED
        - ACCOUNT_DISABLED
        - ACCESS_DENIED
        - RESOURCE_NOT_FOUND
        - IDEMPOTENCY_KEY_REUSED
        - REQUEST_IN_PROGRESS
        - INVALID_STATE_TRANSITION
        - WORKLOG_LOCKED
        - VERSION_CONFLICT
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_ALLOWED
        - VALIDATION_FAILED
        - CLIENT_UPGRADE_REQUIRED
        - PRECONDITION_REQUIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE

    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          minLength: 1
          description: 出错字段的稳定请求字段名。
        code:
          type: string
          minLength: 1
          description: 字段级稳定错误码。
        message:
          type: string
          minLength: 1
          description: 面向当前用户且不包含内部实现信息的说明。

    ApiErrorBase:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
        - retryable
        - fieldErrors
        - details
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          description: 面向当前用户的安全错误说明。
        requestId:
          $ref: '#/components/schemas/RequestId'
        retryable:
          type: boolean
          description: 当前请求是否可在不改变业务意图的前提下自动重试。
        fieldErrors:
          type: array
          description: 字段级错误；非字段校验错误固定为空数组。
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          type: object
          description: 错误专用详情；具体响应 schema 必须进一步收窄。

    EmptyErrorDetails:
      type: object
      additionalProperties: false
      description: |
        通用错误详情默认为空；需要稳定机器可读原因的业务冲突可返回 reason。
      properties:
        reason:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
          description: M2-08 生命周期治理稳定原因；其他业务域可继续使用各自稳定原因。
          x-stable-values:
            - PROJECT_ARCHIVE_BLOCKED
            - WORKSPACE_ARCHIVE_BLOCKED
            - WORKSPACE_UNCHANGED
        blockers:
          type: array
          description: 仅包含稳定分类 code 与非负聚合 count，不含对象标识或业务正文。
          items: { $ref: '#/components/schemas/SafeBlocker' }

    SafeBlocker:
      type: object
      additionalProperties: false
      required: [code, count]
      properties:
        code:
          type: string
          enum: [OPEN_WORK_ITEMS, PENDING_WORKLOG_APPROVALS, OPEN_PRODUCT_FEEDBACK, CURRENT_PROJECTS]
        count: { type: integer, format: int64, minimum: 0 }

    ErrorResponse:
      description: ApiErrorBase 的具体响应类型；details 默认为空，特定冲突可带稳定 reason。
      allOf:
        - $ref: '#/components/schemas/ApiErrorBase'
        - type: object
          required:
            - details
          properties:
            details:
              $ref: '#/components/schemas/EmptyErrorDetails'

    PageMetadata:
      type: object
      additionalProperties: false
      description: |
        普通分页的共享元数据约束。为兼容既定响应 JSON 形状，PageResponse 不增加
        metadata 包装层，而是在顶层平铺并重复声明这里的四个字段。
      required:
        - page
        - size
        - totalElements
        - totalPages
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
          description: 当前页号，从 0 开始。
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: 当前页容量；默认 20，硬上限 100。
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: 在权限过滤后可见的元素总数。
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: 在权限过滤后可见的总页数。

    CursorPageMetadata:
      type: object
      additionalProperties: false
      description: |
        cursor 分页的共享元数据约束。为兼容既定响应 JSON 形状，CursorPageResponse
        不增加 metadata 包装层，而是在顶层平铺并重复声明 nextCursor。
      required:
        - nextCursor
      properties:
        nextCursor:
          type: string
          minLength: 1
          nullable: true
          description: 不透明续读游标；没有下一批时为 null。

    PageResponse:
      type: object
      additionalProperties: false
      description: |
        固定扁平普通分页响应；page、size、totalElements、totalPages 与 PageMetadata
        保持同一约束，不引入 metadata 包装对象。
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          description: 当前页资源 DTO；具体 operation 必须收窄 item schema。
          items:
            type: object
            additionalProperties: true
        page:
          type: integer
          format: int32
          minimum: 0
          description: 当前页号，从 0 开始。
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: 当前页容量；默认 20，硬上限 100。
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: 在权限过滤后可见的元素总数。
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: 在权限过滤后可见的总页数。

    CursorPageResponse:
      type: object
      additionalProperties: false
      description: |
        固定扁平 cursor 分页响应；nextCursor 与 CursorPageMetadata 保持同一约束，
        不引入 metadata 包装对象。
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          description: 当前批次资源 DTO；具体 operation 必须收窄 item schema。
          items:
            type: object
            additionalProperties: true
        nextCursor:
          type: string
          minLength: 1
          nullable: true
          description: 不透明续读游标；没有下一批时为 null。

  requestBodies:
    GovernanceReason:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GovernanceReasonRequest' }

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    TemplateKey:
      name: templateKey
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProjectTemplateKey' }

    TemplateVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1

    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    ProductId:
      name: productId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    RunId:
      name: runId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: 与当前 Session 绑定并由非 HttpOnly Cookie 回传的 CSRF 凭据。
      schema:
        type: string
        minLength: 1

    Page:
      name: page
      in: query
      required: false
      description: 页号，从 0 开始。
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      required: false
      description: 页容量，默认 20，最大 100。
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

    Cursor:
      name: cursor
      in: query
      required: false
      description: 追加流使用的不透明续读游标，不得按 offset 解释。
      schema:
        type: string
        minLength: 1

    FromDate:
      name: from
      in: query
      required: true
      description: 统计范围起始自然日，首尾包含。
      schema:
        $ref: '#/components/schemas/LocalDate'

    ToDate:
      name: to
      in: query
      required: true
      description: 统计范围结束自然日，首尾包含且范围最多 366 天。
      schema:
        $ref: '#/components/schemas/LocalDate'

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        单个强 ETag，格式为双引号包围的十进制 rowVersion。弱验证器、`*` 和多个
        ETag 均不属于一期契约。
      schema:
        type: string
        pattern: '^"[0-9]+"$'
      example: '"5"'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端为单一业务意图生成并在重试时复用的 UUID。
      schema:
        type: string
        format: uuid
        maxLength: 64

    ElectronClientType:
      name: X-Client-Type
      in: header
      required: true
      description: Electron 请求固定为 ELECTRON；该头不是认证凭据。
      schema:
        type: string
        enum:
          - ELECTRON

    ElectronClientVersion:
      name: X-Client-Version
      in: header
      required: true
      description: Electron 应用版本；该头不是认证凭据。
      schema:
        type: string
        minLength: 1
        maxLength: 64

    ElectronProtocolVersion:
      name: X-Client-Protocol-Version
      in: header
      required: true
      description: Electron 与服务端约定的协议版本；该头不是认证凭据。
      schema:
        type: string
        enum: ['1']

  headers:
    Location:
      description: 跳转目标 URI。
      schema:
        type: string
        format: uri-reference

    SetCookie:
      description: 一个或多个安全 Cookie；客户端必须按 HTTP 多值头语义处理。
      schema:
        type: string

    XRequestId:
      description: 请求关联标识；错误响应中必须与 body.requestId 完全一致。
      schema:
        $ref: '#/components/schemas/RequestId'

    ETag:
      description: 当前资源 rowVersion 对应的单个强 ETag。
      schema:
        type: string
        pattern: '^"[0-9]+"$'
      example: '"5"'

    RetryAfter:
      description: 允许再次尝试前应等待的秒数。
      schema:
        type: integer
        format: int32
        minimum: 1

  examples:
    MalformedRequest:
      summary: JSON、类型、参数或 If-Match 格式无法解析
      externalValue: ../examples/errors/400-malformed-request.json

    AuthenticationRequired:
      summary: 会话缺失、未知、过期、主动退出或登录回调统一失败
      externalValue: ../examples/errors/401-authentication-required.json

    AccountDisabled:
      summary: 可识别会话因离职或账号禁用被撤销
      externalValue: ../examples/errors/403-account-disabled.json

    AccessDenied:
      summary: 有效主体可见资源但没有动作权限
      externalValue: ../examples/errors/403-access-denied.json

    ResourceNotFound:
      summary: 资源不存在或存在性对当前主体不可见
      externalValue: ../examples/errors/404-resource-not-found.json

    IdempotencyKeyReused:
      summary: 相同幂等键被用于不同请求内容
      externalValue: ../examples/errors/409-idempotency-key-reused.json

    RequestInProgress:
      summary: 相同幂等请求仍在处理中
      externalValue: ../examples/errors/409-request-in-progress.json

    InvalidStateTransition:
      summary: 当前业务状态不允许目标命令
      externalValue: ../examples/errors/409-invalid-state-transition.json

    WorklogLocked:
      summary: 已提交或批准工时不能普通修改
      externalValue: ../examples/errors/409-worklog-locked.json

    VersionConflict:
      summary: If-Match 与当前可见资源版本不一致
      externalValue: ../examples/errors/412-version-conflict.json

    FileTooLarge:
      summary: 上传内容超过冻结的服务端字节上限
      externalValue: ../examples/errors/413-file-too-large.json

    FileTypeNotAllowed:
      summary: 文件名、声明类型或服务端识别类型不在允许策略内
      externalValue: ../examples/errors/415-file-type-not-allowed.json

    ValidationFailed:
      summary: 请求格式正确但字段或业务规则不满足
      externalValue: ../examples/errors/422-validation-failed.json

    ClientUpgradeRequired:
      summary: Electron 低于最低支持版本
      externalValue: ../examples/errors/426-client-upgrade-required.json

    PreconditionRequired:
      summary: 条件写入缺少 If-Match
      externalValue: ../examples/errors/428-precondition-required.json

    DependencyUnavailable:
      summary: 外部依赖暂时不可用，可在稍后重试
      externalValue: ../examples/errors/503-dependency-unavailable.json

    InternalError:
      summary: 高风险操作因审计不可写而失败关闭
      externalValue: ../examples/errors/500-internal-error.json

    EmptyPage:
      summary: 空的普通分页响应
      externalValue: ../examples/pagination/empty-page.json

    EmptyCursorPage:
      summary: 没有后续游标的空追加流响应
      externalValue: ../examples/pagination/empty-cursor-page.json

  responses:
    ProjectChanged:
      description: Project 已更新，或返回同一幂等命令的既有成功结果。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Project' }

    ProjectMemberChanged:
      description: Project membership 已更新，或返回同一幂等命令的既有成功结果。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProjectMember' }

    ProjectMemberCreated:
      description: Project membership 已创建。
      headers:
        Location: { $ref: '#/components/headers/Location' }
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProjectMember' }

    ProductChanged:
      description: Product 已更新，或返回同一幂等命令的既有成功结果。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Product' }

    WorkspaceChanged:
      description: Workspace 已更新，或返回同一幂等命令的既有成功结果。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Workspace' }

    ProjectTemplateChanged:
      description: 模板版本状态已改变，或返回同一幂等命令的既有成功结果。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProjectTemplateVersion' }

    RoleGranted:
      description: 角色授予成功。
      headers:
        Location: { $ref: '#/components/headers/Location' }
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RoleMutationResult' }

    RoleChanged:
      description: 角色撤销成功。
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RoleMutationResult' }

    AccountChanged:
      description: 账号状态变更成功。
      headers:
