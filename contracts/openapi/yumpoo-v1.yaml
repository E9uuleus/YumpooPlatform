    get:
      tags:
        - TimeTracking
      operationId: listTimerCandidates
      summary: 跨项目查找本人可计时的工作项
      description: 在当前公司有效成员且未归档的项目中查询。PERSONAL 包含分配给本人和本人最近计时或手动补录过的工作项；ALL 包含全部可计时工作项。按最近计时、本人分配、更新时间排序，每项只出现一次，查询名称、编号或项目名。启动时仍重新验证写权限。projectId、assignedToMe、excludeCompleted 在服务端分页之前生效；首段响应附带不受 projectId 限制的项目计数。
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - PERSONAL
              - ALL
            default: PERSONAL
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - name: projectId
          in: query
          style: form
          explode: true
          description: 只返回这些项目中的候选；不在本人可计时项目内的 ID 会被忽略。
          schema:
            type: array
            maxItems: 20
            items:
              type: string
              format: uuid
        - name: assignedToMe
          in: query
          schema:
            type: boolean
            default: false
        - name: excludeCompleted
          in: query
          description: 按本人对各项目的完成定义排除已完成的工作项。
          schema:
            type: boolean
            default: false
      responses:
