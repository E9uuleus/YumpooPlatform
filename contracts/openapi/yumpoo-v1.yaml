      operationId: getMyWorkItemTableSettings
      summary: 查询本人在项目中的工作项表格设置
      description: 项目对当前账号可见即可读取；从未保存时返回默认值、updatedAt 为 null、etag 为 "0"。只影响本人的表格展示与新建默认值。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 本人工作项表格设置。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemTableSettings"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
    put:
      tags:
        - WorkItems
      operationId: updateMyWorkItemTableSettings
      summary: 整体替换本人在项目中的工作项表格设置
      description: 要求会话、XSRF 和最近读取的 If-Match。ETag 由 updatedAt 的微秒时间戳生成，保存以原子比较更新防止覆盖其他窗口或设备的修改；版本过期返回 412。不校验规则与默认值引用的成员、标签或类别是否仍有效，客户端使用时忽略失效值。grouping 与 completedStatusCodes 省略或为 null 时保留原值，其余字段整体替换。
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/XsrfToken"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkItemTableSettingsUpdateRequest"
      responses:
        "200":
          description: 保存后的本人工作项表格设置。
          headers:
            Cache-Control:
              schema:
                type: string
              description: 固定为 no-store。
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemTableSettings"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  /projects/{projectId}/work-items:
    get:
      tags:
        - WorkItems
      operationId: listProjectWorkItems
      summary: 分页查询 Project 下全部工作项
      description: 聚合 Project 内全部类别的非删除工作项。TABLE 复用白名单筛选与排序； KANBAN 必须指定单一 status，并使用项目级状态泳道 rank。
      security:
        - sessionCookie: []
      parameters:
        - name: assigneeSetUserId
          in: query
          description: 精确匹配处理人集合，与其他筛选取交集并绑定游标；空集合使用 emptyField=ASSIGNEE。
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            maxItems: 20
            items:
              type: string
              format: uuid
        - name: connectedColumnIds
          in: query
          description: 所选每个本项目有效连接列均至少有一条可读连接。 参与计数与游标，不提供连接排序或分组。
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            maxItems: 20
            items:
              $ref: "#/components/schemas/Uuid"
        - name: unconnectedColumnIds
          in: query
          description: 所选每个本项目有效连接列均没有可读连接；不存在或其他项目的列不匹配。 参与计数与游标，不提供连接排序或分组。
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            maxItems: 20
            items:
              $ref: "#/components/schemas/Uuid"
        - name: incomingProjectIds
          in: query
          description: 至少有一条来自所选任一项目的有效入站连接。 参与计数与游标，不提供连接排序或分组。
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            maxItems: 20
            items:
              $ref: "#/components/schemas/Uuid"
        - name: projectId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: timeTrackingState
          in: query
          schema:
            $ref: "#/components/schemas/TimeTrackingState"
        - name: timeTrackingMinMs
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: timeTrackingMaxMs
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 25
        - name: view
          in: query
          description: TABLE 使用白名单排序；KANBAN 要求单一 status 且固定按项目级状态泳道 rank 排序。
          schema:
            $ref: "#/components/schemas/WorkItemViewType"
        - name: emptyField
          in: query
          description: 仅返回指定字段为空的工作项，与其他筛选条件取交集；游标绑定该条件。
          schema:
            type: string
            enum:
              - ASSIGNEE
              - PRIORITY
              - DUE_DATE
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              type: string
              pattern: ^[A-Z][A-Z0-9_]{1,31}$
        - name: q
          in: query
          schema:
            type: string
        - name: priority
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/WorkItemPriority"
        - name: assigneeUserId
          description: 任一所选成员是处理人即匹配。
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/Uuid"
        - name: contentId
          in: query
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: "#/components/schemas/Uuid"
        - name: dueFrom
          in: query
          schema:
            type: string
            format: date
        - name: dueTo
          in: query
          schema:
            type: string
            format: date
        - name: updatedAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 3
            items:
              type: string
              pattern: ^(TIME_TRACKING|CONTENT|ITEM_NO|TITLE|STATUS|PRIORITY|ASSIGNEE|REPORTER|TIMELINE_START_DATE|TIMELINE_END_DATE|DUE_DATE|UPDATED_AT),(ASC|DESC)$
      responses:
        "200":
          description: 已先按 Project 可见性与筛选条件裁剪，再稳定分页。
