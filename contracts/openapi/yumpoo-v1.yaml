          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GovernanceTargetType"
        - name: targetId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - name: result
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GovernanceOverrideResult"
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Company 隔离的稳定倒序分页。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceOverridePage"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-yumpoo-session
      description: 服务端签发的 HttpOnly、Secure、SameSite=Lax Web Session Cookie。
  schemas:
    ConnectionCardLabel:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - colorToken
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 80
        colorToken:
          $ref: "#/components/schemas/WorkItemLabelColorToken"
    ConnectCandidateParent:
      type: object
      additionalProperties: false
      required:
        - workItemId
        - title
      properties:
        workItemId:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
          minLength: 1
          maxLength: 300
    PlatformRoleTier:
      type: string
      enum:
        - COMPANY_MEMBER
        - COMPANY_ADMIN
        - APP_MANAGER
    DashboardChartMeasure:
      type: object
      required:
        - metric
        - calculation
      properties:
        metric:
          type: string
          enum:
            - TOTAL
            - IN_PROGRESS
            - DONE
            - COMPLETION_RATE
            - DURATION
        calculation:
          type: string
          enum:
            - SUM
            - AVG
            - MEDIAN
            - MIN
            - MAX
    DashboardChartLabel:
      type: object
      required:
        - key
        - name
        - color
        - order
      properties:
        key:
          type: string
          maxLength: 2000
        name:
          type: string
          maxLength: 80
        color:
          type: string
          pattern: ^$|^#[a-fA-F0-9]{6}$
        order:
          type: integer
          format: int64
          minimum: 0
          maximum: 5000
    DashboardChart:
      type: object
      required:
        - type
        - dimension
        - series
        - dateInterval
        - timezone
        - measure
        - stacked
        - showLegend
        - showValues
        - valueFormat
        - sort
        - limit
        - showEmpty
        - labels
        - detailColumns
      properties:
        type:
          type: string
          enum:
            - NUMBER
            - COLUMN
            - BAR
            - LINE
            - AREA
            - PIE
            - DONUT
            - BUBBLE
        dimension:
          type: string
          enum:
            - NONE
            - PROJECT
            - CONTENT
            - STATUS
            - CATEGORY
            - PRIORITY
            - ASSIGNEE
            - REPORTER
            - CREATED
            - UPDATED
            - COMPLETED
            - DUE
            - TIMELINE_START
            - TIMELINE_END
        series:
          type: string
          enum:
            - NONE
            - PROJECT
            - CONTENT
            - STATUS
            - CATEGORY
            - PRIORITY
            - ASSIGNEE
            - REPORTER
            - CREATED
            - UPDATED
            - COMPLETED
            - DUE
            - TIMELINE_START
            - TIMELINE_END
        dateInterval:
          type: string
          enum:
            - DAY
            - WEEK
            - MONTH
        timezone:
          type: string
        measure:
          $ref: "#/components/schemas/DashboardChartMeasure"
        xMeasure:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DashboardChartMeasure"
        sizeMeasure:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DashboardChartMeasure"
        stacked:
          type: boolean
        showLegend:
          type: boolean
        showValues:
          type: boolean
        valueFormat:
          type: string
          enum:
            - VALUE
            - PERCENT
        sort:
          type: string
          enum:
            - VALUE_ASC
            - VALUE_DESC
            - NAME_ASC
            - NAME_DESC
            - CUSTOM
        limit:
          type: integer
          format: int64
          minimum: 0
          maximum: 5000
        showEmpty:
          type: boolean
        projectIds:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          maxItems: 100
        filters:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DashboardFilters"
        labels:
          type: array
          items:
            $ref: "#/components/schemas/DashboardChartLabel"
          maxItems: 500
        detailColumns:
          type: array
          items:
            type: string
            enum:
              - project
              - content
              - assignee
              - reporter
              - status
              - priority
              - duration
              - due
              - timeline
              - created
              - updated
              - completed
    DashboardChartSelection:
      type: object
      required: []
      properties:
        key:
          type: string
          nullable: true
          maxLength: 2000
        seriesKey:
          type: string
          nullable: true
          maxLength: 2000
    DashboardChartPoint:
      type: object
      required:
        - key
        - label
        - colorToken
        - seriesKey
        - seriesLabel
        - seriesColorToken
        - count
        - value
        - xValue
        - sizeValue
      properties:
        key:
          type: string
        label:
          type: string
        colorToken:
          type: string
        seriesKey:
          type: string
        seriesLabel:
          type: string
        seriesColorToken:
          type: string
        count:
          type: integer
          format: int64
          minimum: 0
        value:
          type: number
          format: double
        xValue:
          type: number
          format: double
        sizeValue:
          type: number
          format: double
        categoryValue:
          type: number
          format: double
          description: 按分类独立计算的数值，用于系列拆分时排序，不累加平均值、中位数或完成率。
    DashboardChartResult:
      type: object
      required:
        - id
        - points
      properties:
        id:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/DashboardChartPoint"
    DashboardPosition:
      type: object
      required:
        - x
        - y
        - w
        - h
      properties:
        x: &a21
          type: integer
          format: int64
          minimum: 0
        y: *a21
        w:
          type: integer
          format: int64
          minimum: 1
        h:
          type: integer
          format: int64
          minimum: 1
    DashboardWidget:
      type: object
      required:
        - id
        - kind
        - title
        - metric
        - grouping
        - sort
        - showLegend
        - showValues
        - wide
        - medium
      properties:
        id: &a23
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - METRIC
            - STATUS
            - PROJECT_WORKLOAD
            - MEMBER_WORKLOAD
            - PROJECT_TIME
            - CHART
        title:
          type: string
          minLength: 1
          maxLength: 80
        metric:
          type: string
          enum:
            - TOTAL
            - IN_PROGRESS
            - DONE
            - COMPLETION_RATE
            - DURATION
        grouping:
          type: string
          enum:
            - STATUS
            - CATEGORY
        sort:
          type: string
          enum:
            - ASC
            - DESC
        showLegend: &a22
          type: boolean
        showValues: *a22
        wide:
          $ref: "#/components/schemas/DashboardPosition"
        medium:
          $ref: "#/components/schemas/DashboardPosition"
        chart:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DashboardChart"
    DashboardFilters:
      type: object
      required:
        - projectIds
        - assignees
        - statuses
        - priorities
        - contentIds
        - categories
        - dueFrom
        - dueTo
        - includeArchived
        - query
        - hasTime
      properties:
        projectIds:
          type: array
          items: *a23
        assignees:
          type: array
          items: &a24
            type: string
        statuses:
          type: array
          items: *a24
        priorities:
          type: array
          items: *a24
        contentIds:
          type: array
          items: *a23
        categories:
          type: array
          items: *a24
        dueFrom:
          type: string
          format: date
          nullable: true
        dueTo:
          type: string
          format: date
          nullable: true
        includeArchived: *a22
        query:
          type: string
          maxLength: 200
        hasTime: *a22
    DashboardTableQuery:
      type: object
      required:
        - widget
        - projectId
        - table
      properties:
        filters:
          $ref: "#/components/schemas/DashboardFilters"
        widget:
          $ref: "#/components/schemas/DashboardWidget"
        selection:
          $ref: "#/components/schemas/DashboardChartSelection"
        projectId:
          type: string
          format: uuid
        table:
          $ref: "#/components/schemas/DashboardTableCriteria"
    DashboardTableCriteria:
      type: object
      description: 复用项目工作项查询语义；图表条件与表格条件取交集，field 查询分组选项，parentWorkItemId 查询匹配子项。主表保留命中子项的父项作为上下文。
      properties:
        q:
          type: string
          maxLength: 200
        status:
          type: array
          items:
            type: string
        priority:
          type: array
          items:
            type: string
        assigneeUserId:
          type: array
          items:
            type: string
            format: uuid
        assigneeSetUserId:
          type: array
          uniqueItems: true
          maxItems: 20
          items:
            type: string
            format: uuid
        contentId:
          type: array
          items:
            type: string
            format: uuid
        dueFrom:
          type: string
          format: date
        dueTo:
          type: string
          format: date
        updatedAfter:
          type: string
          format: date-time
        sort:
          type: array
          maxItems: 3
          items:
            type: string
        timeTrackingState:
          type: string
          enum:
            - RUNNING
            - STOPPED
            - EMPTY
        timeTrackingMinMs:
          type: integer
          format: int64
          minimum: 0
        timeTrackingMaxMs:
          type: integer
          format: int64
          minimum: 0
        emptyField:
          type: string
          enum:
            - ASSIGNEE
            - PRIORITY
            - DUE_DATE
        cursor:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        field:
          type: string
          enum:
            - TITLE
            - ASSIGNEE
            - ASSIGNEE_SET
            - STATUS
            - PRIORITY
            - CONTENT
            - DUE_DATE
            - UPDATED_AT
        parentWorkItemId:
          type: string
          format: uuid
    DashboardTablePage:
      type: object
      required:
        - items
        - options
        - nextCursor
        - contextIds
        - subitemCounts
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectWorkItemListItem"
        options:
          type: array
          items:
            $ref: "#/components/schemas/ProjectWorkItemFilterOption"
        nextCursor:
          type: string
          nullable: true
        contextIds:
          type: array
          description: 本身未命中图表条件、仅承载匹配子项的父项标识，不计入图表数量。
          items:
            type: string
            format: uuid
        subitemCounts:
          type: object
          description: 当前图表范围内的子项数量；缺失键为零。items 中的真实数量继续用于结构操作校验。
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
    DashboardItemsQuery:
      type: object
      required:
        - filters
        - offset
        - limit
      properties:
        filters:
          $ref: "#/components/schemas/DashboardFilters"
        offset:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000
        limit:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
        widget:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DashboardWidget"
        selection:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DashboardChartSelection"
    DashboardItem:
      type: object
      required:
        - id
        - projectId
        - itemNo
        - title
        - assigneeUserId
        - assigneeName
        - statusCode
        - statusName
        - statusCategory
        - colorToken
        - durationMs
        - updatedAt
      properties:
        assignees:
          type: array
          maxItems: 20
          readOnly: true
          description: 按指派顺序排列的平等处理人，第一位等于 assigneeUserId。
          items:
            $ref: "#/components/schemas/WorkItemAssignee"
        workItem:
          $ref: "#/components/schemas/ProjectWorkItemListItem"
        id: *a23
        projectId: *a23
        itemNo: *a24
        title: *a24
        assigneeUserId:
          description: 主处理人
          type: string
          format: uuid
          nullable: true
        assigneeName:
          description: 主处理人
          type: string
          nullable: true
        statusCode: *a24
        statusName: *a24
        statusCategory: *a24
        colorToken: *a24
        durationMs: *a21
        updatedAt: &a25
          type: string
          format: date-time
        contentId:
          type: string
          format: uuid
          nullable: true
        reporterUserId:
          type: string
          format: uuid
          nullable: true
        contentName:
          type: string
          nullable: true
        priority:
          type: string
          nullable: true
        priorityName:
          type: string
          nullable: true
        reporterName:
          type: string
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        timelineStartDate:
          type: string
          format: date
          nullable: true
        timelineEndDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    DashboardItemPage:
      type: object
      required:
        - items
        - totalElements
        - asOf
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DashboardItem"
        totalElements: *a21
        asOf: *a25
    TeamDashboardMember:
      type: object
      additionalProperties: false
      required:
        - userId
        - displayName
        - active
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          description: 已无资料的成员显示为“历史成员”。
        active:
          type: boolean
          description: 在职且账号启用。
    TeamTimesheetWorkItem:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - projectName
        - itemNo
        - title
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        itemNo:
          type: string
        title:
          type: string
    TeamTimesheetEntry:
      type: object
      additionalProperties: false
      required:
        - userId
        - workItemId
        - date
        - durationMs
      properties:
        userId:
          type: string
          format: uuid
        workItemId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        durationMs:
          type: integer
          format: int64
          minimum: 1
    TeamTimesheetCategoryEntry:
      type: object
      additionalProperties: false
      required:
        - userId
        - timeCategory
        - date
        - durationMs
      properties:
        projectId:
          type: string
          format: uuid
          nullable: true
        projectName:
          type: string
          nullable: true
        userId:
          $ref: "#/components/schemas/Uuid"
        timeCategory:
          $ref: "#/components/schemas/TimeCategory"
        date:
          type: string
          format: date
        durationMs:
          type: integer
          format: int64
          minimum: 1
    TeamTimesheet:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - timezone
        - asOf
        - members
        - workItems
        - entries
        - days
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timezone:
          type: string
        asOf:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamDashboardMember"
        workItems:
          type: array
          items:
            $ref: "#/components/schemas/TeamTimesheetWorkItem"
        entries:
          type: array
          description: 每个成员、工作项、自然日一条，只包含大于 0 的耗时。
          items:
            $ref: "#/components/schemas/TeamTimesheetEntry"
        categoryEntries:
          type: array
          description: 分类工时，每个成员、分类、关联项目、自然日一条，只包含大于 0 的耗时；有项目筛选时只含关联到这些项目的分类工时。服务端总是返回。
          items:
            $ref: "#/components/schemas/TeamTimesheetCategoryEntry"
        days:
          type: array
          items:
            $ref: "#/components/schemas/TeamTimesheetDay"
    TeamTimesheetDay:
      type: object
      additionalProperties: false
      required:
        - date
        - dayType
        - note
        - standardMinutes
      properties:
        date:
          type: string
          format: date
        dayType:
          $ref: "#/components/schemas/CalendarDayType"
        note:
          type: string
          nullable: true
        standardMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 720
          description: 公司日历当天标准工时分钟数，非工作日为 0。
    TeamMemberTask:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - projectName
        - itemNo
        - title
        - statusCode
        - statusName
        - statusCategory
        - statusColor
        - priorityName
        - priorityColor
        - dueDate
        - overdue
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        itemNo:
          type: string
        title:
          type: string
        statusCode:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,31}$
          description: 项目状态代码；NOT_STARTED 为项目初始状态，成员新增的状态使用生成的代码。
        statusName:
          type: string
        statusCategory:
          type: string
          enum:
            - TODO
            - IN_PROGRESS
        statusColor:
          type: string
          description: 项目状态标签色 token。
        priorityName:
          type: string
          nullable: true
        priorityColor:
          type: string
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        overdue:
          type: boolean
    TeamMemberTaskPage:
      type: object
      additionalProperties: false
      required:
        - items
        - totalElements
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamMemberTask"
        totalElements:
          type: integer
          format: int64
          minimum: 0
    TimeTrackingRunningSession:
      type: object
      additionalProperties: false
      required:
        - userId
        - startedAt
      properties:
        userId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
    TimeTrackingSummary:
      type: object
      additionalProperties: false
      required:
        - workItemId
        - completedDurationMs
        - totalDurationMs
        - ownDurationMs
        - sessionCount
        - runningSessions
        - allocatedDurationMs
        - rollupDurationMs
        - rollupRunningRate
      properties:
        workItemId:
          type: string
          format: uuid
        completedDurationMs:
          type: integer
          format: int64
          minimum: 0
        totalDurationMs:
          type: integer
          format: int64
          minimum: 0
        ownDurationMs:
          type: integer
          format: int64
          minimum: 0
        sessionCount:
          type: integer
          format: int64
          minimum: 0
        allocatedDurationMs:
          type: integer
          format: int64
          minimum: 0
        rollupDurationMs:
          type: integer
          format: int64
          minimum: 0
          description: 本项加直接子项的计入时长
        rollupRunningRate:
          type: number
          format: double
          minimum: 0
          description: 每经过 1 毫秒，rollupDurationMs 增加的毫秒数
        runningSessions:
          type: array
          items:
            $ref: "#/components/schemas/TimeTrackingRunningSession"
    CalendarDayType:
      type: string
      enum:
        - WORKDAY
        - NON_WORKDAY
        - HOLIDAY
      description: WORKDAY 工作日；NON_WORKDAY 休息日；HOLIDAY 法定节假日。
    Uuid:
      type: string
      format: uuid
      description: 不透明 UUID；客户端不得从值中推导业务语义。
    ManagedPlatformRole:
      type: string
      enum:
        - COMPANY_ADMIN
        - APP_MANAGER
    EmploymentStatus:
      type: string
      enum:
        - ACTIVE
        - LEFT
    AccountStatus:
      type: string
      enum:
        - ENABLED
        - DISABLED
    ProjectLifecycle:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
    NullableWorkItemPriority:
      type: string
