          maximum: 2100
        defaultWorkdayMinutes:
          type: integer
          minimum: 1
          maximum: 720
        etag:
          type: string
          pattern: ^"[0-9]+"$
        days:
          type: array
          items:
            $ref: "#/components/schemas/WorkCalendarDay"
    WorkCalendarDayInput:
