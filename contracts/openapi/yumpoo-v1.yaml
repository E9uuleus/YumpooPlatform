      properties:
        categoryProjectId:
          type: string
          format: uuid
          description: 仅与 timeCategory 一起使用，把分类记录关联到本人可写的项目。
        workItemId:
          type: string
          format: uuid
        timeCategory:
          $ref: "#/components/schemas/TimeCategory"
    TimeTrackingCommand:
      type: object
      additionalProperties: false
      properties:
        categoryProjectId:
          type: string
          format: uuid
          description: 仅与 timeCategory 一起使用，把分类记录关联到本人可写的项目。
        workItemId:
          type: string
          format: uuid
        workItemIds:
          type: array
          minItems: 1
          maxItems: 10
          description: 仅 start 使用，批量并行开始的工作项；与 timeCategories 合计最多 10 项。
          items:
            type: string
            format: uuid
        timeCategory:
          $ref: "#/components/schemas/TimeCategory"
        timeCategorySubjects:
          type: array
          minItems: 1
          maxItems: 10
          description: 仅 start 使用，批量开始可关联项目的分类；与 workItemIds、timeCategories 合计最多 10 项，同一分类只能出现一次。
          items:
            $ref: "#/components/schemas/TimeCategorySubject"
        timeCategories:
          type: array
          minItems: 1
          maxItems: 10
          description: 仅 start 使用，批量并行开始的非项目分类；与 workItemIds 合计最多 10 项。
          items:
            $ref: "#/components/schemas/TimeCategory"
