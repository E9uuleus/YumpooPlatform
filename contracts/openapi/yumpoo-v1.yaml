openapi: 3.0.3
info:
  title: Yumpoo API
  version: 1.0.0
  description: |
    Yumpoo 一期 HTTP API 的唯一静态契约源。

    所有业务 operation 都必须挂载在相对 server `/api/v1` 下。M0-09 只冻结公共
    schema、header、parameter、response 和 golden example；业务 paths 在对应模块
    实现时按兼容新增原则加入。
servers:
  - url: /api/v1
    description: Yumpoo v1 business API
tags:
  - name: Authentication
    description: Web 企微登录、会话退出与当前主体查询。
  - name: IdentityGovernance
    description: 身份治理快照、平台角色与账号状态管理。
  - name: IdentityAdministration
    description: 公司、企微配置状态、通讯录同步运行与成员目录只读管理。
paths:
  /company:
    get:
      tags: [IdentityAdministration]
      operationId: getCompany
      summary: 查询当前公司配置
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 当前公司的只读配置。
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/integrations/wecom/status:
    get:
      tags: [IdentityAdministration]
      operationId: getWeComIntegrationStatus
      summary: 查询企微集成配置与运行状态
      description: 只返回配置布尔状态和脱敏 Corp ID，绝不返回 Secret、token 或回调地址。
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: 企微集成只读状态。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeComIntegrationStatus' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/members:
    get:
      tags: [IdentityAdministration]
      operationId: listMembers
      summary: 分页查询成员目录
      security: [{ sessionCookie: [] }]
      parameters:
        - name: name
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: externalUserId
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: employmentStatus
          in: query
          required: false
          schema: { $ref: '#/components/schemas/EmploymentStatus' }
        - name: accountStatus
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AccountStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 成员分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/members/{userId}:
    get:
      tags: [IdentityAdministration]
      operationId: getMember
      summary: 查询成员目录详情
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 成员详情。
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

  /admin/directory-sync-runs:
    get:
      tags: [IdentityAdministration]
      operationId: listDirectorySyncRuns
      summary: 分页查询通讯录同步运行
      security: [{ sessionCookie: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/DirectorySyncRunStatus' }
        - name: triggerType
          in: query
          required: false
          schema: { $ref: '#/components/schemas/DirectorySyncTriggerType' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 同步运行分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorySyncRunPage' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [IdentityAdministration]
      operationId: triggerDirectorySync
      summary: 同步执行一次完整通讯录对账
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 新同步运行已执行并返回终态。
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorySyncRun' }
        '200':
          description: 同一幂等键的运行结果重放。
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorySyncRun' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 另一业务意图的运行仍处于活动状态，Location 指向该运行。
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /admin/directory-sync-runs/{runId}:
    get:
      tags: [IdentityAdministration]
      operationId: getDirectorySyncRun
      summary: 查询同步运行详情
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: 同步运行详情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorySyncRun' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

  /admin/directory-sync-runs/{runId}/failures:
    get:
      tags: [IdentityAdministration]
      operationId: listDirectorySyncFailures
      summary: 分页查询同步失败项
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 仅包含稳定错误码和脱敏成员引用的失败项分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectorySyncFailurePage' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

  /auth/wecom/authorize:
    get:
      tags: [Authentication]
      operationId: authorizeWeComLogin
      summary: 发起企微 Web 登录
      description: 创建一次性 OAuth state/nonce，并跳转到当前启用的身份提供者。
      security: []
      responses:
        '302':
          description: 跳转到身份提供者，并设置 HttpOnly nonce Cookie。
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /auth/wecom/callback:
    get:
      tags: [Authentication]
      operationId: completeWeComLogin
      summary: 完成企微 Web 登录
      description: |
        原子消费 OAuth attempt，解析已同步的企微身份并签发 Web Session。
        成功固定跳转到 `/`；无论成功失败均清除 nonce Cookie。
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: state
          in: query
          required: false
          schema:
            type: string
            minLength: 43
            maxLength: 43
            pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '302':
          description: 登录成功，签发 Session/CSRF Cookie 并固定跳转到 `/`。
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /electron/auth/attempts:
    post:
      tags: [Authentication]
      operationId: createElectronAuthAttempt
      summary: 创建 Electron 系统浏览器登录请求
      description: 绑定 Electron state、PKCE S256 challenge 与客户端版本并返回企微官方扫码地址。
      security: []
      parameters:
        - $ref: '#/components/parameters/ElectronClientType'
        - $ref: '#/components/parameters/ElectronClientVersion'
        - $ref: '#/components/parameters/ElectronProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ElectronAuthAttemptRequest' }
      responses:
        '201':
          description: 已创建五分钟有效的登录请求。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectronAuthAttemptResponse' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /electron/auth/wecom/callback:
    get:
      tags: [Authentication]
      operationId: completeElectronWeComLogin
      summary: 完成 Electron 企微扫码授权
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OpaqueDesktopToken' }
      responses:
        '302':
          description: 成功时跳转受限 yumpoo 协议；失败时跳转脱敏登录页。
          headers:
            Location: { $ref: '#/components/headers/Location' }
        '400': { $ref: '#/components/responses/MalformedRequest' }

  /electron/auth/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeElectronAuthHandoff
      summary: 兑换一次性 Electron 登录交接码
      security: []
      parameters:
        - $ref: '#/components/parameters/ElectronClientType'
        - $ref: '#/components/parameters/ElectronClientVersion'
        - $ref: '#/components/parameters/ElectronProtocolVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ElectronAuthExchangeRequest' }
      responses:
        '200':
          description: 正式 ELECTRON 会话材料；响应禁止缓存。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectronAuthExchangeResponse' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutCurrentSession
      summary: 退出当前会话
      description: |
        撤销当前 Session。已由 USER_LOGOUT 撤销的同一 Session 可携原 CSRF 幂等重试。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: 当前 Session 已处于主动退出状态，并清除 Session/CSRF Cookie。
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentAuthentication
      summary: 查询当前登录主体
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 当前 Web 登录主体、公司、角色及客户端兼容状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAuthentication'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/members/{userId}/governance-state:
    get:
      tags: [IdentityGovernance]
      operationId: getMemberGovernanceState
      summary: 查询成员最小治理快照
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 成员治理快照。
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GovernanceState' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

  /admin/role-assignments:
    get:
      tags: [IdentityGovernance]
      operationId: listRoleAssignments
      summary: 分页查询平台角色分配
      security: [{ sessionCookie: [] }]
      parameters:
        - name: userId
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: role
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ManagedPlatformRole' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RoleAssignmentStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 角色分配分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignmentPage' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/company-admin-assignments:
    post:
      tags: [IdentityGovernance]
      operationId: grantCompanyAdmin
      summary: 授予 COMPANY_ADMIN
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleGrantRequest' }
      responses:
        '201': { $ref: '#/components/responses/RoleGranted' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/company-admin-assignments/{assignmentId}:
    delete:
      tags: [IdentityGovernance]
      operationId: revokeCompanyAdmin
      summary: 撤销 COMPANY_ADMIN
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/GovernanceReason' }
      responses:
        '200': { $ref: '#/components/responses/RoleChanged' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/app-manager-assignments:
    post:
      tags: [IdentityGovernance]
      operationId: grantAppManager
      summary: 授予 APP_MANAGER
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleGrantRequest' }
      responses:
        '201': { $ref: '#/components/responses/RoleGranted' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/app-manager-assignments/{assignmentId}:
    delete:
      tags: [IdentityGovernance]
      operationId: revokeAppManager
      summary: 撤销 APP_MANAGER
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/GovernanceReason' }
      responses:
        '200': { $ref: '#/components/responses/RoleChanged' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/members/{userId}/account-disable:
    post:
      tags: [IdentityGovernance]
      operationId: disableMemberAccount
      summary: 禁用成员账号
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/GovernanceReason' }
      responses:
        '200': { $ref: '#/components/responses/AccountChanged' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/members/{userId}/account-enable:
    post:
      tags: [IdentityGovernance]
      operationId: enableMemberAccount
      summary: 启用成员账号
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/GovernanceReason' }
      responses:
        '200': { $ref: '#/components/responses/AccountChanged' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-yumpoo-session
      description: 服务端签发的 HttpOnly、Secure、SameSite=Lax Web Session Cookie。

  schemas:
    Uuid:
      type: string
      format: uuid
      description: 不透明 UUID；客户端不得从值中推导业务语义。

    ManagedPlatformRole:
      type: string
      enum: [COMPANY_ADMIN, APP_MANAGER]

    RoleAssignmentStatus:
      type: string
      enum: [ACTIVE, REVOKED]

    EmploymentStatus:
      type: string
      enum: [ACTIVE, LEFT]

    AccountStatus:
      type: string
      enum: [ENABLED, DISABLED]

    Company:
      type: object
      additionalProperties: false
      required: [id, displayName, timezone, weekStartDay, defaultWorkdayMinutes, rowVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        timezone: { type: string, minLength: 1, example: Asia/Shanghai }
        weekStartDay: { type: string, enum: [MONDAY] }
        defaultWorkdayMinutes: { type: integer, format: int32, minimum: 1, maximum: 720 }
        rowVersion: { type: integer, format: int64, minimum: 0 }

    WeComOAuthStatus:
      type: object
      additionalProperties: false
      required: [enabled, configured, corpIdMasked, agentIdConfigured, appSecretConfigured, callbackConfigured]
      properties:
        enabled: { type: boolean }
        configured: { type: boolean }
        corpIdMasked: { type: string, nullable: true }
        agentIdConfigured: { type: boolean }
        appSecretConfigured: { type: boolean }
        callbackConfigured: { type: boolean }

    WeComDirectoryStatus:
      type: object
      additionalProperties: false
      required: [enabled, configured, corpIdMasked, directorySecretConfigured, profileSecretConfigured]
      properties:
        enabled: { type: boolean }
        configured: { type: boolean }
        corpIdMasked: { type: string, nullable: true }
        directorySecretConfigured: { type: boolean }
        profileSecretConfigured: { type: boolean }

    WeComIntegrationStatus:
      type: object
      additionalProperties: false
      required: [oauth, directory, corpIdConsistent, activeRunId, lastSuccessfulRunAt, lastProblemAt, lastProblemCode]
      properties:
        oauth: { $ref: '#/components/schemas/WeComOAuthStatus' }
        directory: { $ref: '#/components/schemas/WeComDirectoryStatus' }
        corpIdConsistent: { type: boolean }
        activeRunId: { type: string, format: uuid, nullable: true }
        lastSuccessfulRunAt: { type: string, format: date-time, nullable: true }
        lastProblemAt: { type: string, format: date-time, nullable: true }
        lastProblemCode: { type: string, nullable: true }

    Member:
      type: object
      additionalProperties: false
      required: [userId, displayName, externalUserId, email, mobile, departmentSummary, employmentStatus, accountStatus, directorySyncedAt, leftAt, accountDisabledAt, accountDisabledByUserId, platformRoles, authorizationVersion, rowVersion, etag]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        externalUserId: { type: string, minLength: 1, maxLength: 256 }
        email: { type: string, nullable: true }
        mobile: { type: string, nullable: true }
        departmentSummary: { type: string, nullable: true }
        employmentStatus: { $ref: '#/components/schemas/EmploymentStatus' }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        directorySyncedAt: { $ref: '#/components/schemas/Instant' }
        leftAt: { type: string, format: date-time, nullable: true }
        accountDisabledAt: { type: string, format: date-time, nullable: true }
        accountDisabledByUserId: { type: string, format: uuid, nullable: true }
        platformRoles:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ManagedPlatformRole' }
        authorizationVersion: { type: integer, format: int64, minimum: 0 }
        rowVersion: { type: integer, format: int64, minimum: 0 }
        etag: { type: string, pattern: '^"[0-9]+"$' }

    MemberPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Member' } }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    DirectorySyncRunStatus:
      type: string
      enum: [RUNNING, SUCCEEDED, PARTIALLY_SUCCEEDED, FAILED]

    DirectorySyncTriggerType:
      type: string
      enum: [MANUAL, SCHEDULED]

    DirectorySyncCounts:
      type: object
      additionalProperties: false
      required: [discovered, staged, created, updated, unchanged, left, returned, failed, notApplied]
      properties:
        discovered: { type: integer, format: int32, minimum: 0 }
        staged: { type: integer, format: int32, minimum: 0 }
        created: { type: integer, format: int32, minimum: 0 }
        updated: { type: integer, format: int32, minimum: 0 }
        unchanged: { type: integer, format: int32, minimum: 0 }
        left: { type: integer, format: int32, minimum: 0 }
        returned: { type: integer, format: int32, minimum: 0 }
        failed: { type: integer, format: int32, minimum: 0 }
        notApplied: { type: integer, format: int32, minimum: 0 }

    DirectorySyncRun:
      type: object
      additionalProperties: false
      required: [runId, triggerType, triggeredByUserId, triggeredByDisplayName, phase, status, cursorTerminationMode, pageCount, scanComplete, counts, errorCode, errorSummary, requestId, rowVersion, startedAt, finishedAt]
      properties:
        runId: { $ref: '#/components/schemas/Uuid' }
        triggerType: { $ref: '#/components/schemas/DirectorySyncTriggerType' }
        triggeredByUserId: { type: string, format: uuid, nullable: true }
        triggeredByDisplayName: { type: string, nullable: true }
        phase: { type: string, enum: [COLLECTING_IDS, COLLECTING_PROFILES, APPLYING, FINALIZING, COMPLETED] }
        status: { $ref: '#/components/schemas/DirectorySyncRunStatus' }
        cursorTerminationMode: { type: string, nullable: true, enum: [EXPLICIT_EMPTY, OMITTED_CONFIRMED] }
        pageCount: { type: integer, format: int32, minimum: 0 }
        scanComplete: { type: boolean }
        counts: { $ref: '#/components/schemas/DirectorySyncCounts' }
        errorCode: { type: string, nullable: true }
        errorSummary: { type: string, nullable: true }
        requestId: { $ref: '#/components/schemas/RequestId' }
        rowVersion: { type: integer, format: int64, minimum: 0 }
        startedAt: { $ref: '#/components/schemas/Instant' }
        finishedAt: { type: string, format: date-time, nullable: true }

    DirectorySyncRunPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DirectorySyncRun' } }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    DirectorySyncFailure:
      type: object
      additionalProperties: false
      required: [maskedMemberReference, action, result, errorCode]
      properties:
        maskedMemberReference: { type: string, minLength: 1 }
        action: { type: string, enum: [PROVISION] }
        result: { type: string, enum: [FAILED, NOT_APPLIED] }
        errorCode: { type: string, minLength: 1 }

    DirectorySyncFailurePage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DirectorySyncFailure' } }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    GovernanceReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 160

    RoleGrantRequest:
      type: object
      additionalProperties: false
      required: [userId, reason]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        reason:
          type: string
          minLength: 1
          maxLength: 160

    GovernanceState:
      type: object
      additionalProperties: false
      required: [userId, displayName, employmentStatus, accountStatus, platformRoles, authorizationVersion, rowVersion]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string, minLength: 1 }
        employmentStatus: { $ref: '#/components/schemas/EmploymentStatus' }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        platformRoles:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ManagedPlatformRole' }
        authorizationVersion: { type: integer, format: int64, minimum: 0 }
        rowVersion: { type: integer, format: int64, minimum: 0 }

    RoleAssignment:
      type: object
      additionalProperties: false
      required: [assignmentId, userId, role, scopeType, scopeId, status, grantedAt, revokedAt, rowVersion, etag]
      properties:
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        role: { $ref: '#/components/schemas/ManagedPlatformRole' }
        scopeType: { type: string, enum: [COMPANY, PLATFORM] }
        scopeId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/RoleAssignmentStatus' }
        grantedAt: { $ref: '#/components/schemas/Instant' }
        revokedAt:
          type: string
          format: date-time
          nullable: true
        rowVersion: { type: integer, format: int64, minimum: 0 }
        etag: { type: string, pattern: '^"[0-9]+"$' }

    RoleAssignmentPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RoleAssignment' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    RoleMutationResult:
      type: object
      additionalProperties: false
      required: [assignmentId, companyId, userId, role, status, assignmentRowVersion, userRowVersion, authorizationVersion, changedAt]
      properties:
        assignmentId: { $ref: '#/components/schemas/Uuid' }
        companyId: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        role: { $ref: '#/components/schemas/ManagedPlatformRole' }
        status: { $ref: '#/components/schemas/RoleAssignmentStatus' }
        assignmentRowVersion: { type: integer, format: int64, minimum: 0 }
        userRowVersion: { type: integer, format: int64, minimum: 0 }
        authorizationVersion: { type: integer, format: int64, minimum: 0 }
        changedAt: { $ref: '#/components/schemas/Instant' }

    AccountStatusChangeResult:
      type: object
      additionalProperties: false
      required: [userId, employmentStatus, accountStatus, authorizationVersion, rowVersion]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        employmentStatus: { $ref: '#/components/schemas/EmploymentStatus' }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
        authorizationVersion: { type: integer, format: int64, minimum: 0 }
        rowVersion: { type: integer, format: int64, minimum: 0 }

    Instant:
      type: string
      format: date-time
      description: RFC 3339 UTC 时刻。
      example: '2026-08-09T09:30:00.123Z'

    LocalDate:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: 不携带时区或零点时刻的自然日，格式为 YYYY-MM-DD。
      example: '2026-08-09'

    AuthenticationRole:
      type: string
      enum:
        - COMPANY_MEMBER
        - COMPANY_ADMIN
        - APP_MANAGER

    AuthenticationClientType:
      type: string
      enum:
        - WEB
        - ELECTRON

    OpaqueDesktopToken:
      type: string
      minLength: 43
      maxLength: 43
      pattern: '^[A-Za-z0-9_-]{43}$'

    ElectronAuthAttemptRequest:
      type: object
      additionalProperties: false
      required: [state, codeChallenge, codeChallengeMethod]
      properties:
        state: { $ref: '#/components/schemas/OpaqueDesktopToken' }
        codeChallenge:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        codeChallengeMethod:
          type: string
          enum: [S256]

    ElectronAuthAttemptResponse:
      type: object
      additionalProperties: false
      required: [authorizationUrl, expiresAt]
      properties:
        authorizationUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    ElectronAuthExchangeRequest:
      type: object
      additionalProperties: false
      required: [state, handoffCode, codeVerifier]
      properties:
        state: { $ref: '#/components/schemas/OpaqueDesktopToken' }
        handoffCode: { $ref: '#/components/schemas/OpaqueDesktopToken' }
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]{43,128}$'

    ElectronAuthExchangeResponse:
      type: object
      additionalProperties: false
      required: [sessionCredential, csrfCredential, absoluteExpiresAt]
      properties:
        sessionCredential: { type: string, minLength: 43, maxLength: 256, writeOnly: true }
        csrfCredential: { type: string, minLength: 43, maxLength: 256, writeOnly: true }
        absoluteExpiresAt: { type: string, format: date-time }

    ClientCompatibility:
      type: string
      enum:
        - SUPPORTED
        - DEPRECATED
        - BLOCKED

    CurrentAuthenticationUser:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
          minLength: 1

    CurrentAuthenticationCompany:
      type: object
      additionalProperties: false
      required: [id, displayName, timezone, weekStartDay]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
          minLength: 1
        timezone:
          type: string
          minLength: 1
          description: IANA 时区标识。
          example: Asia/Shanghai
        weekStartDay:
          type: string
          enum: [MONDAY]

    CurrentAuthenticationClient:
      type: object
      additionalProperties: false
      required: [type, compatibility]
      properties:
        type:
          $ref: '#/components/schemas/AuthenticationClientType'
        compatibility:
          $ref: '#/components/schemas/ClientCompatibility'

    CurrentAuthentication:
      type: object
      additionalProperties: false
      required: [user, company, roles, client]
      properties:
        user:
          $ref: '#/components/schemas/CurrentAuthenticationUser'
        company:
          $ref: '#/components/schemas/CurrentAuthenticationCompany'
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AuthenticationRole'
        client:
          $ref: '#/components/schemas/CurrentAuthenticationClient'

    RequestId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
      description: 服务端生成或从可信反向代理接收的不透明请求关联标识。

    ErrorCode:
      type: string
      description: |
        一期冻结的公共错误码。客户端只能使用 code 做程序判断，不能解析 message。
      enum:
        - MALFORMED_REQUEST
        - AUTHENTICATION_REQUIRED
        - ACCOUNT_DISABLED
        - ACCESS_DENIED
        - RESOURCE_NOT_FOUND
        - IDEMPOTENCY_KEY_REUSED
        - REQUEST_IN_PROGRESS
        - INVALID_STATE_TRANSITION
        - WORKLOG_LOCKED
        - VERSION_CONFLICT
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_ALLOWED
        - VALIDATION_FAILED
        - CLIENT_UPGRADE_REQUIRED
        - PRECONDITION_REQUIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE

    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          minLength: 1
          description: 出错字段的稳定请求字段名。
        code:
          type: string
          minLength: 1
          description: 字段级稳定错误码。
        message:
          type: string
          minLength: 1
          description: 面向当前用户且不包含内部实现信息的说明。

    ApiErrorBase:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
        - retryable
        - fieldErrors
        - details
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          description: 面向当前用户的安全错误说明。
        requestId:
          $ref: '#/components/schemas/RequestId'
        retryable:
          type: boolean
          description: 当前请求是否可在不改变业务意图的前提下自动重试。
        fieldErrors:
          type: array
          description: 字段级错误；非字段校验错误固定为空数组。
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          type: object
          description: 错误专用详情；具体响应 schema 必须进一步收窄。

    EmptyErrorDetails:
      type: object
      additionalProperties: false
      description: |
        M0-09 不公开任何错误详情字段。当前契约只接受严格空对象；未来新增详情时
        必须先为对应错误定义明确 schema。

    ErrorResponse:
      description: ApiErrorBase 在 M0-09 使用严格空 details 的具体响应类型。
      allOf:
        - $ref: '#/components/schemas/ApiErrorBase'
        - type: object
          required:
            - details
          properties:
            details:
              $ref: '#/components/schemas/EmptyErrorDetails'

    PageMetadata:
      type: object
      additionalProperties: false
      description: |
        普通分页的共享元数据约束。为兼容既定响应 JSON 形状，PageResponse 不增加
        metadata 包装层，而是在顶层平铺并重复声明这里的四个字段。
      required:
        - page
        - size
        - totalElements
        - totalPages
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
          description: 当前页号，从 0 开始。
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: 当前页容量；默认 20，硬上限 100。
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: 在权限过滤后可见的元素总数。
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: 在权限过滤后可见的总页数。

    CursorPageMetadata:
      type: object
      additionalProperties: false
      description: |
        cursor 分页的共享元数据约束。为兼容既定响应 JSON 形状，CursorPageResponse
        不增加 metadata 包装层，而是在顶层平铺并重复声明 nextCursor。
      required:
        - nextCursor
      properties:
        nextCursor:
          type: string
          minLength: 1
          nullable: true
          description: 不透明续读游标；没有下一批时为 null。

    PageResponse:
      type: object
      additionalProperties: false
      description: |
        固定扁平普通分页响应；page、size、totalElements、totalPages 与 PageMetadata
        保持同一约束，不引入 metadata 包装对象。
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          description: 当前页资源 DTO；具体 operation 必须收窄 item schema。
          items:
            type: object
            additionalProperties: true
        page:
          type: integer
          format: int32
          minimum: 0
          description: 当前页号，从 0 开始。
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: 当前页容量；默认 20，硬上限 100。
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: 在权限过滤后可见的元素总数。
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: 在权限过滤后可见的总页数。

    CursorPageResponse:
      type: object
      additionalProperties: false
      description: |
        固定扁平 cursor 分页响应；nextCursor 与 CursorPageMetadata 保持同一约束，
        不引入 metadata 包装对象。
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          description: 当前批次资源 DTO；具体 operation 必须收窄 item schema。
          items:
            type: object
            additionalProperties: true
        nextCursor:
          type: string
          minLength: 1
          nullable: true
          description: 不透明续读游标；没有下一批时为 null。

  requestBodies:
    GovernanceReason:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GovernanceReasonRequest' }

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    RunId:
      name: runId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }

    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: 与当前 Session 绑定并由非 HttpOnly Cookie 回传的 CSRF 凭据。
      schema:
        type: string
        minLength: 1

    Page:
      name: page
      in: query
      required: false
      description: 页号，从 0 开始。
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

    Size:
      name: size
      in: query
      required: false
      description: 页容量，默认 20，最大 100。
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

    Cursor:
      name: cursor
      in: query
      required: false
      description: 追加流使用的不透明续读游标，不得按 offset 解释。
      schema:
        type: string
        minLength: 1

    FromDate:
      name: from
      in: query
      required: true
      description: 统计范围起始自然日，首尾包含。
      schema:
        $ref: '#/components/schemas/LocalDate'

    ToDate:
      name: to
      in: query
      required: true
      description: 统计范围结束自然日，首尾包含且范围最多 366 天。
      schema:
        $ref: '#/components/schemas/LocalDate'

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        单个强 ETag，格式为双引号包围的十进制 rowVersion。弱验证器、`*` 和多个
        ETag 均不属于一期契约。
      schema:
        type: string
        pattern: '^"[0-9]+"$'
      example: '"5"'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端为单一业务意图生成并在重试时复用的 UUID。
      schema:
        type: string
        format: uuid
        maxLength: 64

    ElectronClientType:
      name: X-Client-Type
      in: header
      required: true
      description: Electron 请求固定为 ELECTRON；该头不是认证凭据。
      schema:
        type: string
        enum:
          - ELECTRON

    ElectronClientVersion:
      name: X-Client-Version
      in: header
      required: true
      description: Electron 应用版本；该头不是认证凭据。
      schema:
        type: string
        minLength: 1
        maxLength: 64

    ElectronProtocolVersion:
      name: X-Client-Protocol-Version
      in: header
      required: true
      description: Electron 与服务端约定的协议版本；该头不是认证凭据。
      schema:
        type: string
        enum: ['1']

  headers:
    Location:
      description: 跳转目标 URI。
      schema:
        type: string
        format: uri-reference

    SetCookie:
      description: 一个或多个安全 Cookie；客户端必须按 HTTP 多值头语义处理。
      schema:
        type: string

    XRequestId:
      description: 请求关联标识；错误响应中必须与 body.requestId 完全一致。
      schema:
        $ref: '#/components/schemas/RequestId'

    ETag:
      description: 当前资源 rowVersion 对应的单个强 ETag。
      schema:
        type: string
        pattern: '^"[0-9]+"$'
      example: '"5"'

    RetryAfter:
      description: 允许再次尝试前应等待的秒数。
      schema:
        type: integer
        format: int32
        minimum: 1

  examples:
    MalformedRequest:
      summary: JSON、类型、参数或 If-Match 格式无法解析
      externalValue: ../examples/errors/400-malformed-request.json

    AuthenticationRequired:
      summary: 会话缺失、未知、过期、主动退出或登录回调统一失败
      externalValue: ../examples/errors/401-authentication-required.json

    AccountDisabled:
      summary: 可识别会话因离职或账号禁用被撤销
      externalValue: ../examples/errors/403-account-disabled.json

    AccessDenied:
      summary: 有效主体可见资源但没有动作权限
      externalValue: ../examples/errors/403-access-denied.json

    ResourceNotFound:
      summary: 资源不存在或存在性对当前主体不可见
      externalValue: ../examples/errors/404-resource-not-found.json

    IdempotencyKeyReused:
      summary: 相同幂等键被用于不同请求内容
      externalValue: ../examples/errors/409-idempotency-key-reused.json

    RequestInProgress:
      summary: 相同幂等请求仍在处理中
      externalValue: ../examples/errors/409-request-in-progress.json

    InvalidStateTransition:
      summary: 当前业务状态不允许目标命令
      externalValue: ../examples/errors/409-invalid-state-transition.json

    WorklogLocked:
      summary: 已提交或批准工时不能普通修改
      externalValue: ../examples/errors/409-worklog-locked.json

    VersionConflict:
      summary: If-Match 与当前可见资源版本不一致
      externalValue: ../examples/errors/412-version-conflict.json

    FileTooLarge:
      summary: 上传内容超过冻结的服务端字节上限
      externalValue: ../examples/errors/413-file-too-large.json

    FileTypeNotAllowed:
      summary: 文件名、声明类型或服务端识别类型不在允许策略内
      externalValue: ../examples/errors/415-file-type-not-allowed.json

    ValidationFailed:
      summary: 请求格式正确但字段或业务规则不满足
      externalValue: ../examples/errors/422-validation-failed.json

    ClientUpgradeRequired:
