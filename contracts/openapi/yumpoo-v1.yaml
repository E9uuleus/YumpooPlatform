        - WorkItems
      operationId: createWorkItemSubitem
      summary: 为根 Work Item 创建全新子项
      description: 子项必须属于父项所在 Project；Content 可在同 Project 的 ACTIVE Content 中选择。本阶段不支持在子项下继续创建子项。
