          $ref: "#/components/schemas/OperationsLogRecord"
    OperationsLogPage:
      type: object
      additionalProperties: false
      required:
        - items
        - source
        - nextCursor
        - partial
        - partialReason
        - scannedBytes
        - skippedLines
        - droppedCount
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OperationsLogEntry"
        source: *a26
        nextCursor:
          type: string
          nullable: true
        partial: &a30
          type: boolean
        partialReason:
          type: string
          nullable: true
        scannedBytes: *a27
        skippedLines: *a27
        droppedCount: *a27
      description: 每次查询范围至多 24h。文件查询预算 256MiB/3s、并发 1；partial 为 true 时结果并不完整。cursor 为进程内、5 分钟有效且绑定全部过滤条件的 opaque handle；文件变化时显式返回 partial。
    OperationsLogTail:
      type: object
      additionalProperties: false
      required:
        - bootId
        - items
        - nextAfterSeq
        - latestSeq
        - hasMore
        - gap
        - gapReason
        - droppedCount
      properties:
        bootId: *a26
        items:
          type: array
          items:
            $ref: "#/components/schemas/OperationsLogEntry"
        nextAfterSeq:
          type: string
          pattern: ^[0-9]+$
        latestSeq:
          type: string
          pattern: ^[0-9]+$
        hasMore: *a30
        gap: *a30
        gapReason:
          type: string
          nullable: true
        droppedCount: *a27
      description: seq 均使用十进制字符串；仅同一 bootId 内可比较。nextAfterSeq 推进所有已检查记录，过滤无结果也会推进；hasMore 时应继续补齐。gap 表示进程重启、缓冲淘汰或非法未来水位。
