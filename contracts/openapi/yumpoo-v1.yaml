        dryRun:
          type: boolean
        importedDayCount:
          type: integer
          format: int32
          minimum: 0
        clearedDayCount:
          type: integer
          format: int32
          minimum: 0
        failedDayCount:
          type: integer
          format: int32
          minimum: 0
        importedMinutes:
          type: integer
          format: int64
          minimum: 0
        replacedMinutes:
          type: integer
          format: int64
          minimum: 0
          description: 被覆盖或清除的原有迁入工时分钟数。
        days:
          type: array
          items:
            $ref: "#/components/schemas/MigratedTimeImportDay"
    ScheduledJob:
      type: object
      additionalProperties: false
      required:
        - code
        - available
        - enabled
        - cron
        - zoneId
        - nextRunAt
        - lastStartedAt
        - lastFinishedAt
        - lastOutcome
        - lastErrorCode
        - lastRequestId
        - etag
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
        available:
          type: boolean
          description: 当前部署是否启用该任务依赖；为 false 时到点记录 SKIPPED。
        enabled:
          type: boolean
        cron:
          type: string
          minLength: 1
          maxLength: 64
        zoneId:
          type: string
          minLength: 1
          maxLength: 100
        nextRunAt:
          type: string
          format: date-time
          nullable: true
        lastStartedAt:
          type: string
          format: date-time
          nullable: true
        lastFinishedAt:
          type: string
          format: date-time
          nullable: true
        lastOutcome:
          type: string
          nullable: true
          enum:
            - SUCCEEDED
            - PARTIAL
            - FAILED
            - SKIPPED
        lastErrorCode:
          type: string
          maxLength: 96
          nullable: true
        lastRequestId:
          type: string
          maxLength: 64
          nullable: true
        etag:
          type: string
          pattern: ^"[0-9]+"$
    ScheduledJobList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScheduledJob"
    CalendarDaySource:
      type: string
      enum:
        - MANUAL
        - IMPORT
      nullable: true
      description: 显式日期的最近编辑来源；未设置日期为空，写入省略时默认 MANUAL。
    WorkCalendarDay:
      type: object
      additionalProperties: false
      required:
        - date
        - dayType
        - standardMinutes
        - note
        - explicit
        - configuredStandardMinutes
        - source
      properties:
        date:
          type: string
          format: date
        dayType:
          $ref: "#/components/schemas/CalendarDayType"
        standardMinutes:
          type: integer
          minimum: 0
          maximum: 720
        configuredStandardMinutes:
          type: integer
          minimum: 1
          maximum: 720
          nullable: true
          description: 工作日原始标准工时设置；为空表示继承公司默认值，非工作日及未设置日期也为空。
