          type: string
          maxLength: 500
    TimeTrackingSession:
      type: object
      additionalProperties: false
      required:
        - id
        - projectId
        - workItemId
        - userId
        - displayName
        - startedAt
        - stoppedAt
        - source
        - durationMs
        - rowVersion
        - etag
        - canEdit
        - deleted
        - changeReason
        - allocatedDurationMs
        - parallelItemCount
        - workItemNo
        - workItemTitle
      properties:
        categoryProjectId:
          type: string
          format: uuid
          nullable: true
          description: 分类记录关联的项目；工作项记录为 null
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
          nullable: true
          description: 为 null 时，要么项目对调用者不可见，要么这是非项目分类记录（timeCategory 有值）。
        workItemId:
          type: string
          format: uuid
          nullable: true
          description: 为 null 时，要么工作项对调用者不可见，要么这是非项目分类记录（timeCategory 有值）。
        timeCategory:
          type: string
          nullable: true
          description: 非项目分类记录的分类；工作项记录为 null。服务端总是返回。
          allOf:
            - $ref: "#/components/schemas/TimeCategory"
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        startedAt:
          type: string
          format: date-time
        stoppedAt:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          enum:
            - TIMER
            - MANUAL
        durationMs:
          type: integer
          format: int64
          minimum: 0
        rowVersion:
          type: integer
          format: int64
          minimum: 0
        etag:
          type: string
        canEdit:
          type: boolean
        deleted:
          type: boolean
        changeReason:
          type: string
          nullable: true
        allocatedDurationMs:
          type: integer
          format: int64
          minimum: 0
          description: 按并行均摊后的计入时长
        parallelItemCount:
          type: integer
          format: int32
          minimum: 0
          description: 该记录期间本人同时计时的其他工作项与非项目分类数
        workItemNo:
          type: string
          nullable: true
          description: 记录属于子项时的工作项编号。
        workItemTitle:
          type: string
          nullable: true
          description: 记录属于子项时的工作项标题。
