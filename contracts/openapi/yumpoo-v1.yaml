        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/project-templates/{templateKey}/versions/{version}:
    get:
      tags: [ProjectTemplateAdministration]
      operationId: getProjectTemplateVersion
      summary: 查询任意状态的模板版本治理详情
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TemplateKey'
        - $ref: '#/components/parameters/TemplateVersion'
      responses:
        '200':
          description: 模板版本完整详情。
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectTemplateVersion' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }

  /admin/project-templates/{templateKey}/versions/{version}/publish:
    post:
      tags: [ProjectTemplateAdministration]
      operationId: publishProjectTemplateVersion
      summary: 发布 DRAFT 模板版本
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TemplateKey'
        - $ref: '#/components/parameters/TemplateVersion'
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/GovernanceReason' }
      responses:
        '200': { $ref: '#/components/responses/ProjectTemplateChanged' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/project-templates/{templateKey}/versions/{version}/retire:
    post:
      tags: [ProjectTemplateAdministration]
      operationId: retireProjectTemplateVersion
      summary: 停用 PUBLISHED 模板版本
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TemplateKey'
        - $ref: '#/components/parameters/TemplateVersion'
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody: { $ref: '#/components/requestBodies/GovernanceReason' }
      responses:
        '200': { $ref: '#/components/responses/ProjectTemplateChanged' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-yumpoo-session
      description: 服务端签发的 HttpOnly、Secure、SameSite=Lax Web Session Cookie。

  schemas:
    Uuid:
      type: string
      format: uuid
      description: 不透明 UUID；客户端不得从值中推导业务语义。

    ManagedPlatformRole:
      type: string
      enum: [COMPANY_ADMIN, APP_MANAGER]

    RoleAssignmentStatus:
      type: string
      enum: [ACTIVE, REVOKED]

    EmploymentStatus:
      type: string
      enum: [ACTIVE, LEFT]

    AccountStatus:
      type: string
      enum: [ENABLED, DISABLED]

    WorkspaceStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]

    WorkspaceStatusFilter:
      type: string
      enum: [ACTIVE, ARCHIVED, ALL]

    Workspace:
      type: object
      additionalProperties: false
      required: [id, code, name, description, sortOrder, status, visibleProjectCount, rowVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 500, nullable: true }
        sortOrder: { type: integer, format: int32, minimum: 0 }
        status: { $ref: '#/components/schemas/WorkspaceStatus' }
        visibleProjectCount:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: 调用人可见的 DRAFT 与 ACTIVE Project 数量；管理员统计全公司，普通用户统计 ACTIVE membership。
        rowVersion: { type: integer, format: int64, minimum: 0, readOnly: true }

    WorkspaceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Workspace' }

    WorkspaceCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name, sortOrder]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 500, nullable: true }
        sortOrder: { type: integer, format: int32, minimum: 0 }

    WorkspaceUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, description, sortOrder]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 500, nullable: true }
        sortOrder: { type: integer, format: int32, minimum: 0 }

    ProductStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]

    ProductStatusFilter:
      type: string
      enum: [ACTIVE, ARCHIVED, ALL]

    Product:
      type: object
      additionalProperties: false
      required: [id, code, name, description, status, ownerUserId, rowVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500, nullable: true }
        status: { $ref: '#/components/schemas/ProductStatus' }
        ownerUserId: { $ref: '#/components/schemas/Uuid' }
        rowVersion: { type: integer, format: int64, minimum: 0, readOnly: true }

    ProductPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    ProductCreateRequest:
      type: object
      additionalProperties: false
      required: [code, name, ownerUserId]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500, nullable: true }
        ownerUserId: { $ref: '#/components/schemas/Uuid' }

    ProductUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500, nullable: true }

    ProductOwnerReassignmentRequest:
      type: object
      additionalProperties: false
      required: [newOwnerUserId, reason]
      properties:
        newOwnerUserId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 10, maxLength: 500 }

    ProjectTemplateKey:
      type: string
      enum: [RND, PRE_SALES, IMPLEMENTATION, HYPERCARE]

    ProjectType:
      type: string
      enum: [PRODUCT_DEVELOPMENT, PRE_SALES, IMPLEMENTATION, HYPERCARE]

    ProjectLifecycle:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]

    ProjectLifecycleFilter:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED, ALL]

    ProjectActorAccess:
      type: string
      enum: [OWNER, MEMBER, COMPANY_ADMIN]

    ProjectCapabilities:
      type: object
      additionalProperties: false
      required: [canUpdateSettings, canActivate, canManageMembers, canReassignOwner,
        canManageProductLinks, canArchive, canRestore, canMoveWorkspace, canOverrideArchive]
      properties:
        canUpdateSettings: { type: boolean, readOnly: true }
        canActivate: { type: boolean, readOnly: true }
        canManageMembers: { type: boolean, readOnly: true }
        canReassignOwner: { type: boolean, readOnly: true }
        canManageProductLinks: { type: boolean, readOnly: true }
        canArchive: { type: boolean, readOnly: true }
        canRestore: { type: boolean, readOnly: true }
        canMoveWorkspace: { type: boolean, readOnly: true }
        canOverrideArchive: { type: boolean, readOnly: true }

    ProjectWorkspaceMoveRequest:
      type: object
      additionalProperties: false
      required: [targetWorkspaceId, reason]
      properties:
        targetWorkspaceId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 10, maxLength: 500 }

    GovernanceOverrideAction:
      type: string
      enum: [PROJECT_ARCHIVE_WITH_OPEN_ITEMS, WORKSPACE_ARCHIVE_WITH_ACTIVE_PROJECTS]

    GovernanceTargetType:
      type: string
      enum: [PROJECT, WORKSPACE]

    GovernanceOverrideResult:
      type: string
      enum: [SUCCEEDED, FAILED]

    GovernanceOverrideRequest:
      type: object
      additionalProperties: false
      required: [action, targetType, targetId, reason]
      properties:
        action: { $ref: '#/components/schemas/GovernanceOverrideAction' }
        targetType: { $ref: '#/components/schemas/GovernanceTargetType' }
        targetId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 10, maxLength: 500 }

    GovernanceOverrideRecord:
      type: object
      additionalProperties: false
      required: [id, companyId, action, targetType, targetId, reason, requestHash,
        idempotencyKey, actorUserId, beforeSnapshot, blockerCounts, result, occurredAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        companyId: { $ref: '#/components/schemas/Uuid' }
        action: { $ref: '#/components/schemas/GovernanceOverrideAction' }
        targetType: { $ref: '#/components/schemas/GovernanceTargetType' }
        targetId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 10, maxLength: 500 }
        requestHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        idempotencyKey: { $ref: '#/components/schemas/Uuid' }
        actorUserId: { $ref: '#/components/schemas/Uuid' }
        beforeSnapshot: { type: object, additionalProperties: true }
        afterSnapshot: { type: object, additionalProperties: true, nullable: true }
        blockerCounts:
          type: array
          items: { $ref: '#/components/schemas/SafeBlocker' }
        result: { $ref: '#/components/schemas/GovernanceOverrideResult' }
        errorCode: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }

    GovernanceOverridePage:
      type: object
      additionalProperties: false
      required: [items, offset, size, totalElements]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/GovernanceOverrideRecord' } }
        offset: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }

    ProjectProductRelationType:
      type: string
      enum: [DEVELOPMENT, DELIVERY, SUPPORT, USED_BY]

    ProjectProductLinkStatus:
      type: string
      enum: [ACTIVE, REMOVED]

    ProjectProductLink:
      type: object
      additionalProperties: false
      required: [id, projectId, productId, productCode, productName, productStatus, relationType,
        isPrimary, status, linkedAt, linkedByUserId, updatedAt, updatedByUserId, removedAt,
        removedByUserId, removeReason, rowVersion, etag]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        productId: { $ref: '#/components/schemas/Uuid' }
        productCode: { type: string, minLength: 2, maxLength: 32 }
        productName: { type: string, minLength: 1, maxLength: 80 }
        productStatus: { $ref: '#/components/schemas/ProductStatus' }
        relationType: { $ref: '#/components/schemas/ProjectProductRelationType' }
        isPrimary: { type: boolean }
        status: { $ref: '#/components/schemas/ProjectProductLinkStatus' }
        linkedAt: { type: string, format: date-time, readOnly: true }
        linkedByUserId: { $ref: '#/components/schemas/Uuid' }
        updatedAt: { type: string, format: date-time, readOnly: true }
        updatedByUserId: { $ref: '#/components/schemas/Uuid' }
        removedAt: { type: string, format: date-time, nullable: true, readOnly: true }
        removedByUserId: { type: string, format: uuid, nullable: true }
        removeReason: { type: string, minLength: 1, maxLength: 500, nullable: true }
        rowVersion: { type: integer, format: int64, minimum: 0, readOnly: true }
        etag: { type: string, pattern: '^"[0-9]+"$', readOnly: true }

    ProjectProductLinkList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProjectProductLink' } }

    ProjectProductCandidate:
      type: object
      additionalProperties: false
      required: [id, code, name, activeRelationTypes, primary]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, minLength: 2, maxLength: 32 }
        name: { type: string, minLength: 1, maxLength: 80 }
        activeRelationTypes:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/ProjectProductRelationType' }
        primary: { type: boolean }

    ProjectProductCandidatePage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProjectProductCandidate' } }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    ProjectProductLinkCreateRequest:
      type: object
      additionalProperties: false
      required: [productId, relationType, isPrimary]
      properties:
        productId: { $ref: '#/components/schemas/Uuid' }
        relationType: { $ref: '#/components/schemas/ProjectProductRelationType' }
        isPrimary: { type: boolean }

    ProjectProductLinkUpdateRequest:
      type: object
      additionalProperties: false
      required: [isPrimary]
      properties:
        isPrimary: { type: boolean }

    ProjectProductLinkRemoveRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, nullable: true }

    Project:
      type: object
      additionalProperties: false
      required:
        - id
        - workspaceId
        - code
        - name
        - description
        - projectType
        - lifecycle
        - ownerUserId
        - templateKey
        - templateVersion
        - customerName
        - customerReference
        - deliverySite
        - contactNote
        - rowVersion
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        code:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500, nullable: true }
        projectType: { $ref: '#/components/schemas/ProjectType' }
        lifecycle: { $ref: '#/components/schemas/ProjectLifecycle' }
        ownerUserId: { $ref: '#/components/schemas/Uuid' }
        templateKey: { $ref: '#/components/schemas/ProjectTemplateKey' }
        templateVersion: { type: integer, format: int32, minimum: 1 }
        customerName: { type: string, maxLength: 160, nullable: true }
        customerReference: { type: string, maxLength: 80, nullable: true }
        deliverySite: { type: string, maxLength: 160, nullable: true }
        contactNote: { type: string, maxLength: 500, nullable: true }
        rowVersion: { type: integer, format: int64, minimum: 0, readOnly: true }

    ProjectCreateRequest:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - code
        - name
        - projectType
        - ownerUserId
        - templateKey
        - templateVersion
      properties:
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        code:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500, nullable: true }
        projectType: { $ref: '#/components/schemas/ProjectType' }
        ownerUserId: { $ref: '#/components/schemas/Uuid' }
        templateKey: { $ref: '#/components/schemas/ProjectTemplateKey' }
        templateVersion: { type: integer, format: int32, minimum: 1 }
        customerName: { type: string, maxLength: 160, nullable: true }
        customerReference: { type: string, maxLength: 80, nullable: true }
        deliverySite: { type: string, maxLength: 160, nullable: true }
        contactNote: { type: string, maxLength: 500, nullable: true }

    ProjectSummary:
      type: object
      additionalProperties: false
      required: [id, workspaceId, workspaceCode, workspaceName, code, name, projectType,
        lifecycle, ownerUserId, ownerDisplayName, actorAccess, capabilities, rowVersion, etag]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        workspaceId: { $ref: '#/components/schemas/Uuid' }
        workspaceCode: { type: string, minLength: 2, maxLength: 32 }
        workspaceName: { type: string, minLength: 1, maxLength: 80 }
        code: { type: string, minLength: 2, maxLength: 32, pattern: '^[A-Z][A-Z0-9_]{1,31}$' }
        name: { type: string, minLength: 1, maxLength: 80 }
        projectType: { $ref: '#/components/schemas/ProjectType' }
        lifecycle: { $ref: '#/components/schemas/ProjectLifecycle' }
        ownerUserId: { $ref: '#/components/schemas/Uuid' }
        ownerDisplayName: { type: string, minLength: 1, maxLength: 200 }
        actorAccess: { $ref: '#/components/schemas/ProjectActorAccess' }
        capabilities: { $ref: '#/components/schemas/ProjectCapabilities' }
        rowVersion: { type: integer, format: int64, minimum: 0, readOnly: true }
        etag: { type: string, pattern: '^"[0-9]+"$', readOnly: true }

    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProjectSummary' } }
        page: { type: integer, format: int32, minimum: 0 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, format: int32, minimum: 0 }

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          additionalProperties: false
          required: [workspaceCode, workspaceName, ownerDisplayName, actorAccess, capabilities,
            etag, createdAt, updatedAt, activatedAt, archivedAt]
          properties:
            workspaceCode: { type: string, minLength: 2, maxLength: 32 }
            workspaceName: { type: string, minLength: 1, maxLength: 80 }
            ownerDisplayName: { type: string, minLength: 1, maxLength: 200 }
            actorAccess: { $ref: '#/components/schemas/ProjectActorAccess' }
            capabilities: { $ref: '#/components/schemas/ProjectCapabilities' }
            etag: { type: string, pattern: '^"[0-9]+"$', readOnly: true }
            createdAt: { type: string, format: date-time, readOnly: true }
            updatedAt: { type: string, format: date-time, readOnly: true }
            activatedAt: { type: string, format: date-time, nullable: true, readOnly: true }
            archivedAt: { type: string, format: date-time, nullable: true, readOnly: true }

    ProjectUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, description, customerName, customerReference, deliverySite, contactNote]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500, nullable: true }
        customerName: { type: string, maxLength: 160, nullable: true }
        customerReference: { type: string, maxLength: 80, nullable: true }
        deliverySite: { type: string, maxLength: 160, nullable: true }
        contactNote: { type: string, maxLength: 500, nullable: true }

    ProjectMembershipStatus:
      type: string
      enum: [ACTIVE, REMOVED]

    ProjectMembershipStatusFilter:
      type: string
      enum: [ACTIVE, REMOVED, ALL]
      default: ALL

    ProjectMember:
      type: object
      additionalProperties: false
      required: [membershipId, projectId, userId, displayName, employmentStatus, accountStatus,
        membershipStatus, owner, joinedAt, joinedByUserId, removedAt, removedByUserId, rowVersion, etag]
      properties:
        membershipId: { $ref: '#/components/schemas/Uuid' }
        projectId: { $ref: '#/components/schemas/Uuid' }
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        employmentStatus: { type: string, enum: [ACTIVE, LEFT] }
        accountStatus: { type: string, enum: [ENABLED, DISABLED] }
        membershipStatus: { $ref: '#/components/schemas/ProjectMembershipStatus' }
        owner: { type: boolean }
        joinedAt: { type: string, format: date-time }
        joinedByUserId: { $ref: '#/components/schemas/Uuid' }
        removedAt: { type: string, format: date-time, nullable: true }
        removedByUserId: { type: string, format: uuid, nullable: true }
        rowVersion: { type: integer, format: int64, minimum: 0, readOnly: true }
        etag: { type: string, pattern: '^"[0-9]+"$', readOnly: true }

    ProjectMemberPage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProjectMember' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    ProjectMemberCandidate:
      type: object
      additionalProperties: false
      required: [userId, displayName, employmentStatus, accountStatus, membershipStatus, owner,
        membershipRowVersion, membershipEtag]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        employmentStatus: { type: string, enum: [ACTIVE] }
        accountStatus: { type: string, enum: [ENABLED] }
        membershipStatus: { type: string, enum: [ACTIVE, REMOVED], nullable: true }
        owner: { type: boolean }
        membershipRowVersion: { type: integer, format: int64, minimum: 0, nullable: true }
        membershipEtag: { type: string, pattern: '^"[0-9]+"$', nullable: true }

    ProjectMemberCandidatePage:
      type: object
      additionalProperties: false
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProjectMemberCandidate' } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    ProjectMemberAddRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, maxLength: 500, nullable: true }

    ProjectMemberRemoveRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, maxLength: 500, nullable: true }

    ProjectOwnerReassignmentRequest:
      type: object
      additionalProperties: false
      required: [newOwnerUserId, reason]
      properties:
        newOwnerUserId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 10, maxLength: 500 }

    ContentStatus:
