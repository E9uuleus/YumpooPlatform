version: 2

# 依赖更新进入集成分支 dev，经常规 PR 门禁后随晋升发布。安全更新不受冷却期限制。
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    # 小版本与补丁合并为一个 PR；大版本各自单独评审。
    groups:
      npm-production:
        patterns: ['*']
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        patterns: ['*']
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    groups:
      maven:
        patterns: ['*']
        update-types: [minor, patch]
