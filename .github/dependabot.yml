version: 2

# 只自动提出漏洞修复；安全更新使用仓库默认分支 dev，经常规 PR 门禁后随晋升发布。
# open-pull-requests-limit: 0 只关闭常规版本更新，不限制安全更新。
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    # 安全修复的小版本与补丁分组；必须跨大版本的修复单独评审。
    groups:
      npm-production:
        applies-to: security-updates
        patterns: ['*']
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        applies-to: security-updates
        patterns: ['*']
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /backend
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      maven:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
