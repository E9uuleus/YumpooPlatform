name: Main Promotion Policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: main-promotion-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion:
    name: Main Promotion Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the promotion merge result with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check promotion rules and post the release delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/promotion-policy.mjs
