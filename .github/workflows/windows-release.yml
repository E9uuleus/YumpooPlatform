name: Windows Server Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published server-v* tag; select this same tag as the workflow ref
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: windows-server-release-wecom-dev
  cancel-in-progress: false

jobs:
  verify:
    name: Verify immutable Release assets
    if: ${{ github.repository == 'E9uuleus/YumpooPlatform' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'server-v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Checkout release workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify deployment client regression tests
        run: node --test tools/release/*.test.mjs
      - name: Verify exact main CI attempt and the immutable package bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node tools/release/promote-release.mjs
      - name: Notify release verification failure
        if: ${{ failure() }}
        env:
          WECOM_RELEASE_WEBHOOK: ${{ secrets.WECOM_RELEASE_WEBHOOK }}
          MONITOR_ENABLED: ${{ vars.MONITOR_ENABLED }}
          MONITOR_ENVIRONMENT: wecom-dev
          MONITOR_SSH_HOST: ${{ secrets.MONITOR_SSH_HOST }}
          MONITOR_SSH_KEY: ${{ secrets.MONITOR_SSH_KEY }}
          MONITOR_KNOWN_HOSTS: ${{ secrets.MONITOR_KNOWN_HOSTS }}
          MONITOR_SOURCE_SECRET: ${{ secrets.MONITOR_SOURCE_SECRET }}
          NOTIFY_TEXT: "**Yumpoo 发布校验失败：${{ github.event.release.tag_name || inputs.tag }}**\n> 未提交部署，站点未变动。\n> 日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: node tools/release/notify.mjs

  deploy:
    name: Deploy retained package to Windows
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: wecom-dev
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Checkout verified release workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Submit request and reconnect until the server task finishes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DEPLOY_MODE: deploy
          WINDOWS_DEPLOY_HOST: ${{ secrets.WINDOWS_DEPLOY_HOST }}
          WINDOWS_DEPLOY_SSH_KEY: ${{ secrets.WINDOWS_DEPLOY_SSH_KEY }}
          WINDOWS_DEPLOY_KNOWN_HOSTS: ${{ secrets.WINDOWS_DEPLOY_KNOWN_HOSTS }}
          WINDOWS_DEPLOY_PORT: ${{ vars.WINDOWS_DEPLOY_PORT || '22' }}
        run: node tools/release/ssh-deploy.mjs
      - name: Notify deployment job failure
        if: ${{ failure() }}
        env:
          WECOM_RELEASE_WEBHOOK: ${{ secrets.WECOM_RELEASE_WEBHOOK }}
          MONITOR_ENABLED: ${{ vars.MONITOR_ENABLED }}
          MONITOR_ENVIRONMENT: wecom-dev
          MONITOR_SSH_HOST: ${{ secrets.MONITOR_SSH_HOST }}
          MONITOR_SSH_KEY: ${{ secrets.MONITOR_SSH_KEY }}
          MONITOR_KNOWN_HOSTS: ${{ secrets.MONITOR_KNOWN_HOSTS }}
          MONITOR_SOURCE_SECRET: ${{ secrets.MONITOR_SOURCE_SECRET }}
          NOTIFY_TEXT: "**Yumpoo 部署作业失败：${{ github.event.release.tag_name || inputs.tag }}**\n> 服务器任务的最终状态以主机通知为准。\n> 日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: node tools/release/notify.mjs
