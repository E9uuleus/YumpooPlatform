name: Release Notes Policy

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: release-notes-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  notes:
    name: Release Notes Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Only the PR description is checked; Release bodies are built from it, so a missing section blocks the merge.
      - name: Checkout the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check the PR release notes
        run: node tools/release/release-notes-policy.mjs
