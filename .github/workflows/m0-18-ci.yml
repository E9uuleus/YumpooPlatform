name: Platform CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Git commit or ref used as the compatibility baseline
        required: true
        default: origin/dev

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: M0 Portable Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      YUMPOO_CI_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.base_ref }}
      YUMPOO_M018_HEAD_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    outputs:
      handoff-digest: ${{ steps.handoff_upload.outputs.artifact-digest }}
      completed: ${{ steps.completed.outputs.completed }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Contracts, policy, frontend and desktop regression
        run: pnpm ci:static
      - name: Preflight Linux-container Docker
        run: |
          docker version
          docker info
          docker pull postgres:17.10-alpine
      - name: Backend, migrations, security and backup restore
        run: pnpm ci:backend
      - name: Packaged HTTP and portable handoff
        run: pnpm ci:portable
      - name: Upload portable HTTP report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m1-13-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: out/m1-13/verification-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload tested portable handoff
        id: handoff_upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m0-18-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/m0-18/portable-handoff
            out/m0-17/backup-set/manifest.json
            out/m0-17/retention-plan.json
            out/m0-17/verification-report.json
          if-no-files-found: error
          retention-days: 1
      - name: Record complete portable execution
        id: completed
        run: echo "completed=true" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostics even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/ci/*.json
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

  windows_delivery:
    name: Windows Delivery
    needs: [linux]
    runs-on: windows-2022
    timeout-minutes: 45
    # 只有本任务签署构建证明；OIDC 与证明写权限不授予其他任务。
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      completed: ${{ steps.completed.outputs.completed }}
    steps:
      - name: Checkout the same tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Download exact portable handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: m0-18-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: out
      - name: Windows packaging, PowerShell and payload integrity
        env:
          YUMPOO_M018_HANDOFF_ARTIFACT_NAME: m0-18-portable-${{ github.run_id }}-${{ github.run_attempt }}
          YUMPOO_M018_HANDOFF_ARTIFACT_DIGEST: ${{ needs.linux.outputs.handoff-digest }}
        run: pnpm ci:windows
      # 只有推送 CI 的产物可能被发布；PR 运行（含 fork 与 Dependabot）没有 OIDC 令牌。
      - name: Attest server package and SBOM build provenance
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/m1-15/yumpoo-windows-server-m1-15.zip
            out/m1-15/yumpoo-server.cdx.json
            out/m1-15/yumpoo-web.cdx.json
      - name: Attest desktop installer, update metadata and SBOM build provenance
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/desktop/*
      - name: Upload Windows server package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m1-15-server-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            out/m1-15/yumpoo-windows-server-m1-15.zip
            out/m1-15/yumpoo-windows-server-m1-15.zip.sha256
            out/m1-15/artifact-manifest.json
            out/m1-15/yumpoo-server.cdx.json
            out/m1-15/yumpoo-web.cdx.json
            out/m1-15/verification-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload desktop release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ github.sha }}-${{ github.run_attempt }}
          path: out/desktop/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload final evidence pack
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m0-18-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: out/m0-18/evidence-pack
          if-no-files-found: error
          retention-days: 30
      - name: Record complete Windows execution
        id: completed
        run: '"completed=true" >> $env:GITHUB_OUTPUT'
      - name: Upload Windows diagnostics even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/ci/*.json
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: M0 Windows x64 Gate
    needs: [linux, windows_delivery]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout merge gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject a cancelled workflow
        if: ${{ cancelled() }}
        run: exit 1
      - name: Require every mandatory job and completion receipt
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node tools/ci/gate.mjs
