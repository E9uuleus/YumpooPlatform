name: Back-merge Main

# dev pushes re-check too: merging an older back-merge PR may still leave later hotfixes missing.
on:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: back-merge-main
  cancel-in-progress: false

jobs:
  back-merge:
    name: Open main to dev back-merge when needed
    if: ${{ github.repository == 'E9uuleus/YumpooPlatform' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout with main and dev history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Open a back-merge PR if main has changes dev lacks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/back-merge.mjs
