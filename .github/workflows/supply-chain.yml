name: Supply Chain

on:
  pull_request:
    branches: [dev, main]
  schedule:
    # 每周一北京时间 09:17，在 Dependabot 周更之后。
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency_review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never
          show-patched-versions: true
          retry-on-snapshot-warnings: true

  workflow_audit:
    name: Workflow Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows and Dependabot configuration with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          persona: regular
          advanced-security: false
          annotations: true

  osv_scan:
    name: OSV Scan (${{ matrix.ref }})
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # dev 是下一次发布的内容，main 是线上运行的代码。
        ref: [dev, main]
    steps:
      - name: Checkout the scanned branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Scan lockfiles and Maven dependencies against OSV
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --recursive
            ./

  release_rehearsal:
    name: Release Rehearsal
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      # 与 Prepare Release 一样运行 main 自身的发布工具，并以只读令牌核验 main 头部。
      - name: Checkout main release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify release tooling regression tests
        run: node --test tools/release/*.test.mjs
      - name: Rehearse the draft or re-verify the published main head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f tools/release/rehearse-release.mjs ]; then
            echo "::notice::main does not contain the release rehearsal yet; it starts with the first promotion that includes it"
            exit 0
          fi
          node tools/release/rehearse-release.mjs

  notify:
    name: Notify scheduled failure
    needs: [workflow_audit, osv_scan, release_rehearsal]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout notifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Notify WeCom
        env:
          WECOM_RELEASE_WEBHOOK: ${{ secrets.WECOM_RELEASE_WEBHOOK }}
          MONITOR_ENABLED: ${{ vars.MONITOR_ENABLED }}
          MONITOR_ENVIRONMENT: wecom-dev
          MONITOR_SSH_HOST: ${{ secrets.MONITOR_SSH_HOST }}
          MONITOR_SSH_KEY: ${{ secrets.MONITOR_SSH_KEY }}
          MONITOR_KNOWN_HOSTS: ${{ secrets.MONITOR_KNOWN_HOSTS }}
          MONITOR_SOURCE_SECRET: ${{ secrets.MONITOR_SOURCE_SECRET }}
          NOTIFY_TEXT: "**Yumpoo 每周供应链检查失败**\n> 漏洞扫描、工作流审计或发布演练未通过。\n> 日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: node tools/release/notify.mjs
