# M1-14 普通生产配置模板。复制到 C:\ProgramData\Yumpoo\config 后按目标机修改。
# 密码不得写入本文件；secrets 目录必须由专用服务账号以 ACL 保护。
server:
  address: 127.0.0.1
  port: 8100

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/yumpoo
    username: yumpoo_app
  flyway:
    url: jdbc:postgresql://127.0.0.1:5432/yumpoo
    user: yumpoo_migrator

yumpoo:
  wecom:
    oauth:
      enabled: false
      corp-id: ww-replace-with-corp-id
      agent-id: replace-with-agent-id
      callback-uri: https://wecom-dev.yumpoo.com/api/v1/auth/wecom/callback
      electron-callback-uri: https://wecom-dev.yumpoo.com/api/v1/electron/auth/wecom/callback
      connect-timeout: 5s
      read-timeout: 20s
    directory:
      enabled: false
      corp-id: ww-replace-with-corp-id
      page-size: 1000
      lease-duration: 5m
      connect-timeout: 5s
      read-timeout: 20s
  session:
    idle-timeout: 8h
    absolute-timeout: 7d
    revoked-retention: 24h
    cleanup-delay: 1h
    purge-batch-size: 500
    purge-max-batches: 10
  maintenance:
    initial-identity:
      enabled: false
  deployment:
    public-base-url: https://wecom-dev.yumpoo.com
    release-root: C:/Program Files/Yumpoo/releases/current
    config-root: C:/ProgramData/Yumpoo/config
    secrets-root: C:/ProgramData/Yumpoo/secrets
    attachment-root: C:/ProgramData/Yumpoo/data/attachments
    upload-temp-root: C:/ProgramData/Yumpoo/temp/uploads
    log-root: C:/ProgramData/Yumpoo/logs
  attachments:
    company-quota-bytes: 107374182400
    project-quota-bytes: 10737418240
    scan-concurrency: 2
    scan-lease: 5m
    upload-lease: 15m
    first-scan-retry: 5s
    second-scan-retry: 30s
    attachment-root: C:/ProgramData/Yumpoo/data/attachments
    upload-temp-root: C:/ProgramData/Yumpoo/temp/uploads
    defender-executable: ${YUMPOO_DEFENDER_EXECUTABLE}
    defender-timeout: 2m
    cleanup-delete-enabled: ${YUMPOO_ATTACHMENT_CLEANUP_DELETE_ENABLED:false}
    cleanup-approval-reference: ${YUMPOO_ATTACHMENT_CLEANUP_APPROVAL_REFERENCE:}
    maintenance-initial-delay: 5m
    maintenance-poll-delay: 1m
    maintenance-interval: 24h
    maintenance-batch-size: 100
