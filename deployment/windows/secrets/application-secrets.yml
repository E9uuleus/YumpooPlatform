# M0-16 Secret 模板。部署时替换两个占位值并限制 ACL；不要提交真实值。
spring:
  datasource:
    password: change-me-application-password
  flyway:
    password: change-me-migration-password

yumpoo:
  session:
    current-key-version: prod-v1
    current-key: change-me-base64-session-key
    previous-key-version: ""
    previous-key: ""
    previous-accept-until: ""
