# M0-16 Secret 模板。部署时替换全部占位值并限制 ACL；不要提交真实值。
spring:
  datasource:
    password: change-me-application-password
  flyway:
    password: change-me-migration-password

yumpoo:
  wecom:
    oauth:
      app-secret: change-me-wecom-oauth-app-secret
    directory:
      directory-secret: change-me-wecom-directory-secret
      profile-secret: change-me-wecom-profile-secret
  session:
    current-key-version: prod-v1
    current-key: change-me-base64-session-key
    previous-key-version: ""
    previous-key: ""
    previous-accept-until: ""
