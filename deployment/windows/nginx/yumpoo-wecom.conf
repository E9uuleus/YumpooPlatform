# Yumpoo production virtual hosts for wecom-dev.yumpoo.com.
# Load this file from the main nginx.conf http block, for example:
# include C:/nginx/conf/conf.d/*.conf;

# Internal static SPA listener. It is intentionally loopback-only; do not expose
# 18173 through Windows Firewall or a cloud security group.
server {
    listen 127.0.0.1:18173 default_server;
    server_name _;
    root "C:/Program Files/Yumpoo/releases/current/web";
    index index.html;

    location ~ ^/(api|actuator|_m0)(/|$) {
        return 404;
    }

    location = /web.config {
        return 404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

server {
    listen 443 ssl;
    server_name wecom-dev.yumpoo.com;

    ssl_certificate     C:/nginx/certificates/yumpoo.com.pem;
    ssl_certificate_key C:/nginx/certificates/yumpoo.com.key;

    client_max_body_size 110m;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Only public runtime probes; every other actuator path stays denied below.
    location = /healthz {
        proxy_pass http://127.0.0.1:8100/actuator/health/readiness;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /version.json {
        proxy_pass http://127.0.0.1:8100/actuator/info;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location ~ ^/(actuator|_m0)(/|$) {
        return 404;
    }

    # Desktop update feed and download page data, written only by the SYSTEM deployment engine (desktop-publish).
    # root maps /desktop/<channel>/... to <desktopFeed.root>/desktop/<channel>/...; keep it equal to host.json.
    # add_header in this block replaces the server-level headers, so the security headers are repeated here.
    location ^~ /desktop/ {
        root "C:/ProgramData/Yumpoo/public";
        autoindex off;
        default_type application/octet-stream;
        types {
            application/json json;
            text/yaml yml;
        }
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Mutable pointers: clients and the download page must always see the latest complete version.
        location ~ ^/desktop/[a-z][a-z0-9-]*/(latest\.yml|release\.json)$ {
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-cache" always;
        }
    }

    location = /api {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:18173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
