# Only this read-only gateway is forwarded to the monitoring host.
server {
    listen 127.0.0.1:19100;
    server_name _;
    access_log off;
    location = /metrics/windows {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:9182/metrics;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location = /metrics/app {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8100/actuator/prometheus;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
