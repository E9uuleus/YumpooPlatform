global:
  resolve_timeout: 5m
route:
  receiver: monitor-hub
  group_by: [alertname, service, severity]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h
receivers:
  - name: monitor-hub
    webhook_configs:
      - url: http://127.0.0.1:8788/internal/v1/alerts
        send_resolved: true
        max_alerts: 100
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alert-token
inhibit_rules:
  - source_matchers: ['alertname="DatabaseUnavailable"']
    target_matchers: ['alertname="ApplicationRuleFiring"', 'rule="DB_UNAVAILABLE"']
    equal: [instance]
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, instance, rule]
