modules:
  web:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      follow_redirects: false
      fail_if_body_not_matches_regexp: ['<html']
  health:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      follow_redirects: false
      fail_if_body_not_matches_regexp: ['"status"\s*:\s*"UP"']
  version:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      follow_redirects: false
      fail_if_body_not_matches_regexp: ['"commit"\s*:\s*"[a-f0-9]{40}"', '"tag"\s*:\s*"server-v']
  auth:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      follow_redirects: false
      valid_status_codes: [401]
  manifest:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      follow_redirects: false
      fail_if_body_not_matches_regexp: ['"sha256"\s*:\s*"[a-f0-9]{64}"', '"tag"\s*:\s*"desktop-v']
  asset:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      follow_redirects: false
      method: HEAD
      fail_if_header_matches:
        - header: Content-Type
          regexp: text/html
  installer:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      follow_redirects: false
      method: HEAD
      fail_if_header_matches:
        - header: Content-Type
          regexp: text/html
