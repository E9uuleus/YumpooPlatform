# Installed under /etc/ssh/sshd_config.d/ after validating exact account names and keys.
Match User yumpoo-monitor-windows
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding yes
    PermitOpen 127.0.0.1:8788
    PermitListen 127.0.0.1:19100
    GatewayPorts no
    MaxSessions 0
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
Match User yumpoo-monitor-github
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8788
    PermitListen none
    GatewayPorts no
    MaxSessions 0
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
Match all
